<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายงานผลการตรวจสอบสถานี</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <script src="constants.js"></script>

    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Prompt', 'sans-serif'] }, 
                    colors: { 
                        sky: { 50: '#f0f9ff', 100: '#e0f2fe', 400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7' },
                        rose: { 50: '#fff1f2', 100: '#ffe4e6', 400: '#fb7185', 500: '#f43f5e', 600: '#e11d48' },
                        emerald: { 50: '#ecfdf5', 100: '#d1fae5', 400: '#34d399', 500: '#10b981', 600: '#059669' },
                        violet: { 50: '#f5f3ff', 100: '#ede9fe', 400: '#a78bfa', 500: '#8b5cf6' }
                    } 
                } 
            } 
        }
    </script>
    <style>
        body {
            /* พื้นหลังสไตล์ 3D Cartoon */
            background-color: #fffbeb; 
            color: #334155;
            background-image: radial-gradient(#fde047 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }
        
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: #fef08a; border-radius: 8px; }
        ::-webkit-scrollbar-thumb { background: #facc15; border-radius: 8px; border: 2px solid #fffbeb; }

        /* 3D Container Cards */
        .puffy-container {
            background-color: #ffffff;
            border-radius: 24px;
            border: 4px solid #f8fafc;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.01);
        }

        /* 3D Input Fields */
        .puffy-input {
            background-color: #f8fafc;
            border: 2px solid #e2e8f0;
            color: #334155;
            transition: all 0.2s ease;
            font-weight: 600;
        }
        .puffy-input:focus {
            outline: none;
            border-color: #38bdf8;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.2);
        }

        /* 3D Buttons */
        .btn-puffy-blue {
            background-color: #38bdf8;
            color: white;
            border-radius: 12px;
            box-shadow: 0 4px 0 #0284c7;
            transition: all 0.15s ease;
            font-weight: 700;
        }
        .btn-puffy-blue:active { transform: translateY(4px); box-shadow: 0 0px 0 #0284c7; }

        /* Table & Badges */
        .table-container { max-height: 60vh; overflow-y: auto; border-radius: 16px; border: 2px solid #e2e8f0; } 
        thead th { position: sticky; top: 0; z-index: 10; background-color: #f8fafc; border-bottom: 2px solid #e2e8f0; }
        
        .badge { display: inline-flex; align-items: center; justify-content: center; padding: 0.35rem 0.85rem; border-radius: 12px; font-size: 0.85rem; font-weight: 700; border: 2px solid transparent; }
        .badge-p { background-color: #d1fae5; color: #059669; border-color: #6ee7b7; } 
        .badge-o { background-color: #ffe4e6; color: #e11d48; border-color: #fda4af; } 
        .badge-null { background-color: #f1f5f9; color: #64748b; border-color: #cbd5e1; }

        .truncate-text { max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* 3D Stats Card */
        .stat-card {
            border: 2px solid;
            border-radius: 16px;
            padding: 12px 16px;
            transition: transform 0.2s;
        }
        .stat-card:hover { transform: translateY(-3px); }
        .stat-total { background-color: #f8fafc; border-color: #cbd5e1; color: #475569; box-shadow: 0 4px 0 #e2e8f0; }
        .stat-ready { background-color: #ecfdf5; border-color: #a7f3d0; color: #059669; box-shadow: 0 4px 0 #d1fae5; }
        .stat-broken { background-color: #fff1f2; border-color: #fecaca; color: #e11d48; box-shadow: 0 4px 0 #ffe4e6; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col font-sans">
    
    <!-- Header สไตล์ 3D Cartoon -->
    <header class="bg-white/90 backdrop-blur-md border-b-4 border-slate-100 sticky top-0 z-50 py-3 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 flex justify-between items-center">
            <div class="flex items-center space-x-3 md:space-x-4">
                <a href="index.html" class="w-12 h-12 rounded-2xl bg-white border-2 border-slate-200 flex items-center justify-center text-slate-500 hover:text-sky-500 hover:border-sky-200 transition-all shadow-sm active:translate-y-1">
                    <i class="ph-bold ph-caret-left text-2xl"></i>
                </a>
                <div class="hidden md:flex w-12 h-12 rounded-2xl bg-sky-100 border-2 border-sky-300 items-center justify-center shadow-sm">
                    <i class="ph-fill ph-files text-sky-500 text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl font-extrabold text-slate-800 tracking-tight">
                        รายงาน <span class="text-sky-500">ผลการตรวจสอบ</span>
                    </h1>
                </div>
            </div>
            <div class="text-xs md:text-sm font-bold text-slate-500 hidden sm:flex items-center gap-2 bg-slate-50 px-4 py-2 rounded-xl border-2 border-slate-200">
                <i class="ph-fill ph-info text-sky-500 text-lg"></i>
                <span><strong class="text-emerald-500">P</strong> = ผ่าน, <strong class="text-rose-500">O</strong> = ชำรุด</span>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto w-full px-4 py-8">
        
        <!-- ส่วนตัวกรอง (Filters) -->
        <div class="puffy-container p-6 mb-6 border-t-8 border-t-violet-400">
            <h2 class="text-lg font-bold text-violet-600 mb-4 flex items-center gap-2 border-b-2 border-violet-100 pb-3">
                <i class="ph-fill ph-faders text-2xl"></i> ตัวกรองการค้นหาฐานข้อมูล
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-slate-600 uppercase">งวดที่ตรวจ <span class="text-rose-500">*</span></label>
                    <input type="text" id="sheetSelect" list="sheetList" placeholder="เลือกงวดที่ตรวจ..." class="w-full p-3 rounded-xl puffy-input">
                    <datalist id="sheetList"></datalist>
                </div>
                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-slate-600 uppercase">กลุ่มลุ่มน้ำ</label>
                    <input type="text" id="refNameInput" list="basinList" placeholder="พิมพ์ชื่อลุ่มน้ำ" class="w-full p-3 rounded-xl puffy-input">
                    <datalist id="basinList"></datalist>
                </div>
                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-slate-600 uppercase">สถานะการใช้งาน</label>
                    <select id="statusSelect" class="w-full p-3 rounded-xl puffy-input">
                        <option value="ALL">แสดงทั้งหมด</option>
                        <option value="P">✅ เฉพาะพร้อมใช้งาน (P)</option>
                        <option value="O">❌ เฉพาะชำรุด (O)</option>
                    </select>
                </div>
                <div>
                    <button onclick="applyFilters()" class="w-full btn-puffy-blue px-5 py-3.5 flex justify-center items-center gap-2">
                        <i class="ph-bold ph-magnifying-glass text-lg"></i> ค้นหาข้อมูล
                    </button>
                </div>
            </div>
            <div class="mt-5 pt-4 border-t-2 border-slate-100 flex items-center">
                <input id="filterNameCheck" type="checkbox" class="w-5 h-5 bg-slate-50 border-2 border-slate-300 rounded text-sky-500 accent-sky-500 cursor-pointer">
                <label for="filterNameCheck" class="ml-2.5 text-sm font-bold text-slate-600 cursor-pointer">กรองเฉพาะสถานีที่ระบุ GPS แล้ว</label>
            </div>
        </div>

        <!-- สถานะโหลดข้อมูล & แจ้งเตือน -->
        <div id="loadingIndicator" class="flex flex-col items-center justify-center py-16">
            <i class="ph-bold ph-spinner animate-spin text-5xl text-sky-500 mb-4"></i>
            <p class="text-slate-500 font-bold text-sm">กำลังโหลดข้อมูลน่ารักๆ...</p>
        </div>
        
        <div id="errorContainer" class="hidden bg-rose-50 border-2 border-rose-200 text-rose-700 p-5 rounded-2xl mb-6 flex gap-3 items-start">
            <i class="ph-fill ph-warning-circle text-3xl mt-0.5"></i>
            <div>
                <h3 class="font-extrabold text-lg">แจ้งเตือน</h3>
                <p class="text-sm mt-1 font-medium" id="errorMessage"></p>
            </div>
        </div>

        <!-- พื้นที่แสดงผลข้อมูล -->
        <div id="dataContainer" class="hidden">
            
            <div class="mb-5 flex flex-col lg:flex-row lg:justify-between lg:items-center gap-4">
                <!-- 3D Stats -->
                <div class="grid grid-cols-3 gap-3 sm:flex sm:gap-4 w-full lg:w-auto">
                    <div class="stat-card stat-total flex flex-col sm:flex-row items-center sm:gap-2 justify-center">
                        <span class="text-[10px] sm:text-xs font-bold uppercase opacity-80">ทั้งหมด</span>
                        <span id="countTotal" class="text-xl sm:text-2xl font-extrabold">0</span>
                    </div>
                    <div class="stat-card stat-ready flex flex-col sm:flex-row items-center sm:gap-2 justify-center">
                        <span class="text-[10px] sm:text-xs font-bold uppercase opacity-80">ใช้ได้</span>
                        <span id="countReady" class="text-xl sm:text-2xl font-extrabold">0</span>
                    </div>
                    <div class="stat-card stat-broken flex flex-col sm:flex-row items-center sm:gap-2 justify-center">
                        <span class="text-[10px] sm:text-xs font-bold uppercase opacity-80">ชำรุด</span>
                        <span id="countNotReady" class="text-xl sm:text-2xl font-extrabold">0</span>
                    </div>
                </div>
                
                <!-- ค้นหาย่อยและเรียงลำดับ -->
                <div class="flex flex-col sm:flex-row items-center gap-3 w-full lg:w-auto">
                    <div class="relative w-full sm:w-64">
                        <div class="absolute inset-y-0 left-0 flex items-center pl-3">
                            <i class="ph-bold ph-magnifying-glass text-slate-400 text-lg"></i>
                        </div>
                        <input type="text" id="localSearchInput" onkeyup="applySortAndFilter()" placeholder="ค้นหารหัส/ชื่อสถานี..." class="puffy-input rounded-xl block w-full py-2.5 pl-10 pr-3 text-sm">
                    </div>
                    <select id="sortSelect" onchange="applySortAndFilter()" class="puffy-input rounded-xl block w-full sm:w-auto py-2.5 px-4 text-sm font-bold text-slate-600">
                        <option value="newest" selected>เรียงใหม่ ➜ เก่า</option>
                        <option value="oldest">เรียงเก่า ➜ ใหม่</option>
                    </select>
                </div>
            </div>

            <!-- ตารางสำหรับ Desktop -->
            <div class="hidden lg:block bg-white rounded-2xl border-4 border-slate-100 overflow-hidden shadow-sm">
                <div class="table-container">
                    <table class="min-w-full divide-y-2 divide-slate-200 text-left">
                        <thead>
                            <tr>
                                <th class="px-5 py-4 text-xs font-bold text-slate-500 uppercase bg-slate-50">รหัสสถานี</th>
                                <th class="px-5 py-4 text-xs font-bold text-slate-500 uppercase bg-slate-50">ชื่อสถานี</th>
                                <th class="px-5 py-4 text-xs font-bold text-slate-500 uppercase bg-slate-50">ลุ่มน้ำ</th>
                                <th class="px-5 py-4 text-xs font-bold text-slate-500 uppercase text-center bg-slate-50">พร้อมใช้งาน</th>
                                <th class="px-5 py-4 text-xs font-bold text-slate-500 uppercase text-center bg-slate-50">ความสะอาด</th>
                                <th class="px-5 py-4 text-xs font-bold text-slate-500 uppercase bg-slate-50">ที่ตั้งอาคาร</th>
                                <th class="px-5 py-4 text-xs font-bold text-slate-500 uppercase bg-slate-50">อุปกรณ์ชำรุด</th>
                                <th class="px-5 py-4 text-xs font-bold text-slate-500 uppercase bg-slate-50">อธิบายเพิ่มเติม</th>
                                <th class="px-5 py-4 text-xs font-bold text-slate-500 uppercase bg-slate-50">คอมเม้นจากกรรมการ</th>
                            </tr>
                        </thead>
                        <tbody id="desktopTableBody" class="divide-y divide-slate-100 bg-white"></tbody>
                    </table>
                </div>
            </div>

            <!-- การ์ดสำหรับ Mobile -->
            <div id="mobileCardContainer" class="lg:hidden flex flex-col gap-4"></div>
        </div>

        <!-- หน้าจอตอนไม่พบข้อมูล -->
        <div id="emptyState" class="hidden puffy-container py-16 text-center mt-4 border-dashed border-slate-300">
            <div class="w-20 h-20 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4 border-4 border-white shadow-sm">
                <i class="ph-fill ph-magnifying-glass text-4xl text-slate-300"></i>
            </div>
            <h3 class="text-xl font-extrabold text-slate-600">ไม่พบข้อมูลที่ค้นหา</h3>
            <p class="text-slate-400 font-medium text-sm mt-1">ลองเปลี่ยนเงื่อนไขการค้นหาดูนะ</p>
        </div>
    </main>

    <script>
        let globalRawData = [];
        let globalFetchedData = [];

        // ฟังก์ชันหลีกเลี่ยง HTML Injection
        function escapeHtml(unsafe) {
            return (unsafe || '').toString()
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        // === ตั้งค่ากลุ่มอุปกรณ์ ===
        const equipNames = {
            power: "ระบบไฟฟ้าภายนอกภายใน", sta_cpu: "CPU Status", sta_ai: "AI Status", sta_di: "DI Status",
            sta_do: "DO Status", sta_io: "IO Status", sta_m1: "Modem 1", sta_m2: "Modem 2", plc: "RTU PLC",
            sta_p1: "Power Supply 1", sta_p2: "Power Supply 2", sta_cctv1: "CCTV1", sta_cctv2: "CCTV2",
            sta_r: "Rain Gauge", sta_s: "Surge Protection", sta_wl: "Water Level (bubble)", sta_tro: "ท่อลม",
            sta_gass: "ถังแก๊ส", sta_wl2: "Water Level (float)", sta_saling: "สายสลิง", sta_wl1: "Water Level (Radar)"
        };

        const isBrokenValue = (val) => {
            const v = (val || '').toString().trim().toLowerCase();
            return v === 'o' || v === 'ชำรุด' || v === '0' || v === 'ไม่ผ่าน' || v === 'ไม่ถูกต้อง';
        };

        window.addEventListener('load', initializeFilters);

        async function initializeFilters() {
            const sheetSelect = document.getElementById('sheetSelect');
            const sheetList = document.getElementById('sheetList');
            const basinList = document.getElementById('basinList');
            
            ["งวดที่1", "งวดที่2", "งวดที่3", "งวดที่4"].forEach(s => sheetList.innerHTML += `<option value="${s}">`);
            sheetSelect.value = "งวดที่1";
            
            if (typeof hardcodedBasins !== 'undefined') {
                hardcodedBasins.forEach(b => basinList.innerHTML += `<option value="${b}">`);
            }

            try {
                const response = await fetch(`https://ma-inspection-project.onrender.com/api/inspections?t=${new Date().getTime()}`);
                const result = await response.json();
                if (response.ok && result.success) {
                    globalRawData = result.data;
                    applyFilters(); 
                } else throw new Error(result.message);
            } catch (err) { showError(err.message); }
        }

        function applyFilters() {
            const sheetName = document.getElementById('sheetSelect').value.trim();
            const refName = document.getElementById('refNameInput').value.trim();
            const isFilterName = document.getElementById('filterNameCheck').checked;
            const statusMode = document.getElementById('statusSelect').value;

            if (!sheetName) { showError("กรุณาเลือกงวดที่ตรวจ"); return; }

            document.getElementById('loadingIndicator').classList.add('hidden');
            document.getElementById('errorContainer').classList.add('hidden');

            let output = [];
            globalRawData.forEach(row => {
                if (row.saya !== sheetName) return;
                if (refName && row.code !== refName) return;
                if (isFilterName && (!row.lat || !row.lon)) return;

                let reasons = [];
                Object.keys(equipNames).forEach(key => {
                    if (isBrokenValue(row[key])) reasons.push(equipNames[key]);
                });

                let isSystemBroken = false;
                
                // กลุ่ม A
                const groupA = ['power', 'sta_cpu', 'sta_ai', 'sta_di', 'sta_do', 'sta_io', 'plc', 'sta_cctv1', 'sta_cctv2', 'sta_r', 'sta_s', 'sta_wl', 'sta_tro', 'sta_gass', 'sta_wl2', 'sta_saling', 'sta_wl1'];
                if (groupA.some(key => isBrokenValue(row[key]))) {
                    isSystemBroken = true;
                }

                // กลุ่ม B1: Modem (ต้อง O ทั้งคู่ถึงจะพัง)
                if (isBrokenValue(row.sta_m1) && isBrokenValue(row.sta_m2)) {
                    isSystemBroken = true;
                }

                // กลุ่ม B2: Power Supply (ต้อง O ทั้งคู่ถึงจะพัง)
                if (isBrokenValue(row.sta_p1) && isBrokenValue(row.sta_p2)) {
                    isSystemBroken = true;
                }

                let readyStatusCode = isSystemBroken ? 'O' : 'P';
                if (statusMode !== 'ALL' && statusMode !== readyStatusCode) return;

                let cleanStatusStr = row.clean || '-';
                const cleanLower = cleanStatusStr.toString().trim().toLowerCase();
                if (cleanLower === 'o' || cleanLower === 'ไม่ผ่าน') cleanStatusStr = 'ไม่ผ่าน';
                else if (cleanLower === 'p' || cleanLower === 'ผ่าน') cleanStatusStr = 'ผ่าน';

                output.push({
                    stationCode: row.id_name || '-', stationName: row.name_id || '-', basin: row.code || '-',
                    readyStatus: isSystemBroken ? 'ใช้ไม่ได้' : 'ใช้ได้',
                    cleanStatus: cleanStatusStr,
                    location: row.install_status || '-',
                    brokenEquip: reasons.length > 0 ? reasons.join(', ') : '-',
                    note: row.note || '-', comment: row.note2 || '-'
                });
            });

            renderData(output);
        }

        function getBadge(value) {
            const checkVal = value ? value.trim().toUpperCase() : '';
            if (checkVal === 'P' || checkVal === 'ใช้ได้' || checkVal === 'ผ่าน') return `<span class="badge badge-p"><i class="ph-bold ph-check mr-1"></i> ${value}</span>`;
            if (checkVal === 'O' || checkVal === 'ใช้ไม่ได้' || checkVal === 'ไม่ผ่าน' || checkVal === 'ชำรุด') return `<span class="badge badge-o"><i class="ph-bold ph-x mr-1"></i> ${value}</span>`;
            return `<span class="badge badge-null">${value || '-'}</span>`;
        }

        function renderData(processedData) {
            globalFetchedData = processedData;
            let ready = 0, notReady = 0;
            globalFetchedData.forEach(i => { if(i.readyStatus === 'ใช้ได้') ready++; else notReady++; });

            document.getElementById('countTotal').innerText = globalFetchedData.length;
            document.getElementById('countReady').innerText = ready;
            document.getElementById('countNotReady').innerText = notReady;

            if (globalFetchedData.length === 0) {
                document.getElementById('emptyState').classList.remove('hidden');
                document.getElementById('dataContainer').classList.add('hidden');
            } else {
                document.getElementById('dataContainer').classList.remove('hidden');
                document.getElementById('emptyState').classList.add('hidden');
                applySortAndFilter();
            }
        }

        function applySortAndFilter() {
            let displayData = [...globalFetchedData];
            const search = document.getElementById('localSearchInput').value.trim().toLowerCase();
            if (search) displayData = displayData.filter(r => (r.stationCode||'').toLowerCase().includes(search) || (r.stationName||'').toLowerCase().includes(search));
            if (document.getElementById('sortSelect').value === 'oldest') displayData.reverse();
            drawUI(displayData, search !== '');
        }

        function drawUI(data, isSearch) {
            const dtBody = document.getElementById('desktopTableBody'), mbCont = document.getElementById('mobileCardContainer');
            dtBody.innerHTML = ''; mbCont.innerHTML = '';

            if (data.length === 0 && isSearch) {
                dtBody.innerHTML = `<tr><td colspan="9" class="px-5 py-10 text-center text-slate-400 font-bold"><i class="ph-fill ph-magnifying-glass text-2xl mb-2 block text-slate-300"></i> ไม่พบสถานีที่ค้นหา</td></tr>`;
                mbCont.innerHTML = `<div class="bg-white rounded-2xl border-4 border-slate-100 p-8 text-center text-slate-400 font-bold"><i class="ph-fill ph-magnifying-glass text-3xl mb-2 block text-slate-300"></i> ไม่พบสถานี</div>`; return;
            }

            data.forEach((row) => {
                const safeBroken = escapeHtml(row.brokenEquip);
                const safeNote = escapeHtml(row.note);
                const safeComment = escapeHtml(row.comment);
                const safeName = escapeHtml(row.stationName);
                
                // สำหรับ Desktop
                dtBody.innerHTML += `<tr class="hover:bg-slate-50 transition-colors group">
                    <td class="px-5 py-4 whitespace-nowrap text-sm font-extrabold text-sky-600">${escapeHtml(row.stationCode)}</td>
                    <td class="px-5 py-4 whitespace-nowrap text-sm font-bold text-slate-700">${safeName}</td>
                    <td class="px-5 py-4 whitespace-nowrap text-sm font-semibold text-slate-500">${escapeHtml(row.basin)}</td>
                    <td class="px-5 py-4 whitespace-nowrap text-center">${getBadge(row.readyStatus)}</td>
                    <td class="px-5 py-4 whitespace-nowrap text-center">${getBadge(row.cleanStatus)}</td>
                    <td class="px-5 py-4 whitespace-nowrap text-sm font-semibold text-slate-500">${escapeHtml(row.location)}</td>
                    <td class="px-5 py-4 text-sm font-bold text-rose-500"><div class="truncate-text" title="${safeBroken}">${safeBroken}</div></td>
                    <td class="px-5 py-4 text-sm font-medium text-slate-500"><div class="truncate-text" title="${safeNote}">${safeNote}</div></td>
                    <td class="px-5 py-4 text-sm font-medium text-slate-500"><div class="truncate-text" title="${safeComment}">${safeComment}</div></td></tr>`;

                // สำหรับ Mobile 3D Card
                let borderClass = row.readyStatus === 'ใช้ไม่ได้' ? 'border-l-rose-400' : 'border-l-sky-400';
                mbCont.innerHTML += `
                <div class="bg-white p-5 rounded-2xl border-2 border-slate-100 border-l-8 ${borderClass} shadow-sm flex flex-col gap-3">
                    <div>
                        <p class="text-xs font-extrabold text-sky-600 mb-1 flex items-center gap-1.5">
                            <i class="ph-bold ph-tag"></i> ${escapeHtml(row.stationCode)} 
                            <span class="text-slate-400 font-medium bg-slate-100 px-2 py-0.5 rounded-lg ml-1">${escapeHtml(row.basin)}</span>
                        </p>
                        <h3 class="text-base font-extrabold text-slate-800">${safeName}</h3>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-3 mt-1">
                        <div class="bg-slate-50 rounded-xl p-2.5 text-center border-2 border-slate-100">
                            <span class="text-[10px] font-bold text-slate-400 block mb-1.5 uppercase">พร้อมใช้งาน</span>
                            ${getBadge(row.readyStatus)}
                        </div>
                        <div class="bg-slate-50 rounded-xl p-2.5 text-center border-2 border-slate-100">
                            <span class="text-[10px] font-bold text-slate-400 block mb-1.5 uppercase">ความสะอาด</span>
                            ${getBadge(row.cleanStatus)}
                        </div>
                    </div>
                    
                    <div class="flex flex-col gap-2 mt-2 text-xs">
                        <div class="flex justify-between items-center bg-slate-50 p-2 rounded-lg"><span class="text-slate-500 font-bold"><i class="ph-bold ph-map-pin mr-1 text-slate-400"></i> ที่ตั้ง:</span><span class="font-bold text-slate-700">${escapeHtml(row.location)}</span></div>
                        <div class="flex justify-between items-center bg-rose-50 p-2 rounded-lg"><span class="text-rose-500 font-bold"><i class="ph-bold ph-warning-circle mr-1"></i> ชำรุด:</span><span class="font-bold text-rose-600 text-right max-w-[60%] truncate">${safeBroken}</span></div>
                        
                        ${safeNote !== '-' ? `<div class="mt-2"><span class="text-sky-500 block mb-1 font-bold text-[10px] uppercase"><i class="ph-bold ph-note-pencil"></i> อธิบายเพิ่มเติม</span><p class="text-slate-600 font-medium bg-sky-50 p-2.5 rounded-xl border border-sky-100">${safeNote}</p></div>` : ''}
                        ${safeComment !== '-' ? `<div class="mt-1"><span class="text-amber-500 block mb-1 font-bold text-[10px] uppercase"><i class="ph-bold ph-chat-centered-text"></i> กรรมการ</span><p class="text-slate-600 font-medium bg-amber-50 p-2.5 rounded-xl border border-amber-100">${safeComment}</p></div>` : ''}
                    </div>
                </div>`;
            });
        }

        function showError(msg) {
            document.getElementById('loadingIndicator').classList.add('hidden');
            document.getElementById('errorMessage').innerText = msg;
            document.getElementById('errorContainer').classList.remove('hidden');
        }
    </script>
</body>
</html>
