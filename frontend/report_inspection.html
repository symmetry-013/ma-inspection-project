<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายงานผลตรวจสอบสภาพสถานีและอุปกรณ์สนาม</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- นำเข้าข้อมูลส่วนกลาง (hardcodedBasins, stationsData, equipmentMap) -->
    <script src="constants.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #fffbeb; 
            color: #334155;
            background-image: radial-gradient(#fde047 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }

        .puffy-container {
            background-color: #ffffff;
            border-radius: 28px;
            border: 4px solid #f8fafc;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.01);
        }

        .puffy-input {
            background-color: #f8fafc;
            border: 2px solid #e2e8f0;
            color: #334155;
            transition: all 0.2s ease;
            font-weight: 600;
        }
        .puffy-input:focus {
            outline: none;
            border-color: #f59e0b;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.15);
        }

        .btn-puffy-amber {
            background-color: #f59e0b;
            color: white;
            border-radius: 16px;
            box-shadow: 0 6px 0 #d97706;
            transition: all 0.1s ease;
        }
        .btn-puffy-amber:active:not(:disabled) { transform: translateY(6px); box-shadow: 0 0px 0 #d97706; }
        .btn-puffy-amber:disabled { background-color: #94a3b8; box-shadow: 0 6px 0 #64748b; cursor: not-allowed; opacity: 0.7; }

        .station-report-card {
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 24px;
            transition: all 0.2s ease;
            overflow: hidden;
        }
        .station-report-card:hover {
            border-color: #fcd34d;
            box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.1);
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col pb-12">

    <!-- Header -->
    <header class="bg-white/95 backdrop-blur-md border-b-4 border-amber-100 sticky top-0 z-40 py-3.5 shadow-sm">
        <div class="container mx-auto px-4 flex justify-between items-center max-w-6xl">
            <div class="flex items-center space-x-3 md:space-x-4">
                <a href="index.html" class="w-11 h-11 md:w-12 md:h-12 rounded-2xl bg-white border-2 border-slate-200 flex items-center justify-center text-slate-500 hover:text-amber-500 hover:border-amber-200 transition-all shadow-sm active:translate-y-1 shrink-0">
                    <i class="ph-bold ph-caret-left text-2xl"></i>
                </a>
                <div class="hidden sm:flex w-12 h-12 rounded-2xl bg-amber-100 border-2 border-amber-300 items-center justify-center shadow-sm shrink-0">
                    <i class="ph-fill ph-clipboard-text text-amber-500 text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-lg md:text-2xl font-extrabold text-slate-800 tracking-tight">
                        รายงานผล <span class="text-amber-500">ตรวจสอบสภาพสถานี</span>
                    </h1>
                    <p class="text-[11px] md:text-xs font-bold text-slate-400">
                        สรุปความพร้อมใช้งาน ความสะอาด อุปกรณ์สนาม พิกัด GPS และภาพถ่ายหน้างาน
                    </p>
                </div>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-6 max-w-6xl flex-grow space-y-6">

        <!-- ตัวกรองข้อมูล -->
        <div class="puffy-container p-5 md:p-7 border-t-8 border-t-amber-400">
            <h2 class="text-sm md:text-base font-extrabold text-slate-700 mb-4 flex items-center gap-2 border-b-2 border-slate-100 pb-2.5">
                <i class="ph-bold ph-funnel text-amber-500 text-lg"></i> ตัวกรองข้อมูลการตรวจสอบสถานี
            </h2>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3.5 mb-5">
                <div>
                    <label class="text-xs font-bold text-slate-500 block mb-1">ปีงบประมาณ</label>
                    <select id="filterYear" onchange="applyFilters()" class="w-full p-3 text-sm rounded-xl puffy-input">
                        <option value="all">-- ทุกปีงบประมาณ --</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-500 block mb-1">งวดการตรวจสอบ</label>
                    <select id="filterPeriod" onchange="applyFilters()" class="w-full p-3 text-sm rounded-xl puffy-input">
                        <option value="all">-- ทุกงวด --</option>
                        <option value="งวดที่1">งวดที่ 1</option>
                        <option value="งวดที่2">งวดที่ 2</option>
                        <option value="งวดที่3">งวดที่ 3</option>
                        <option value="งวดที่4">งวดที่ 4</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-500 block mb-1">กลุ่มลุ่มน้ำ</label>
                    <select id="filterBasin" onchange="onBasinChange()" class="w-full p-3 text-sm rounded-xl puffy-input">
                        <option value="all">-- ทุกกลุ่มลุ่มน้ำ --</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-500 block mb-1">เลือกสถานี</label>
                    <select id="filterStation" onchange="applyFilters()" class="w-full p-3 text-sm rounded-xl puffy-input">
                        <option value="all">-- ทุกสถานี --</option>
                    </select>
                </div>
            </div>

            <button type="button" onclick="loadInspections()" id="btnRefresh"
                    class="btn-puffy-amber w-full py-3.5 text-sm md:text-base font-extrabold flex items-center justify-center gap-2">
                <i class="ph-bold ph-magnifying-glass text-xl"></i> ค้นหาและรีเฟรชข้อมูลล่าสุด
            </button>
        </div>

        <!-- แถบสรุปสถิติภาพรวม -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-white border-2 border-slate-200 rounded-2xl p-4 md:p-5 shadow-sm flex items-center gap-3.5">
                <div class="w-12 h-12 rounded-2xl bg-indigo-50 text-indigo-500 flex items-center justify-center text-2xl shrink-0">
                    <i class="ph-fill ph-files"></i>
                </div>
                <div>
                    <span class="block text-[11px] font-bold text-slate-400 uppercase">รายงานที่พบ</span>
                    <span id="statTotal" class="block text-xl md:text-2xl font-black text-slate-800">0</span>
                </div>
            </div>

            <div class="bg-white border-2 border-emerald-200 rounded-2xl p-4 md:p-5 shadow-sm flex items-center gap-3.5">
                <div class="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-500 flex items-center justify-center text-2xl shrink-0">
                    <i class="ph-fill ph-check-circle"></i>
                </div>
                <div>
                    <span class="block text-[11px] font-bold text-slate-400 uppercase">พร้อมใช้งาน (ใช้ได้)</span>
                    <span id="statUsable" class="block text-xl md:text-2xl font-black text-emerald-600">0</span>
                </div>
            </div>

            <div class="bg-white border-2 border-rose-200 rounded-2xl p-4 md:p-5 shadow-sm flex items-center gap-3.5">
                <div class="w-12 h-12 rounded-2xl bg-rose-50 text-rose-500 flex items-center justify-center text-2xl shrink-0">
                    <i class="ph-fill ph-x-circle"></i>
                </div>
                <div>
                    <span class="block text-[11px] font-bold text-slate-400 uppercase">ชำรุดหลัก (ใช้ไม่ได้)</span>
                    <span id="statUnusable" class="block text-xl md:text-2xl font-black text-rose-600">0</span>
                </div>
            </div>

            <div class="bg-white border-2 border-sky-200 rounded-2xl p-4 md:p-5 shadow-sm flex items-center gap-3.5">
                <div class="w-12 h-12 rounded-2xl bg-sky-50 text-sky-500 flex items-center justify-center text-2xl shrink-0">
                    <i class="ph-fill ph-broom"></i>
                </div>
                <div>
                    <span class="block text-[11px] font-bold text-slate-400 uppercase">ความสะอาด "ผ่าน"</span>
                    <span id="statCleanPass" class="block text-xl md:text-2xl font-black text-sky-600">0</span>
                </div>
            </div>
        </div>

        <!-- พื้นที่แสดงรายการรายงาน -->
        <div id="inspectionListContainer" class="space-y-5">
            <div class="py-16 text-center bg-white rounded-3xl border-4 border-slate-100 text-amber-500">
                <i class="ph-bold ph-spinner animate-spin text-4xl mb-2"></i>
                <p class="font-extrabold text-sm">กำลังดึงข้อมูลรายงานผลตรวจสอบสภาพสถานี...</p>
            </div>
        </div>

    </main>

    <!-- Modal สำหรับกดขยายดูรูปภาพขนาดใหญ่ -->
    <div id="imageModal" onclick="closeImageModal()" class="fixed inset-0 z-50 hidden bg-slate-900/85 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="relative max-w-3xl w-full bg-white rounded-3xl p-3 shadow-2xl" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center px-3 py-2 border-b border-slate-100 mb-2">
                <span id="modalCaption" class="font-extrabold text-sm text-slate-700">ภาพถ่ายสภาพสถานี</span>
                <button type="button" onclick="closeImageModal()" class="w-8 h-8 rounded-full bg-rose-50 text-rose-500 flex items-center justify-center font-bold hover:bg-rose-500 hover:text-white transition-all">
                    <i class="ph-bold ph-x"></i>
                </button>
            </div>
            <img id="modalImg" src="" alt="Preview" class="w-full max-h-[75vh] object-contain rounded-2xl bg-slate-50">
        </div>
    </div>

    <script>
        // =========================================================================
        // แก้ไขปัญหา APK: ชี้ไปที่เซิร์ฟเวอร์ Render เสมอเมื่อไม่ได้รันผ่านพอร์ตพัฒนาบน PC
        // =========================================================================
        const isLocalPcDev = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') 
                             && (window.location.port === '3000' || window.location.port === '5000');
        const API_BASE = isLocalPcDev ? '' : 'https://ma-inspection-project.onrender.com';

        let allInspections = [];

        const safeEscape = (str) => {
            if (typeof escapeHtml === 'function') return escapeHtml(str);
            return String(str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        };

        const isBrokenValue = (val) => {
            const v = (val || '').toString().trim().toLowerCase();
            return v === 'o' || v === 'ชำรุด' || v === '0' || v === 'ไม่ผ่าน' || v === 'ไม่ถูกต้อง' || v === 'ใช้งานไม่ได้';
        };

        // เงื่อนไขเดิม 100% ในการประเมินสถานะสถานีและรายการชำรุด
        function evaluateStationRecord(item) {
            const eqMap = (typeof equipmentMap !== 'undefined') ? equipmentMap : {
                clean: "ความสะอาด", pai: "ป้ายสถานี", power: "ระบบไฟฟ้า", power1: "หลอดไฟ",
                online: "เว็บไซต์ไม่ออนไลน์", wl: "ระดับน้ำ(1)", wl1: "ระดับน้ำ(แก้)", r: "ค่าน้ำฝน",
                sta_cpu: "CPU", sta_ai: "AI", sta_di: "DI", sta_do: "DO", sta_io: "IO", plc: "PLC",
                sta_m1: "Modem 1", sta_m2: "Modem 2", sta_p1: "Power 1", sta_p2: "Power 2",
                sta_cctv1: "CCTV1", sta_cctv2: "CCTV2", sta_r: "Rain Gauge", sta_s: "Surge",
                sta_wl: "WL(bubble)", sta_tro: "ท่อลม", sta_gass: "ถังแก๊ส", sta_wl1: "WL(Radar)",
                sta_wl2: "WL(float)", sta_saling: "สายสลิง", b2: "แบตเตอรี่", 
                sta1: "แผ่นวัดน้ำ(บวก)", sta2: "แผ่นวัดน้ำ(ลบ)", pole2: "เสาวัดน้ำ"
            };

            const brokenList = [];
            const statusGrid = [];

            Object.keys(eqMap).forEach(key => {
                const broken = isBrokenValue(item[key]);
                if (broken) brokenList.push(eqMap[key]);
                statusGrid.push({
                    key,
                    label: eqMap[key],
                    broken
                });
            });

            let isSystemBroken = false;
            const groupA = [
                'power', 'sta_cpu', 'sta_ai', 'sta_di', 'sta_do', 'sta_io', 'plc',
                'sta_cctv1', 'sta_cctv2', 'sta_r', 'sta_s', 'sta_wl', 'sta_tro',
                'sta_gass', 'sta_wl2', 'sta_saling', 'sta_wl1'
            ];
            if (groupA.some(key => isBrokenValue(item[key]))) {
                isSystemBroken = true;
            }
            if (isBrokenValue(item.sta_m1) && isBrokenValue(item.sta_m2)) isSystemBroken = true;
            if (isBrokenValue(item.sta_p1) && isBrokenValue(item.sta_p2)) isSystemBroken = true;

            let cleanRaw = String(item.clean || 'ผ่าน').trim().toLowerCase();
            const isCleanPass = !(cleanRaw === 'o' || cleanRaw === 'ไม่ผ่าน' || cleanRaw === 'ชำรุด' || cleanRaw === '0');

            return {
                isSystemBroken,
                statusText: isSystemBroken ? 'ใช้ไม่ได้' : 'ใช้ได้',
                isCleanPass,
                cleanText: isCleanPass ? 'ผ่าน' : 'ไม่ผ่าน',
                brokenList,
                statusGrid
            };
        }

        function extractDriveFileId(rawUrl) {
            if (!rawUrl) return null;
            const str = String(rawUrl).trim();
            const m1 = str.match(/[?&]id=([a-zA-Z0-9_-]+)/);
            if (m1) return m1[1];
            const m2 = str.match(/\/d\/([a-zA-Z0-9_-]+)/);
            if (m2) return m2[1];
            const m3 = str.match(/\/api\/images\/([a-zA-Z0-9_-]+)/);
            if (m3) return m3[1];
            return null;
        }

        function resolveDriveImageUrl(rawUrl) {
            if (!rawUrl || String(rawUrl).trim() === '') return '';
            const clean = String(rawUrl).trim();
            const fileId = extractDriveFileId(clean);
            if (fileId) return `${API_BASE}/api/images/${fileId}`;
            if (clean.startsWith('/')) return `${API_BASE}${clean}`;
            if (!clean.startsWith('http')) return `${API_BASE}/${clean}`;
            return clean;
        }

        function handleImageFallback(imgEl, rawUrl) {
            const fileId = extractDriveFileId(rawUrl);
            const step = parseInt(imgEl.getAttribute('data-fallback-step') || '0', 10);
            if (fileId && step === 0) {
                imgEl.setAttribute('data-fallback-step', '1');
                imgEl.src = `https://lh3.googleusercontent.com/d/${fileId}=w800`;
                return;
            }
            if (fileId && step === 1) {
                imgEl.setAttribute('data-fallback-step', '2');
                imgEl.src = `https://drive.google.com/thumbnail?id=${fileId}&sz=w800`;
                return;
            }
            imgEl.style.display = 'none';
        }

        function openImageModal(src, caption) {
            if (!src) return;
            document.getElementById('modalImg').src = src;
            document.getElementById('modalCaption').textContent = caption || 'ภาพถ่ายสภาพสถานี';
            document.getElementById('imageModal').classList.remove('hidden');
        }

        function closeImageModal() {
            document.getElementById('imageModal').classList.add('hidden');
            document.getElementById('modalImg').src = '';
        }

        function getFiscalYear(item) {
            if (item.contractYear && String(item.contractYear).trim() !== '') {
                return String(item.contractYear).trim();
            }
            const d = new Date(item.timestamp || item.createdAt);
            if (isNaN(d.getTime())) return '';
            let y = d.getFullYear() + 543;
            if (d.getMonth() >= 9) y += 1;
            return String(y);
        }

        function lookupStationName(code, basin) {
            if (!code || typeof stationsData === 'undefined') return '';
            const c = String(code).trim();
            if (basin && stationsData[basin] && stationsData[basin][c]) return stationsData[basin][c];
            for (const bKey of Object.keys(stationsData)) {
                if (stationsData[bKey] && stationsData[bKey][c]) return stationsData[bKey][c];
            }
            return '';
        }

        function populateStationsDropdown(selectedBasin) {
            const stationSelect = document.getElementById('filterStation');
            stationSelect.innerHTML = '<option value="all">-- ทุกสถานี --</option>';
            if (typeof stationsData === 'undefined') return;

            if (selectedBasin && selectedBasin !== 'all') {
                const map = stationsData[selectedBasin] || {};
                Object.keys(map).forEach(code => {
                    const opt = document.createElement('option');
                    opt.value = code;
                    opt.textContent = `${code} - ${map[code]}`;
                    stationSelect.appendChild(opt);
                });
            } else {
                const added = new Set();
                Object.keys(stationsData).forEach(bKey => {
                    const map = stationsData[bKey] || {};
                    Object.keys(map).forEach(code => {
                        if (!added.has(code)) {
                            added.add(code);
                            const opt = document.createElement('option');
                            opt.value = code;
                            opt.textContent = `[${bKey}] ${code} - ${map[code]}`;
                            stationSelect.appendChild(opt);
                        }
                    });
                });
            }
        }

        function onBasinChange() {
            const basin = document.getElementById('filterBasin').value;
            populateStationsDropdown(basin);
            applyFilters();
        }

        window.onload = () => {
            const filterYear = document.getElementById('filterYear');
            const startYear = 2568;
            for (let i = 0; i <= 10; i++) {
                const y = startYear + i;
                filterYear.innerHTML += `<option value="${y}">${y}</option>`;
            }

            const filterBasin = document.getElementById('filterBasin');
            if (typeof hardcodedBasins !== 'undefined' && Array.isArray(hardcodedBasins)) {
                hardcodedBasins.forEach(b => {
                    filterBasin.innerHTML += `<option value="${safeEscape(b)}">${safeEscape(b)}</option>`;
                });
            } else if (typeof stationsData !== 'undefined') {
                Object.keys(stationsData).forEach(b => {
                    filterBasin.innerHTML += `<option value="${safeEscape(b)}">${safeEscape(b)}</option>`;
                });
            }

            populateStationsDropdown('all');
            loadInspections();
        };

        async function loadInspections() {
            const container = document.getElementById('inspectionListContainer');
            const btn = document.getElementById('btnRefresh');
            btn.disabled = true;

            try {
                const response = await fetch(`${API_BASE}/api/inspections`, {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' }
                });

                const contentType = response.headers.get("content-type") || "";
                if (!contentType.includes("application/json")) {
                    throw new Error("เซิร์ฟเวอร์กำลังตื่นตัว (Cold Start) กรุณารอ 10 วินาทีแล้วกดค้นหาอีกครั้ง");
                }

                const result = await response.json();
                if (response.ok && result.success) {
                    allInspections = Array.isArray(result.data) ? result.data : [];
                    applyFilters();
                } else {
                    throw new Error(result.message || 'ดึงข้อมูลไม่สำเร็จ');
                }
            } catch (error) {
                container.innerHTML = `
                    <div class="bg-rose-50 border-2 border-rose-200 p-8 rounded-2xl text-center">
                        <i class="ph-fill ph-warning-circle text-4xl text-rose-500 mb-2"></i>
                        <p class="font-extrabold text-rose-700">${safeEscape(error.message)}</p>
                    </div>`;
            } finally {
                btn.disabled = false;
            }
        }

        function applyFilters() {
            const year = document.getElementById('filterYear').value;
            const period = document.getElementById('filterPeriod').value;
            const basin = document.getElementById('filterBasin').value;
            const station = document.getElementById('filterStation').value;

            const filtered = allInspections.filter(item => {
                if (year !== 'all' && getFiscalYear(item) !== year) return false;
                if (period !== 'all') {
                    const pNum = period.replace(/\D/g, '');
                    const itemP = String(item.saya || item.period || '').replace(/\s+/g, '');
                    if (!itemP.includes(pNum) && itemP !== period) return false;
                }
                if (basin !== 'all' && item.code !== basin && item.basin !== basin) return false;
                if (station !== 'all') {
                    const code = String(item.id_name || '').trim().toUpperCase();
                    const target = String(station).trim().toUpperCase();
                    if (code !== target && !code.startsWith(target)) return false;
                }
                return true;
            });

            renderInspectionList(filtered);
        }

        function renderInspectionList(list) {
            const container = document.getElementById('inspectionListContainer');
            let usableCount = 0;
            let unusableCount = 0;
            let cleanPassCount = 0;

            if (!list || list.length === 0) {
                document.getElementById('statTotal').textContent = '0';
                document.getElementById('statUsable').textContent = '0';
                document.getElementById('statUnusable').textContent = '0';
                document.getElementById('statCleanPass').textContent = '0';
                container.innerHTML = `
                    <div class="py-16 text-center bg-white rounded-3xl border-4 border-dashed border-slate-200 text-slate-400">
                        <i class="ph-fill ph-empty text-5xl mb-2 text-slate-300"></i>
                        <p class="font-extrabold text-slate-500">ไม่พบข้อมูลรายงานตามเงื่อนไขที่เลือก</p>
                    </div>`;
                return;
            }

            let html = '';

            list.forEach((item, idx) => {
                const ev = evaluateStationRecord(item);
                if (ev.isSystemBroken) unusableCount++;
                else usableCount++;
                if (ev.isCleanPass) cleanPassCount++;

                const stCode = item.id_name || '-';
                const basinName = item.code || item.basin || '-';
                const stName = lookupStationName(stCode, basinName) || item.name_id || stCode;
                const fiscalYear = getFiscalYear(item);
                const periodLabel = item.saya || `งวดที่${item.period || '1'}`;
                const dateStr = new Date(item.timestamp || item.createdAt).toLocaleString('th-TH', {
                    year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
                });

                const readinessBadge = ev.isSystemBroken
                    ? `<span class="bg-rose-500 text-white px-3 py-1 rounded-xl text-xs font-extrabold flex items-center gap-1"><i class="ph-bold ph-x-circle"></i> ใช้ไม่ได้</span>`
                    : `<span class="bg-emerald-500 text-white px-3 py-1 rounded-xl text-xs font-extrabold flex items-center gap-1"><i class="ph-bold ph-check-circle"></i> ใช้ได้</span>`;

                const cleanBadge = ev.isCleanPass
                    ? `<span class="bg-sky-100 text-sky-700 border border-sky-200 px-2.5 py-1 rounded-xl text-xs font-extrabold">ความสะอาด: ผ่าน</span>`
                    : `<span class="bg-rose-100 text-rose-700 border border-rose-200 px-2.5 py-1 rounded-xl text-xs font-extrabold">ความสะอาด: ไม่ผ่าน</span>`;

                const brokenSummary = ev.brokenList.length > 0
                    ? ev.brokenList.map(b => `<span class="bg-rose-50 text-rose-700 border border-rose-200 px-2.5 py-0.5 rounded-lg text-xs font-bold">${safeEscape(b)}</span>`).join(' ')
                    : `<span class="text-xs font-bold text-emerald-600"><i class="ph-fill ph-check-circle"></i> อุปกรณ์ทุกหมวดทำงานปกติ</span>`;

                // รูปภาพสภาพสถานี (จาก tor_inspection.html หรือข้อมูลเดิม)
                const photos = Array.isArray(item.photos) ? item.photos : [];
                let photosHtml = '';
                if (photos.length > 0) {
                    photosHtml = `
                    <div class="mt-4 pt-4 border-t border-slate-100">
                        <span class="block text-xs font-extrabold text-slate-600 mb-2.5">
                            <i class="ph-fill ph-camera text-amber-500 text-base"></i> ภาพถ่ายสภาพสถานีหน้างาน (${photos.length} รูป — แตะเพื่อขยาย):
                        </span>
                        <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-5 gap-3">
                            ${photos.map((ph, pIdx) => {
                                const rawUrl = ph.thumbnailUrl || ph.webViewLink || ph.url || '';
                                const resolvedUrl = resolveDriveImageUrl(rawUrl);
                                return `
                                <div class="h-28 rounded-xl overflow-hidden border-2 border-slate-200 bg-slate-50 cursor-pointer"
                                     onclick="openImageModal('${safeEscape(resolvedUrl)}', '${safeEscape(stCode + ' - รูปที่ ' + (pIdx + 1))}')">
                                    <img src="${safeEscape(resolvedUrl)}" loading="lazy"
                                         onerror="handleImageFallback(this, '${safeEscape(rawUrl)}')"
                                         class="w-full h-full object-cover hover:scale-105 transition-transform">
                                </div>`;
                            }).join('')}
                        </div>
                    </div>`;
                }

                // ตารางสถานะอุปกรณ์ 26 หมวด (พับ/กางดูรายละเอียดได้)
                const gridItemsHtml = ev.statusGrid.map(g => `
                    <div class="flex items-center justify-between p-2 rounded-lg border text-xs ${g.broken ? 'bg-rose-50 border-rose-200 text-rose-700 font-bold' : 'bg-slate-50 border-slate-200 text-slate-600'}">
                        <span>${safeEscape(g.label)}</span>
                        <span>${g.broken ? '<i class="ph-bold ph-x-circle text-rose-600"></i> ชำรุด' : '<i class="ph-bold ph-check text-emerald-600"></i> ปกติ'}</span>
                    </div>
                `).join('');

                html += `
                <div class="station-report-card">
                    <div class="bg-slate-50 p-4 md:p-5 border-b border-slate-200 flex flex-wrap justify-between items-start gap-3">
                        <div>
                            <div class="flex flex-wrap items-center gap-2 mb-1">
                                <span class="bg-amber-500 text-white text-[10px] font-black px-2.5 py-0.5 rounded uppercase">
                                    ปี ${safeEscape(fiscalYear)} | ${safeEscape(periodLabel)}
                                </span>
                                <span class="bg-slate-200 text-slate-700 text-[10px] font-bold px-2.5 py-0.5 rounded">
                                    ลุ่มน้ำ${safeEscape(basinName)}
                                </span>
                            </div>
                            <h3 class="text-base md:text-xl font-black text-slate-800 flex items-center gap-2">
                                <i class="ph-fill ph-map-pin text-amber-500"></i> ${safeEscape(stCode)} — ${safeEscape(stName)}
                            </h3>
                            <div class="text-xs font-bold text-slate-400 mt-1 flex flex-wrap gap-x-4 gap-y-1">
                                <span><i class="ph-bold ph-calendar-blank"></i> ตรวจเมื่อ: ${dateStr}</span>
                                ${(item.lat && item.lon) ? `<span class="text-teal-600"><i class="ph-fill ph-navigation-arrow"></i> GPS: ${safeEscape(item.lat)}, ${safeEscape(item.lon)}</span>` : ''}
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            ${cleanBadge}
                            ${readinessBadge}
                        </div>
                    </div>

                    <div class="p-4 md:p-6">
                        ${item.geoAddress && item.geoAddress !== 'ไม่ระบุพิกัด' ? `
                        <div class="mb-3 text-xs font-semibold text-slate-500 bg-slate-50 p-2.5 rounded-xl border border-slate-200">
                            <i class="ph-fill ph-map-trifold text-teal-500"></i> <b>สถานที่ตั้งจากพิกัด GPS:</b> ${safeEscape(item.geoAddress)}
                        </div>` : ''}

                        <div class="mb-3">
                            <span class="block text-xs font-extrabold text-slate-500 mb-1.5">สรุปรายการอุปกรณ์ที่ชำรุด:</span>
                            <div class="flex flex-wrap gap-1.5">${brokenSummary}</div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs mt-3">
                            <div class="p-3 rounded-xl bg-amber-50/60 border border-amber-200 text-amber-900 font-semibold">
                                <b>หมายเหตุผู้ตรวจสอบ:</b> ${safeEscape(item.note || '-')}
                            </div>
                            <div class="p-3 rounded-xl bg-violet-50/60 border border-violet-200 text-violet-900 font-semibold">
                                <b>ข้อคิดเห็นกรรมการตรวจรับ:</b> ${safeEscape(item.note2 || '-')}
                            </div>
                        </div>

                        ${photosHtml}

                        <details class="mt-4 pt-3 border-t border-slate-100">
                            <summary class="cursor-pointer text-xs font-extrabold text-sky-600 hover:text-sky-700 select-none">
                                คลิกเพื่อดูตารางสถานะอุปกรณ์ครบทั้ง 26 หมวด
                            </summary>
                            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2 mt-3">
                                ${gridItemsHtml}
                            </div>
                        </details>
                    </div>
                </div>`;
            });

            document.getElementById('statTotal').textContent = list.length;
            document.getElementById('statUsable').textContent = usableCount;
            document.getElementById('statUnusable').textContent = unusableCount;
            document.getElementById('statCleanPass').textContent = cleanPassCount;

            container.innerHTML = html;
        }
    </script>
</body>
</html>
