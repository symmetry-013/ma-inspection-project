<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบรายงานผลสอบเทียบ | Calibration Report</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-dark@4/dark.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>
    <!-- นำเข้า Constants -->
    <script src="constants.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: { neon: { gold: '#cca43b', darkgold: '#b89334', bg: '#0f1012', card: '#1a1c20', input: '#000000', border: '#333333' } },
                    boxShadow: { 'neon-gold': '0 0 5px #cca43b, 0 0 10px rgba(204, 164, 59, 0.4)' }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0f1012; color: #ffffff; font-family: 'Prompt', sans-serif; -webkit-overflow-scrolling: touch; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f1012; }
        ::-webkit-scrollbar-thumb { background: #cca43b; border-radius: 4px; }
        .input-neon { background-color: #000000; border: 1px solid #333; color: #ffffff; transition: all 0.3s ease; }
        .input-neon:focus { outline: none; border-color: #cca43b; box-shadow: 0 0 8px rgba(204, 164, 59, 0.6); }
        .input-neon:disabled, .input-neon[readonly] { background-color: #1a1c20; border-color: #222; color: #666; }
        input[type="file"] { padding: 8px; font-size: 0.85rem; width: 100%; color: #888; }
        input[type="file"]::file-selector-button { background-color: #333; color: #fff; border: 1px solid #555; padding: 8px 16px; border-radius: 6px; cursor: pointer; margin-right: 15px; transition: all 0.3s; }
        input[type="file"]::file-selector-button:hover { background-color: #cca43b; border-color: #cca43b; color: #000; }
        .btn-neon-submit { background: linear-gradient(135deg, #cca43b, #b89334); border: none; color: #000; transition: all 0.3s ease; }
        .btn-neon-submit:hover { transform: scale(1.02); box-shadow: 0 0 15px rgba(204, 164, 59, 0.6); color: #000; }
        .btn-neon-submit:disabled { background: #333; color: #666; cursor: not-allowed; box-shadow: none; transform: none; }
        .glass-header { background: rgba(15, 16, 18, 0.95); border-bottom: 1px solid #333; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .card-container { background-color: #1a1c20; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">
    <header class="glass-header sticky top-0 z-50 py-4">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <a href="index.html" class="w-10 h-10 rounded-lg bg-gray-800 border border-gray-600 flex items-center justify-center hover:bg-gray-700 transition">
                    <i class="fas fa-arrow-left text-white"></i>
                </a>
                <div class="w-12 h-12 rounded-lg bg-black border border-neon-gold flex items-center justify-center shadow-neon-gold">
                    <i class="fas fa-satellite-dish text-neon-gold text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl font-bold tracking-wide text-white uppercase">
                        Telemetry <span class="text-neon-gold">Calibration</span>
                    </h1>
                </div>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8 max-w-4xl flex-grow">
        <form id="calibrationForm" onsubmit="handleFormSubmit(event)" enctype="multipart/form-data" class="space-y-8">
            <div class="card-container rounded-xl p-6 relative">
                <div class="flex items-center mb-6 pb-4 border-b border-gray-800">
                    <span class="w-2 h-8 bg-neon-gold mr-3 shadow-neon-gold"></span>
                    <h2 class="text-xl font-bold text-white uppercase tracking-wider flex items-center">
                        <i class="fas fa-map-marker-alt mr-2 text-neon-gold"></i> ข้อมูลสถานี
                    </h2>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-2 md:col-span-2">
                        <label class="text-sm font-semibold text-gray-300">งวดตรวจงาน MA</label>
                        <select name="myDataPeriod" id="myDataPeriod" required class="w-full p-3 rounded-md input-neon">
                            <option selected disabled value="">-- เลือกงวดตรวจงาน --</option>
                            <option>งวดที่1</option><option>งวดที่2</option><option>งวดที่3</option><option>งวดที่4</option>
                        </select>
                    </div>
                    <div class="space-y-2">
                        <label class="text-sm font-semibold text-gray-300">กลุ่มลุ่มน้ำ</label>
                        <select name="myData0" id="myData0" required class="w-full p-3 rounded-md input-neon"></select>
                    </div>
                    <div class="space-y-2">
                        <label class="text-sm font-semibold text-gray-300">รหัสสถานี</label>
                        <input list="stationList" type="text" name="myData1" id="myData1" required disabled 
                                placeholder="พิมพ์หรือเลือกรหัส..." class="w-full p-3 rounded-md input-neon">
                        <datalist id="stationList"></datalist>
                    </div>
                    <div class="space-y-2 md:col-span-2">
                        <label class="text-sm font-semibold text-gray-300">ชื่อสถานี</label>
                        <input type="text" name="myData2" id="myData2" readonly 
                               placeholder="ชื่อสถานีจะปรากฏอัตโนมัติ"
                               class="w-full p-3 rounded-md bg-black border border-neon-gold text-neon-gold font-bold text-center text-lg">
                    </div>
                    <div class="space-y-2 md:col-span-2">
                        <label class="text-sm font-semibold text-gray-300">ที่ตั้งอาคาร</label>
                        <select name="myData3" id="myData3" required class="w-full p-3 rounded-md input-neon">
                            <option selected disabled value="">-- เลือกที่ตั้งของอาคาร --</option>
                            <option>เหนือน้ำ</option><option>ท้ายน้ำ</option><option>ปกติ</option>                       
                       </select>
                    </div>
                </div>
            </div>

            <!-- Sections 2-4 (เหมือนเดิม) -->
            <div class="card-container rounded-xl p-6">
                <div class="flex items-center mb-6 pb-4 border-b border-gray-800">
                    <span class="w-2 h-8 bg-blue-500 mr-3 shadow-neon-blue"></span>
                    <h2 class="text-xl font-bold text-white uppercase tracking-wider flex items-center">
                        <i class="fas fa-water mr-2 text-blue-500"></i> สอบเทียบระดับน้ำ ครั้งที่ 1
                    </h2>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-2"><label class="text-sm font-semibold text-gray-300">ค่าระดับน้ำเสาวัด (Staff Gauge)</label><input type="text" name="myData4" class="w-full p-3 rounded-md input-neon" placeholder="0.00" oninput="this.value = this.value.replace(/[^0-9.\-]/g, '');"></div>
                    <div class="space-y-2"><label class="text-sm font-semibold text-gray-300 text-blue-400">รูปถ่ายเสาวัดระดับน้ำ <i class="fas fa-camera"></i></label><input type="file" name="myFile" class="w-full input-neon rounded-md" accept="image/*"></div>
                    <div class="space-y-2"><label class="text-sm font-semibold text-gray-300">ค่าระดับน้ำจาก RTU</label><input type="text" name="myData5" class="w-full p-3 rounded-md input-neon" placeholder="0.00" oninput="this.value = this.value.replace(/[^0-9.\-]/g, '');"></div>
                    <div class="space-y-2"><label class="text-sm font-semibold text-gray-300 text-blue-400">รูปถ่ายจาก RTU <i class="fas fa-camera"></i></label><input type="file" name="myFile2" class="w-full input-neon rounded-md" accept="image/*"></div>
                    <div class="space-y-2"><label class="text-sm font-semibold text-gray-300">ค่าระดับน้ำจาก Website</label><input type="text" name="myData6" class="w-full p-3 rounded-md input-neon" placeholder="0.00" oninput="this.value = this.value.replace(/[^0-9.\-]/g, '');"></div>
                    <div class="space-y-2"><label class="text-sm font-semibold text-gray-300 text-blue-400">รูปถ่ายจาก Website <i class="fas fa-camera"></i></label><input type="file" name="myFile3" class="w-full input-neon rounded-md" accept="image/*"></div>
                    <div class="space-y-2 md:col-span-2"><label class="text-sm font-semibold text-gray-300">หมายเหตุ (Optional)</label><textarea name="myData7" rows="2" class="w-full p-3 rounded-md input-neon" placeholder="ระบุหมายเหตุเพิ่มเติม..."></textarea></div>
                </div>
            </div>

            <div class="card-container rounded-xl p-6">
                <div class="flex items-center mb-6 pb-4 border-b border-gray-800">
                    <span class="w-2 h-8 bg-green-500 mr-3"></span>
                    <h2 class="text-xl font-bold text-white uppercase tracking-wider flex items-center">
                        <i class="fas fa-redo mr-2 text-green-500"></i> สอบเทียบระดับน้ำ ครั้งที่ 2
                    </h2>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-2"><label class="text-sm font-semibold text-gray-300">ค่าระดับน้ำเสาวัด (Staff Gauge)</label><input type="text" name="myData8" class="w-full p-3 rounded-md input-neon" placeholder="0.00" oninput="this.value = this.value.replace(/[^0-9.\-]/g, '');"></div>
                    <div class="space-y-2"><label class="text-sm font-semibold text-gray-300 text-green-400">รูปถ่ายเสาวัดระดับน้ำ <i class="fas fa-camera"></i></label><input type="file" name="myFile4" class="w-full input-neon rounded-md" accept="image/*"></div>
                    <div class="space-y-2"><label class="text-sm font-semibold text-gray-300">ค่าระดับน้ำจาก RTU</label><input type="text" name="myData9" class="w-full p-3 rounded-md input-neon" placeholder="0.00" oninput="this.value = this.value.replace(/[^0-9.\-]/g, '');"></div>
                    <div class="space-y-2"><label class="text-sm font-semibold text-gray-300 text-green-400">รูปถ่ายจาก RTU <i class="fas fa-camera"></i></label><input type="file" name="myFile5" class="w-full input-neon rounded-md" accept="image/*"></div>
                    <div class="space-y-2"><label class="text-sm font-semibold text-gray-300">ค่าระดับน้ำจาก Website</label><input type="text" name="myData10" class="w-full p-3 rounded-md input-neon" placeholder="0.00" oninput="this.value = this.value.replace(/[^0-9.\-]/g, '');"></div>
                    <div class="space-y-2"><label class="text-sm font-semibold text-gray-300 text-green-400">รูปถ่ายจาก Website <i class="fas fa-camera"></i></label><input type="file" name="myFile6" class="w-full input-neon rounded-md" accept="image/*"></div>
                </div>
            </div>

            <div class="card-container rounded-xl p-6">
                <div class="flex items-center mb-6 pb-4 border-b border-gray-800">
                    <span class="w-2 h-8 bg-cyan-400 mr-3"></span>
                    <h2 class="text-xl font-bold text-white uppercase tracking-wider flex items-center">
                        <i class="fas fa-cloud-rain mr-2 text-cyan-400"></i> สอบเทียบค่าน้ำฝน (Rainfall)
                    </h2>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-2 md:col-span-2"><label class="text-sm font-semibold text-gray-300">จำนวนเคาะจากกระบอกน้ำฝน</label><input type="text" name="myData11" class="w-full p-3 rounded-md input-neon text-center font-bold text-xl text-cyan-400" placeholder="จำนวนครั้ง" oninput="this.value = this.value.replace(/[^0-9\-]/g, '');"></div>
                    <div class="space-y-2"><label class="text-sm font-semibold text-gray-300">ค่าน้ำฝนจาก RTU</label><input type="text" name="myData12" class="w-full p-3 rounded-md input-neon" placeholder="0.00" oninput="this.value = this.value.replace(/[^0-9.\-]/g, '');"></div>
                    <div class="space-y-2"><label class="text-sm font-semibold text-gray-300 text-cyan-400">รูปถ่ายจาก RTU <i class="fas fa-camera"></i></label><input type="file" name="myFile7" class="w-full input-neon rounded-md" accept="image/*"></div>
                    <div class="space-y-2"><label class="text-sm font-semibold text-gray-300">ค่าน้ำฝนจาก Website</label><input type="text" name="myData13" class="w-full p-3 rounded-md input-neon" placeholder="0.00" oninput="this.value = this.value.replace(/[^0-9.\-]/g, '');"></div>
                    <div class="space-y-2"><label class="text-sm font-semibold text-gray-300 text-cyan-400">รูปถ่ายจาก Website <i class="fas fa-camera"></i></label><input type="file" name="myFile8" class="w-full input-neon rounded-md" accept="image/*"></div>
                    <div class="space-y-2 md:col-span-2"><label class="text-sm font-semibold text-gray-300">หมายเหตุค่าน้ำฝน</label><textarea name="myData14" rows="2" class="w-full p-3 rounded-md input-neon" placeholder="ระบุหมายเหตุเพิ่มเติม..."></textarea></div>
                </div>
            </div>

            <div class="py-6 flex justify-center">
                <button type="submit" id="submitBtn" class="btn-neon-submit w-full md:w-2/3 rounded-full py-4 font-bold text-lg shadow-neon-gold flex items-center justify-center gap-3">
                    <i class="fas fa-paper-plane"></i> ยืนยันการส่งข้อมูลสอบเทียบ
                </button>
            </div>
        </form>
    </main>

    <script>
        const basinSelect = document.getElementById("myData0");
        const stationInput = document.getElementById("myData1");
        const stationList = document.getElementById("stationList");
        const stationNameInput = document.getElementById("myData2");

        // โหลดลุ่มน้ำจาก constants.js
        basinSelect.innerHTML = '<option selected disabled value="">-- เลือกกลุ่มลุ่มน้ำ --</option>';
        hardcodedBasins.forEach(b => {
            basinSelect.innerHTML += `<option value="${b}">${b}</option>`;
        });
        basinSelect.innerHTML += '<option value="">ไม่มี</option><option value="ไม่ทราบ">ไม่ทราบ</option>';

        basinSelect.addEventListener("change", () => {
            const selectedBasin = basinSelect.value.trim();
            stationInput.value = "";
            stationNameInput.value = "";
            stationList.innerHTML = "";
            if (stationsData[selectedBasin]) {
                stationInput.disabled = false;
                for (let code in stationsData[selectedBasin]) {
                    const opt = document.createElement("option");
                    opt.value = code;
                    stationList.appendChild(opt);
                }
            } else {
                stationInput.disabled = true;
            }
        });

        stationInput.addEventListener("input", () => {
            const selectedBasin = basinSelect.value.trim();
            const code = stationInput.value.trim();
            if (stationsData[selectedBasin] && stationsData[selectedBasin][code]) {
                stationNameInput.value = stationsData[selectedBasin][code];
            } else {
                stationNameInput.value = "";
            }
        });

        async function handleFormSubmit(event) {
            event.preventDefault();
            const btn = document.getElementById('submitBtn');
            const originalText = btn.innerHTML;
            const form = event.target;
            const formData = new FormData(form);

            Swal.fire({
                title: 'กำลังอัปโหลด...',
                text: 'ระบบกำลังบันทึกข้อมูลและอัปโหลดรูปภาพ (อาจใช้เวลาสักครู่)',
                allowOutsideClick: false,
                background: '#1a1c20', color: '#fff',
                didOpen: () => Swal.showLoading()
            });

            try {
                // ✅ แก้ไข URL ให้ตรงกับ Server
                const API_URL = '/api/calibration';
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: formData 
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    Swal.fire({
                        icon: 'success', title: 'สอบเทียบสำเร็จ', text: result.message,
                        background: '#1a1c20', color: '#fff', confirmButtonColor: '#cca43b'
                    });
                    form.reset();
                    stationInput.disabled = true;
                } else {
                    throw new Error(result.message || 'การตอบกลับจากเซิร์ฟเวอร์ผิดพลาด');
                }
            } catch (error) {
                console.error('Submit Error:', error);
                Swal.fire({
                    icon: 'error', title: 'เกิดข้อผิดพลาด', text: error.message,
                    background: '#1a1c20', color: '#fff', confirmButtonColor: '#cca43b'
                });
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }
    </script>
</body>
</html>
