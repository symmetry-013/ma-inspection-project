<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard แสดงผลสอบเทียบ | Calibration Report</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- นำเข้า Constants สำหรับ XSS Protection -->
    <script src="constants.js"></script>
    <style>
        :root { --bg-color: #0f172a; --card-bg: #1e293b; --text-main: #f1f5f9; --text-muted: #94a3b8; --accent-color: #cca43b; --input-bg: #334155; --border-color: #475569; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Prompt', sans-serif; font-weight: 300; min-height: 100vh; padding-bottom: 50px; }
        ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-track { background: var(--bg-color); } ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
        .main-container { max-width: 1000px; margin: 0 auto; padding-top: 20px; padding-left: 15px; padding-right: 15px; }
        .header-title { text-align: center; margin-bottom: 30px; }
        .header-title h1 { font-weight: 600; color: var(--accent-color); letter-spacing: 1px; text-transform: uppercase; font-size: clamp(1.5rem, 4vw, 2.2rem); }
        .glass-card { background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 25px; margin-bottom: 25px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); transition: transform 0.2s ease; }
        .result-card:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4); border-color: rgba(204, 164, 59, 0.3); }
        .section-header { border-bottom: 1px solid var(--border-color); padding-bottom: 15px; margin-bottom: 25px; display: flex; align-items: center; gap: 12px; }
        .section-header h5 { margin: 0; color: var(--accent-color); font-weight: 500; font-size: 1.1rem; }
        .form-label { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.5rem; }
        .form-control, .form-select { background-color: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 10px; padding: 10px 15px; }
        .form-control:focus, .form-select:focus { background-color: #3b4d66; border-color: var(--accent-color); box-shadow: 0 0 0 2px rgba(204, 164, 59, 0.2); color: white; outline: none; }
        .btn-submit { background: linear-gradient(135deg, var(--accent-color), #b89334); color: #0f172a; border: none; padding: 12px 30px; border-radius: 50px; font-weight: 600; }
        .loader-wrapper { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 0; }
        .loader { border: 4px solid var(--border-color); border-top: 4px solid var(--accent-color); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 15px; margin-top: 15px; }
        .image-item { display: flex; flex-direction: column; align-items: center; text-align: center; }
        .image-wrapper { aspect-ratio: 1; width: 100%; border-radius: 8px; overflow: hidden; border: 1px solid var(--border-color); }
        .image-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        .fade-in { animation: fadeIn 0.5s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .table-dark-custom { border-color: var(--border-color); color: var(--text-main); font-size: 0.9rem; }
        .table-dark-custom th, .table-dark-custom td { border-color: var(--border-color); vertical-align: middle; }
        .table-dark-custom thead { background-color: var(--input-bg); }
        .text-accent { color: var(--accent-color) !important; }
        .local-search-input { background-color: rgba(0,0,0,0.2) !important; color: var(--text-main) !important; }
        .btn-back-menu { display: inline-flex; align-items: center; gap: 8px; color: var(--text-muted); text-decoration: none; padding: 8px 16px; border-radius: 8px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color); }
    </style>
</head>
<body>
    <div class="container main-container">
        <div class="mb-4 fade-in"><a href="index.html" class="btn-back-menu"><i class="fas fa-arrow-left"></i> กลับเมนูหลัก</a></div>
        <div class="header-title fade-in"><h1><i class="fas fa-chart-line me-2"></i> Calibration Dashboard</h1><p>ระบบตรวจสอบและแสดงผลการสอบเทียบสถานีโทรมาตร</p></div>

        <div class="glass-card fade-in" style="animation-delay: 0.1s;">
            <div class="section-header"><i class="fas fa-filter"></i><h5>ค้นหาข้อมูลจากฐานข้อมูล</h5></div>
            <div class="row g-3">
                <div class="col-md-6 col-12">
                    <label for="myDataPeriod" class="form-label">งวดตรวจงาน MA</label>
                    <select class="form-select" id="myDataPeriod">
                        <option value="">ทั้งหมด (ทุกงวด)</option><option value="งวดที่1">งวดที่ 1</option><option value="งวดที่2">งวดที่ 2</option><option value="งวดที่3">งวดที่ 3</option><option value="งวดที่4">งวดที่ 4</option>
                    </select>
                </div>
                <div class="col-md-6 col-12">
                    <label for="myData0" class="form-label">กลุ่มลุ่มน้ำ</label>
                    <select class="form-select" id="myData0"><option value="">ทั้งหมด (ทุกลุ่มน้ำ)</option></select>
                </div>
            </div>
            <div class="text-end mt-4"><button onclick="fetchData()" id="searchBtn" class="btn btn-submit"><i class="fas fa-cloud-download-alt me-2"></i> ดึงข้อมูล</button></div>
        </div>

        <div id="loadingIndicator" class="loader-wrapper d-none fade-in"><div class="loader mb-3"></div><p class="text-muted" id="loadingText">กำลังโหลดข้อมูลจากเซิร์ฟเวอร์...</p></div>
        <div id="errorMessage" class="alert alert-danger d-none fade-in text-center" role="alert"></div>

        <div id="localSearchContainer" class="glass-card fade-in d-none mb-4" style="padding: 15px 25px; border-color: var(--accent-color);">
            <div class="d-flex align-items-center">
                <i class="fas fa-search text-accent me-3" style="font-size: 1.5rem;"></i>
                <input type="text" id="localSearchInput" class="form-control local-search-input rounded-pill" placeholder="พิมพ์เพื่อค้นหา 'รหัส/ชื่อสถานี' จากรายการด้านล่าง..." onkeyup="filterLocalData()">
            </div>
        </div>

        <div id="resultsContainer" class="fade-in">
            <div class="text-center py-5" id="emptyState" style="color: var(--border-color);"><i class="fas fa-folder-open fa-4x mb-3"></i><p class="fs-5 mt-2">กรุณาเลือกเงื่อนไขและกดดึงข้อมูล</p></div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        // ✅ ใช้ Relative Path สำหรับเชื่อมต่อ API ตัวเอง
        const API_URL = ''; 
        const basinSelect = document.getElementById("myData0");
        let globalFetchedData = [];

        for (let basin of hardcodedBasins) {
            let opt = document.createElement("option"); opt.value = basin; opt.textContent = basin; basinSelect.appendChild(opt);
        }

        async function fetchData() {
            document.getElementById('emptyState')?.classList.add('d-none');
            document.getElementById('errorMessage').classList.add('d-none');
            document.getElementById('resultsContainer').innerHTML = '';
            document.getElementById('localSearchContainer').classList.add('d-none');
            document.getElementById('localSearchInput').value = ''; 
            document.getElementById('loadingIndicator').classList.remove('d-none');
            document.getElementById('searchBtn').disabled = true;

            const filterPeriod = document.getElementById('myDataPeriod').value;
            const filterBasin = document.getElementById('myData0').value;

            try {
                // ✅ แก้ไข URL ให้ตรงกับ Endpoint ที่ถูกต้อง
                const response = await fetch(`${API_URL}/api/calibrations`);
                const result = await response.json();

                if (response.ok && result.success) {
                    const textKeys = ['myDataPeriod','myData0','myData1','myData2','myData3','myData4','myData5','myData6','myData7','myData8','myData9','myData10','myData11','myData12','myData13','myData14'];
                    // ✅ ใช้ escapeHtml ที่ดึงมาจาก constants.js
                    result.data.forEach(it => textKeys.forEach(k => { if (typeof it[k] === 'string') it[k] = escapeHtml(it[k]); }));
                    
                    let filteredData = result.data;
                    if (filterPeriod) filteredData = filteredData.filter(item => item.myDataPeriod === filterPeriod);
                    if (filterBasin) filteredData = filteredData.filter(item => item.myData0 === filterBasin);

                    globalFetchedData = filteredData;
                    if (globalFetchedData.length > 0) document.getElementById('localSearchContainer').classList.remove('d-none');
                    renderCards(globalFetchedData);
                } else {
                    throw new Error(result.message || 'ไม่สามารถดึงข้อมูลจากฐานข้อมูลได้');
                }
            } catch (error) {
                showError(error.message);
            } finally {
                document.getElementById('loadingIndicator').classList.add('d-none');
                document.getElementById('searchBtn').disabled = false;
            }
        }

        function filterLocalData() {
            const searchTerm = document.getElementById('localSearchInput').value.toLowerCase().trim();
            if (searchTerm === "") return renderCards(globalFetchedData);
            const filteredData = globalFetchedData.filter(item => (item.myData1 || "").toLowerCase().includes(searchTerm) || (item.myData2 || "").toLowerCase().includes(searchTerm));
            renderCards(filteredData);
        }

        function renderCards(dataItems) {
            const container = document.getElementById('resultsContainer');
            if (dataItems.length === 0) {
                container.innerHTML = `<div class="text-center py-5 glass-card fade-in" style="color: var(--text-muted);"><i class="fas fa-search-minus fa-3x mb-3"></i><h5>ไม่พบข้อมูล</h5></div>`;
                return;
            }

            let html = '';
            const imageColsMap = [
                { field: 'myFileUrl', label: "เสาวัดระดับน้ำ (1)" }, { field: 'myFileUrl2', label: "RTU (1)" }, { field: 'myFileUrl3', label: "Website (1)" },
                { field: 'myFileUrl4', label: "เสาวัดระดับน้ำ (2)" }, { field: 'myFileUrl5', label: "RTU (2)" }, { field: 'myFileUrl6', label: "Website (2)" },
                { field: 'myFileUrl7', label: "ค่าน้ำฝน RTU" }, { field: 'myFileUrl8', label: "ค่าน้ำฝน Website" }
            ];

            dataItems.forEach((item, index) => {
                const dateObj = new Date(item.timestamp);
                const dateStr = !isNaN(dateObj.getTime()) ? dateObj.toLocaleString('th-TH', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '-';
                
                let imagesHtml = ''; let hasImage = false;
                imageColsMap.forEach(col => {
                    if (item[col.field] && item[col.field].trim() !== '') {
                        hasImage = true;
                        const fullImgUrl = /^https?:\/\//i.test(item[col.field]) ? item[col.field] : `/${item[col.field]}`;
                        imagesHtml += `<div class="image-item"><a href="${fullImgUrl}" target="_blank" class="image-wrapper"><img src="${fullImgUrl}" alt="${col.label}" loading="lazy"></a><span class="badge bg-secondary" style="font-size: 0.75rem; font-weight: normal;">${col.label}</span></div>`;
                    }
                });
                if (!hasImage) imagesHtml = `<p class="text-muted fst-italic w-100 mb-0" style="font-size: 0.85rem;"><i class="fas fa-image me-1"></i>ไม่มีรูปภาพแนบสำหรับรายงานนี้</p>`;

                html += `
                    <div class="glass-card result-card fade-in" style="animation-delay: ${0.05 * (index % 5)}s;">
                        <div class="row align-items-start">
                            <div class="col-md-8">
                                <div class="d-flex align-items-center gap-2 mb-2">
                                    <span class="badge badge-accent px-2 py-1 rounded-pill"><i class="fas fa-water me-1"></i>ลุ่มน้ำ ${item.myData0 || '-'}</span>
                                    <span class="badge" style="background-color: var(--input-bg); border: 1px solid var(--border-color);">งวด: ${item.myDataPeriod || '-'}</span>
                                </div>
                                <h4 style="color: var(--text-main); font-weight: 500; margin-bottom: 5px;">${item.myData2 || item.myData1 || 'ไม่ระบุชื่อสถานี'}</h4>
                                <p style="color: var(--accent-color); font-size: 0.95rem;">รหัสสถานี: ${item.myData1 || '-'}</p>
                            </div>
                            <div class="col-md-4 text-md-end text-start mt-3 mt-md-0">
                                <p class="mb-0 text-muted" style="font-size: 0.8rem;">วันที่บันทึก</p><p class="mb-0"><i class="far fa-calendar-alt me-1 text-muted"></i> ${dateStr}</p>
                            </div>
                        </div>
                        
                        <div class="table-responsive mt-3 mb-4">
                            <table class="table table-bordered table-dark-custom">
                                <thead>
                                    <tr><th colspan="4" class="text-center text-accent bg-transparent"><i class="fas fa-map-marker-alt me-1"></i> ที่ตั้งอาคาร: <span class="text-white fw-normal">${item.myData3 || '-'}</span></th></tr>
                                    <tr><th width="25%" class="text-center">หัวข้อการสอบเทียบ</th><th width="25%" class="text-center">เสาวัดระดับ/จำนวนเคาะ</th><th width="25%" class="text-center">RTU</th><th width="25%" class="text-center">Website</th></tr>
                                </thead>
                                <tbody>
                                    <tr><td><i class="fas fa-water me-2 text-muted"></i>ระดับน้ำ ครั้งที่ 1</td><td class="text-center">${item.myData4 || '-'}</td><td class="text-center">${item.myData5 || '-'}</td><td class="text-center">${item.myData6 || '-'}</td></tr>
                                    ${item.myData7 ? `<tr><td colspan="4" class="text-muted fst-italic py-1" style="font-size: 0.8rem; border-top: none;">หมายเหตุ 1: ${item.myData7}</td></tr>` : ''}
                                    <tr><td><i class="fas fa-water me-2 text-muted"></i>ระดับน้ำ ครั้งที่ 2</td><td class="text-center">${item.myData8 || '-'}</td><td class="text-center">${item.myData9 || '-'}</td><td class="text-center">${item.myData10 || '-'}</td></tr>
                                    <tr><td><i class="fas fa-cloud-rain me-2 text-muted"></i>ค่าน้ำฝน</td><td class="text-center">${item.myData11 || '-'}</td><td class="text-center">${item.myData12 || '-'}</td><td class="text-center">${item.myData13 || '-'}</td></tr>
                                    ${item.myData14 ? `<tr><td colspan="4" class="text-muted fst-italic py-1" style="font-size: 0.8rem; border-top: none;">หมายเหตุฝน: ${item.myData14}</td></tr>` : ''}
                                </tbody>
                            </table>
                        </div>
                        <div><p class="mb-2 text-muted" style="font-size: 0.9rem;"><i class="fas fa-camera me-1"></i> ภาพประกอบ</p><div class="image-grid">${imagesHtml}</div></div>
                    </div>`;
            });
            container.innerHTML = html;
        }

        function showError(errorMsg) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.innerHTML = `<i class="fas fa-exclamation-triangle me-2"></i> <strong>เกิดข้อผิดพลาด:</strong> ${errorMsg}`;
            errorDiv.classList.remove('d-none');
        }
    </script>
</body>
</html>
