<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายงานผลสอบเทียบค่าระดับน้ำและน้ำฝน</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- นำเข้าข้อมูลส่วนกลาง (hardcodedBasins, stationsData) -->
    <script src="constants.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #fffbeb; 
            color: #334155;
            background-image: radial-gradient(#fde047 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }

        .puffy-container {
            background-color: #ffffff;
            border-radius: 28px;
            border: 4px solid #f8fafc;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.01);
        }

        .puffy-input {
            background-color: #f8fafc;
            border: 2px solid #e2e8f0;
            color: #334155;
            transition: all 0.2s ease;
            font-weight: 600;
        }
        .puffy-input:focus {
            outline: none;
            border-color: #10b981;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15);
        }

        .btn-puffy-emerald {
            background-color: #10b981;
            color: white;
            border-radius: 16px;
            box-shadow: 0 6px 0 #059669;
            transition: all 0.1s ease;
        }
        .btn-puffy-emerald:active:not(:disabled) { transform: translateY(6px); box-shadow: 0 0px 0 #059669; }
        .btn-puffy-emerald:disabled { background-color: #94a3b8; box-shadow: 0 6px 0 #64748b; cursor: not-allowed; opacity: 0.7; }

        .calib-card {
            background: #ffffff;
            border: 3px solid #f1f5f9;
            border-radius: 24px;
            box-shadow: 0 8px 20px -5px rgba(0,0,0,0.04);
            overflow: hidden;
        }

        .photo-box {
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 18px;
            padding: 10px;
            transition: all 0.2s ease;
        }
        .photo-box:hover {
            border-color: #a7f3d0;
            box-shadow: 0 6px 15px -3px rgba(16, 185, 129, 0.12);
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col pb-12">

    <!-- Header -->
    <header class="bg-white/95 backdrop-blur-md border-b-4 border-emerald-100 sticky top-0 z-40 py-3.5 shadow-sm">
        <div class="container mx-auto px-4 flex justify-between items-center max-w-5xl">
            <div class="flex items-center space-x-3 md:space-x-4">
                <a href="index.html" class="w-11 h-11 md:w-12 md:h-12 rounded-2xl bg-white border-2 border-slate-200 flex items-center justify-center text-slate-500 hover:text-emerald-600 hover:border-emerald-200 transition-all shadow-sm active:translate-y-1 shrink-0">
                    <i class="ph-bold ph-caret-left text-2xl"></i>
                </a>
                <div class="hidden sm:flex w-12 h-12 rounded-2xl bg-emerald-100 border-2 border-emerald-300 items-center justify-center shadow-sm shrink-0">
                    <i class="ph-fill ph-ruler text-emerald-600 text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-lg md:text-2xl font-extrabold text-slate-800 tracking-tight">
                        รายงาน <span class="text-emerald-600">ผลสอบเทียบ</span>
                    </h1>
                    <p class="text-[11px] md:text-xs font-bold text-slate-400">
                        ข้อมูลการสอบเทียบค่าระดับน้ำและน้ำฝนพร้อมภาพประกอบหน้างาน
                    </p>
                </div>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-6 max-w-5xl flex-grow space-y-6">

        <!-- ตัวกรองข้อมูล (เชื่อมกับ constants.js) -->
        <div class="puffy-container p-5 md:p-7 border-t-8 border-t-emerald-500">
            <h2 class="text-sm md:text-base font-extrabold text-slate-700 mb-4 flex items-center gap-2 border-b-2 border-slate-100 pb-2.5">
                <i class="ph-bold ph-funnel text-emerald-600 text-lg"></i> กรองข้อมูลรายงานผลสอบเทียบ
            </h2>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3.5 mb-4">
                <div>
                    <label class="text-xs font-bold text-slate-500 block mb-1">ปีงบประมาณ</label>
                    <select id="filterYear" onchange="applyFilters()" class="w-full p-3 text-sm rounded-xl puffy-input">
                        <option value="all">-- ทุกปีงบประมาณ --</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-500 block mb-1">งวดการตรวจสอบ</label>
                    <select id="filterPeriod" onchange="applyFilters()" class="w-full p-3 text-sm rounded-xl puffy-input">
                        <option value="all">-- ทุกงวด --</option>
                        <option value="งวดที่1">งวดที่ 1</option>
                        <option value="งวดที่2">งวดที่ 2</option>
                        <option value="งวดที่3">งวดที่ 3</option>
                        <option value="งวดที่4">งวดที่ 4</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-500 block mb-1">กลุ่มลุ่มน้ำ</label>
                    <select id="filterBasin" onchange="onBasinChange()" class="w-full p-3 text-sm rounded-xl puffy-input">
                        <option value="all">-- ทุกกลุ่มลุ่มน้ำ --</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-500 block mb-1">เลือกสถานี</label>
                    <select id="filterStation" onchange="applyFilters()" class="w-full p-3 text-sm rounded-xl puffy-input">
                        <option value="all">-- ทุกสถานี --</option>
                    </select>
                </div>
            </div>

            <div class="flex flex-wrap items-center justify-between gap-3 pt-2">
                <span id="recordCountBadge" class="text-xs font-extrabold bg-emerald-50 text-emerald-700 px-3.5 py-2 rounded-xl border border-emerald-200">
                    กำลังโหลดข้อมูล...
                </span>
                <button type="button" onclick="loadCalibrations()" id="btnRefresh"
                        class="btn-puffy-emerald px-5 py-2.5 text-xs md:text-sm font-extrabold flex items-center gap-2">
                    <i class="ph-bold ph-arrows-clockwise text-base"></i> รีเฟรชข้อมูลล่าสุด
                </button>
            </div>
        </div>

        <!-- พื้นที่แสดงรายการรายงานผลสอบเทียบ -->
        <div id="calibrationListContainer" class="space-y-6">
            <div class="py-16 text-center text-emerald-600 bg-white rounded-3xl border-4 border-slate-100">
                <i class="ph-bold ph-spinner animate-spin text-4xl mb-2"></i>
                <p class="font-extrabold text-sm">กำลังดึงข้อมูลผลสอบเทียบ...</p>
            </div>
        </div>

    </main>

    <!-- Modal สำหรับกดขยายดูรูปภาพขนาดใหญ่ -->
    <div id="imageModal" onclick="closeImageModal()" class="fixed inset-0 z-50 hidden bg-slate-900/85 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="relative max-w-3xl w-full bg-white rounded-3xl p-3 shadow-2xl" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center px-3 py-2 border-b border-slate-100 mb-2">
                <span id="modalCaption" class="font-extrabold text-sm text-slate-700">ภาพประกอบการสอบเทียบ</span>
                <button type="button" onclick="closeImageModal()" class="w-8 h-8 rounded-full bg-rose-50 text-rose-500 flex items-center justify-center font-bold hover:bg-rose-500 hover:text-white transition-all">
                    <i class="ph-bold ph-x"></i>
                </button>
            </div>
            <img id="modalImg" src="" alt="Preview" class="w-full max-h-[75vh] object-contain rounded-2xl bg-slate-50">
        </div>
    </div>

    <script>
        // =========================================================================
        // แก้ไขปัญหา APK: ใน WebView ของ Android ค่า hostname มักเป็น localhost
        // จึงต้องบังคับชี้ไปที่เซิร์ฟเวอร์ Render เสมอ ยกเว้นเปิดเทสบนคอมพิวเตอร์พอร์ต 3000/5000
        // =========================================================================
        const isLocalPcDev = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') 
                             && (window.location.port === '3000' || window.location.port === '5000');
        const API_BASE = isLocalPcDev ? '' : 'https://ma-inspection-project.onrender.com';

        let allCalibrations = [];

        const safeEscape = (str) => {
            if (typeof escapeHtml === 'function') return escapeHtml(str);
            return String(str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        };

        // คำนวณปีงบประมาณไทยจากวันที่บันทึก
        function getFiscalYear(item) {
            if (item.contractYear && String(item.contractYear).trim() !== '') {
                return String(item.contractYear).trim();
            }
            const d = new Date(item.timestamp || item.createdAt);
            if (isNaN(d.getTime())) return '';
            let y = d.getFullYear() + 543;
            if (d.getMonth() >= 9) y += 1;
            return String(y);
        }

        // ดึง File ID ของ Google Drive ออกจากลิงก์ทุกรูปแบบ
        function extractDriveFileId(rawUrl) {
            if (!rawUrl) return null;
            const str = String(rawUrl).trim();
            const m1 = str.match(/[?&]id=([a-zA-Z0-9_-]+)/);
            if (m1) return m1[1];
            const m2 = str.match(/\/d\/([a-zA-Z0-9_-]+)/);
            if (m2) return m2[1];
            const m3 = str.match(/\/api\/images\/([a-zA-Z0-9_-]+)/);
            if (m3) return m3[1];
            return null;
        }

        // =========================================================================
        // แก้ปัญหารูปขึ้น Image Error บน APK:
        // แปลงลิงก์รูปทั้งหมดให้วิ่งผ่าน Proxy ของเซิร์ฟเวอร์ (/api/images/:fileId) เป็นหลัก
        // =========================================================================
        function resolveDriveImageUrl(rawUrl) {
            if (!rawUrl || String(rawUrl).trim() === '') return '';
            const clean = String(rawUrl).trim();
            const fileId = extractDriveFileId(clean);

            if (fileId) {
                return `${API_BASE}/api/images/${fileId}`;
            }
            if (clean.startsWith('/')) {
                return `${API_BASE}${clean}`;
            }
            if (!clean.startsWith('http')) {
                return `${API_BASE}/${clean}`;
            }
            return clean;
        }

        // กรณี Proxy โหลดไม่ทัน ให้สลับไปใช้ lh3.googleusercontent.com หรือ thumbnail สำรองอัตโนมัติ
        function handleImageFallback(imgEl, rawUrl) {
            const fileId = extractDriveFileId(rawUrl);
            const step = parseInt(imgEl.getAttribute('data-fallback-step') || '0', 10);

            if (fileId && step === 0) {
                imgEl.setAttribute('data-fallback-step', '1');
                imgEl.src = `https://lh3.googleusercontent.com/d/${fileId}=w800`;
                return;
            }
            if (fileId && step === 1) {
                imgEl.setAttribute('data-fallback-step', '2');
                imgEl.src = `https://drive.google.com/thumbnail?id=${fileId}&sz=w800`;
                return;
            }

            // หากลองครบทุกทางแล้วยังโหลดไม่ได้ ให้แสดงกล่องแจ้งเตือนที่สวยงามแทนคำว่า Image Error
            imgEl.style.display = 'none';
            const parent = imgEl.parentElement;
            if (parent && !parent.querySelector('.img-fallback-placeholder')) {
                const ph = document.createElement('div');
                ph.className = 'img-fallback-placeholder w-full h-36 rounded-xl bg-slate-100 flex flex-col items-center justify-center text-slate-400 p-2 text-center';
                ph.innerHTML = '<i class="ph-fill ph-image-broken text-3xl mb-1"></i><span class="text-[11px] font-bold">ไม่มีรูปภาพ</span>';
                parent.insertBefore(ph, imgEl);
            }
        }

        function openImageModal(src, caption) {
            if (!src) return;
            document.getElementById('modalImg').src = src;
            document.getElementById('modalCaption').textContent = caption || 'ภาพประกอบการสอบเทียบ';
            document.getElementById('imageModal').classList.remove('hidden');
        }

        function closeImageModal() {
            document.getElementById('imageModal').classList.add('hidden');
            document.getElementById('modalImg').src = '';
        }

        // ค้นหาชื่อสถานีจาก constants.js
        function lookupStationName(code, basin) {
            if (!code || typeof stationsData === 'undefined') return '';
            const c = String(code).trim();
            if (basin && stationsData[basin] && stationsData[basin][c]) {
                return stationsData[basin][c];
            }
            for (const bKey of Object.keys(stationsData)) {
                if (stationsData[bKey] && stationsData[bKey][c]) {
                    return stationsData[bKey][c];
                }
            }
            return '';
        }

        function populateStationsDropdown(selectedBasin) {
            const stationSelect = document.getElementById('filterStation');
            stationSelect.innerHTML = '<option value="all">-- ทุกสถานี --</option>';

            if (typeof stationsData === 'undefined') return;

            if (selectedBasin && selectedBasin !== 'all') {
                const map = stationsData[selectedBasin] || {};
                Object.keys(map).forEach(code => {
                    const opt = document.createElement('option');
                    opt.value = code;
                    opt.textContent = `${code} - ${map[code]}`;
                    stationSelect.appendChild(opt);
                });
            } else {
                const added = new Set();
                Object.keys(stationsData).forEach(bKey => {
                    const map = stationsData[bKey] || {};
                    Object.keys(map).forEach(code => {
                        if (!added.has(code)) {
                            added.add(code);
                            const opt = document.createElement('option');
                            opt.value = code;
                            opt.textContent = `[${bKey}] ${code} - ${map[code]}`;
                            stationSelect.appendChild(opt);
                        }
                    });
                });
            }
        }

        function onBasinChange() {
            const basin = document.getElementById('filterBasin').value;
            populateStationsDropdown(basin);
            applyFilters();
        }

        window.onload = () => {
            const filterYear = document.getElementById('filterYear');
            const startYear = 2568;
            for (let i = 0; i <= 10; i++) {
                const y = startYear + i;
                filterYear.innerHTML += `<option value="${y}">${y}</option>`;
            }

            const filterBasin = document.getElementById('filterBasin');
            if (typeof hardcodedBasins !== 'undefined' && Array.isArray(hardcodedBasins)) {
                hardcodedBasins.forEach(b => {
                    filterBasin.innerHTML += `<option value="${safeEscape(b)}">${safeEscape(b)}</option>`;
                });
            } else if (typeof stationsData !== 'undefined') {
                Object.keys(stationsData).forEach(b => {
                    filterBasin.innerHTML += `<option value="${safeEscape(b)}">${safeEscape(b)}</option>`;
                });
            }

            populateStationsDropdown('all');
            loadCalibrations();
        };

        async function loadCalibrations() {
            const container = document.getElementById('calibrationListContainer');
            const btn = document.getElementById('btnRefresh');
            btn.disabled = true;

            try {
                const response = await fetch(`${API_BASE}/api/calibrations`, {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' }
                });

                const contentType = response.headers.get("content-type") || "";
                if (!contentType.includes("application/json")) {
                    throw new Error("เซิร์ฟเวอร์กำลังตื่นตัว (Cold Start) กรุณารอ 10 วินาทีแล้วกดรีเฟรชอีกครั้ง");
                }

                const result = await response.json();
                if (response.ok && result.success) {
                    allCalibrations = Array.isArray(result.data) ? result.data : [];
                    applyFilters();
                } else {
                    throw new Error(result.message || 'ดึงข้อมูลผลสอบเทียบไม่สำเร็จ');
                }
            } catch (error) {
                container.innerHTML = `
                    <div class="bg-rose-50 border-2 border-rose-200 p-8 rounded-2xl text-center">
                        <i class="ph-fill ph-warning-circle text-4xl text-rose-500 mb-2"></i>
                        <p class="font-extrabold text-rose-700">${safeEscape(error.message)}</p>
                    </div>`;
            } finally {
                btn.disabled = false;
            }
        }

        function applyFilters() {
            const year = document.getElementById('filterYear').value;
            const period = document.getElementById('filterPeriod').value;
            const basin = document.getElementById('filterBasin').value;
            const station = document.getElementById('filterStation').value;

            const filtered = allCalibrations.filter(item => {
                if (year !== 'all' && getFiscalYear(item) !== year) return false;
                if (period !== 'all') {
                    const pNum = period.replace(/\D/g, '');
                    const itemP = String(item.myDataPeriod || '').replace(/\s+/g, '');
                    if (!itemP.includes(pNum) && itemP !== period) return false;
                }
                if (basin !== 'all' && item.myData0 !== basin) return false;
                if (station !== 'all') {
                    const st1 = String(item.myData1 || '').trim().toUpperCase();
                    const stFilter = String(station).trim().toUpperCase();
                    if (st1 !== stFilter && !st1.startsWith(stFilter)) return false;
                }
                return true;
            });

            document.getElementById('recordCountBadge').textContent = `พบข้อมูลทั้งหมด ${filtered.length} รายการ`;
            renderCalibrations(filtered);
        }

        function renderCalibrations(list) {
            const container = document.getElementById('calibrationListContainer');
            if (!list || list.length === 0) {
                container.innerHTML = `
                    <div class="py-16 text-center bg-white rounded-3xl border-4 border-dashed border-slate-200 text-slate-400">
                        <i class="ph-fill ph-empty text-5xl mb-2 text-slate-300"></i>
                        <p class="font-extrabold text-slate-500">ไม่พบข้อมูลผลสอบเทียบตามเงื่อนไขที่เลือก</p>
                    </div>`;
                return;
            }

            let html = '';
            list.forEach((item) => {
                const dateStr = new Date(item.timestamp || item.createdAt).toLocaleString('th-TH', {
                    year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
                });

                const stCode = item.myData1 || '-';
                const basinName = item.myData0 || '-';
                const stName = lookupStationName(stCode, basinName) || item.myData2 || stCode;
                const fiscalYear = getFiscalYear(item);
                const periodLabel = item.myDataPeriod || 'ไม่ระบุงวด';

                // จัดการรายการรูปภาพทั้งหมดของสถานีนี้
                const photoConfigs = [
                    { label: 'เสาวัดระดับ 1', rawUrl: item.myFileUrl, val: item.myData4 ? `${item.myData4} ม.รสม.` : '' },
                    { label: 'RTU 1', rawUrl: item.myFileUrl2, val: item.myData5 ? `${item.myData5} ม.รสม.` : '' },
                    { label: 'WEBSITE 1', rawUrl: item.myFileUrl3, val: item.myData6 ? `${item.myData6} ม.รสม.` : '' },
                    { label: 'เสาวัดระดับ 2', rawUrl: item.myFileUrl4, val: item.myData8 ? `${item.myData8} ม.รสม.` : '' },
                    { label: 'RTU 2', rawUrl: item.myFileUrl5, val: item.myData9 ? `${item.myData9} ม.รสม.` : '' },
                    { label: 'WEBSITE 2', rawUrl: item.myFileUrl6, val: item.myData10 ? `${item.myData10} ม.รสม.` : '' },
                    { label: 'น้ำฝน RTU', rawUrl: item.myFileUrl7, val: item.myData12 ? `${item.myData12} มม.` : '' },
                    { label: 'น้ำฝน WEBSITE', rawUrl: item.myFileUrl8, val: item.myData13 ? `${item.myData13} มม.` : '' }
                ].filter(p => p.rawUrl && String(p.rawUrl).trim() !== '');

                let photosHtml = '';
                photoConfigs.forEach(p => {
                    const resolvedUrl = resolveDriveImageUrl(p.rawUrl);
                    photosHtml += `
                    <div class="photo-box flex flex-col items-center text-center">
                        <div class="w-full h-36 rounded-xl overflow-hidden bg-slate-50 mb-2 flex items-center justify-center cursor-pointer"
                             onclick="openImageModal('${safeEscape(resolvedUrl)}', '${safeEscape(stCode + ' - ' + p.label)}')">
                            <img src="${safeEscape(resolvedUrl)}"
                                 alt="${safeEscape(p.label)}"
                                 loading="lazy"
                                 onerror="handleImageFallback(this, '${safeEscape(p.rawUrl)}')"
                                 class="w-full h-full object-cover hover:scale-105 transition-transform">
                        </div>
                        <span class="text-xs font-extrabold text-slate-700">${safeEscape(p.label)}</span>
                        ${p.val ? `<span class="text-[11px] font-bold text-emerald-600 mt-0.5">${safeEscape(p.val)}</span>` : ''}
                    </div>`;
                });

                html += `
                <div class="calib-card">
                    <!-- หัวการ์ด -->
                    <div class="bg-slate-50 p-4 md:p-5 border-b border-slate-200 flex flex-wrap justify-between items-start gap-3">
                        <div>
                            <div class="flex flex-wrap items-center gap-2 mb-1">
                                <span class="bg-emerald-600 text-white text-[10px] font-black px-2.5 py-0.5 rounded uppercase">
                                    ปี ${safeEscape(fiscalYear)} | ${safeEscape(periodLabel)}
                                </span>
                                <span class="bg-slate-200 text-slate-700 text-[10px] font-bold px-2.5 py-0.5 rounded">
                                    ลุ่มน้ำ${safeEscape(basinName)}
                                </span>
                            </div>
                            <h3 class="text-base md:text-xl font-black text-slate-800 flex items-center gap-2">
                                <i class="ph-fill ph-map-pin text-emerald-500"></i> ${safeEscape(stCode)} — ${safeEscape(stName)}
                            </h3>
                            <p class="text-xs font-bold text-slate-400 mt-1">
                                <i class="ph-bold ph-clock"></i> บันทึกเมื่อ: ${dateStr}
                            </p>
                        </div>
                    </div>

                    <div class="p-4 md:p-6 space-y-5">
                        <!-- ตารางสรุปค่าสอบเทียบระดับน้ำและน้ำฝน -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <!-- ระดับน้ำ -->
                            <div class="p-4 rounded-2xl bg-sky-50/60 border-2 border-sky-100">
                                <h4 class="text-xs font-extrabold text-sky-800 uppercase mb-2.5 flex items-center gap-1.5">
                                    <i class="ph-fill ph-waves text-sky-500 text-base"></i> 1. ผลสอบเทียบระดับน้ำ (ม.รสม.)
                                </h4>
                                <div class="text-xs space-y-1.5 font-semibold text-slate-600">
                                    <div class="flex justify-between border-b border-sky-100 pb-1">
                                        <span>ครั้งที่ 1 (เสา / RTU / Web):</span>
                                        <span class="font-extrabold text-slate-800">${safeEscape(item.myData4 || '-')} / ${safeEscape(item.myData5 || '-')} / ${safeEscape(item.myData6 || '-')}</span>
                                    </div>
                                    <div class="flex justify-between border-b border-sky-100 pb-1">
                                        <span>ครั้งที่ 2 (เสา / RTU / Web):</span>
                                        <span class="font-extrabold text-slate-800">${safeEscape(item.myData8 || '-')} / ${safeEscape(item.myData9 || '-')} / ${safeEscape(item.myData10 || '-')}</span>
                                    </div>
                                    <div class="pt-1 text-slate-700">
                                        <b>หมายเหตุระดับน้ำ:</b> ${safeEscape(item.myData7 || '-')}
                                    </div>
                                </div>
                            </div>

                            <!-- น้ำฝน -->
                            <div class="p-4 rounded-2xl bg-amber-50/60 border-2 border-amber-100">
                                <h4 class="text-xs font-extrabold text-amber-800 uppercase mb-2.5 flex items-center gap-1.5">
                                    <i class="ph-fill ph-cloud-rain text-amber-500 text-base"></i> 2. ผลสอบเทียบน้ำฝน (มม.)
                                </h4>
                                <div class="text-xs space-y-1.5 font-semibold text-slate-600">
                                    <div class="flex justify-between border-b border-amber-100 pb-1">
                                        <span>จำนวนเคาะกระบอกน้ำฝน:</span>
                                        <span class="font-extrabold text-slate-800">${safeEscape(item.myData11 || '-')} ครั้ง</span>
                                    </div>
                                    <div class="flex justify-between border-b border-amber-100 pb-1">
                                        <span>ค่าระดับน้ำฝน (RTU / Web):</span>
                                        <span class="font-extrabold text-slate-800">${safeEscape(item.myData12 || '-')} / ${safeEscape(item.myData13 || '-')} มม.</span>
                                    </div>
                                    <div class="pt-1 text-slate-700">
                                        <b>หมายเหตุฝน:</b> ${safeEscape(item.myData14 || '-')}
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- ภาพประกอบการสอบเทียบ -->
                        ${photosHtml ? `
                        <div>
                            <h4 class="text-xs md:text-sm font-extrabold text-slate-700 mb-3 flex items-center gap-2">
                                <i class="ph-fill ph-images text-sky-500 text-lg"></i> ภาพประกอบการสอบเทียบ (แตะที่รูปเพื่อขยาย)
                            </h4>
                            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3.5">
                                ${photosHtml}
                            </div>
                        </div>` : ''}
                    </div>
                </div>`;
            });

            container.innerHTML = html;
        }
    </script>
</body>
</html>
