<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard แสดงผลสอบเทียบ | 3D Cartoon Edition</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- นำเข้า Constants -->
    <script src="constants.js"></script>
    
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: { 
                        sky: { 50: '#f0f9ff', 100: '#e0f2fe', 400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7' },
                        emerald: { 50: '#ecfdf5', 100: '#d1fae5', 400: '#34d399', 500: '#10b981', 600: '#059669' },
                        violet: { 50: '#f5f3ff', 100: '#ede9fe', 400: '#a78bfa', 500: '#8b5cf6', 600: '#7c3aed' },
                        amber: { 50: '#fffbeb', 100: '#fef3c7', 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706' },
                        rose: { 50: '#fff1f2', 100: '#ffe4e6', 400: '#fb7185', 500: '#f43f5e' }
                    }
                } 
            }
        }
    </script>
    <style>
        body {
            background-color: #fffbeb; 
            color: #334155;
            background-image: radial-gradient(#fde047 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            -webkit-overflow-scrolling: touch;
        }
        
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #fef08a; border-radius: 8px; }
        ::-webkit-scrollbar-thumb { background: #facc15; border-radius: 8px; border: 2px solid #fffbeb; }

        .puffy-container {
            background-color: #ffffff;
            border-radius: 24px;
            border: 4px solid #f8fafc;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.01);
            margin-bottom: 24px;
        }

        .result-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-top-width: 8px;
        }
        .result-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.05);
        }

        .puffy-input {
            background-color: #f8fafc;
            border: 2px solid #e2e8f0;
            color: #334155;
            transition: all 0.2s ease;
            font-weight: 600;
        }
        .puffy-input:focus {
            outline: none;
            border-color: #38bdf8;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.2);
        }

        .btn-puffy-blue {
            background-color: #38bdf8;
            color: white;
            border-radius: 16px;
            box-shadow: 0 6px 0 #0284c7;
            transition: all 0.15s ease;
            font-weight: 700;
            border: 4px solid #bae6fd;
        }
        .btn-puffy-blue:active:not(:disabled) { transform: translateY(6px); box-shadow: 0 0px 0 #0284c7; }
        .btn-puffy-blue:disabled { background-color: #94a3b8; box-shadow: 0 6px 0 #64748b; border-color: #cbd5e1; cursor: not-allowed; opacity: 0.8; }

        .polaroid-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 16px; margin-top: 16px; }
        .polaroid { 
            background: #ffffff; padding: 10px 10px 16px 10px; 
            border: 2px solid #e2e8f0; border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }
        .polaroid:hover { transform: scale(1.05) rotate(-2deg); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); border-color: #cbd5e1; z-index: 10; position: relative; }
        .polaroid-img-wrapper { aspect-ratio: 1; overflow: hidden; border-radius: 8px; border: 2px solid #f1f5f9; background: #f8fafc; }
        .polaroid-img-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        
        .table-custom { border-collapse: separate; border-spacing: 0; width: 100%; border-radius: 16px; border: 2px solid #e2e8f0; overflow: hidden; }
        .table-custom th, .table-custom td { padding: 12px 16px; border-bottom: 2px solid #f1f5f9; text-align: center; }
        .table-custom th { background-color: #f8fafc; font-weight: 700; color: #475569; font-size: 0.85rem; border-bottom: 2px solid #e2e8f0; }
        .table-custom td { font-size: 0.95rem; font-weight: 600; color: #334155; }
        .table-custom tr:last-child td { border-bottom: none; }
        .table-custom tr:hover td { background-color: #f8fafc; }

        .fade-in { animation: fadeIn 0.4s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col font-sans">
    
    <!-- Header สไตล์ 3D Cartoon -->
    <header class="bg-white/90 backdrop-blur-md border-b-4 border-slate-100 sticky top-0 z-50 py-3 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 flex justify-between items-center">
            <div class="flex items-center space-x-3 md:space-x-4">
                <a href="index.html" class="w-12 h-12 rounded-2xl bg-white border-2 border-slate-200 flex items-center justify-center text-slate-500 hover:text-emerald-500 hover:border-emerald-200 transition-all shadow-sm active:translate-y-1">
                    <i class="ph-bold ph-caret-left text-2xl"></i>
                </a>
                <div class="hidden md:flex w-12 h-12 rounded-2xl bg-emerald-100 border-2 border-emerald-300 items-center justify-center shadow-sm">
                    <i class="ph-fill ph-chart-bar text-emerald-500 text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl font-extrabold text-slate-800 tracking-tight">
                        รายงาน <span class="text-emerald-500">ผลสอบเทียบ</span>
                    </h1>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-5xl mx-auto w-full px-4 py-8">
        
        <!-- ตัวกรองการค้นหา -->
        <div class="puffy-container p-6 border-t-8 border-t-sky-400 fade-in">
            <h2 class="text-lg font-bold text-sky-600 mb-4 flex items-center gap-2 border-b-2 border-sky-100 pb-3">
                <i class="ph-fill ph-magnifying-glass text-2xl"></i> ค้นหาข้อมูลผลสอบเทียบ
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div class="space-y-1.5">
                    <label class="text-sm font-bold text-slate-600">งวดตรวจงาน MA</label>
                    <select id="myDataPeriod" class="w-full p-3.5 rounded-xl puffy-input">
                        <option value="">ทั้งหมด (ทุกงวด)</option>
                        <option value="งวดที่1">งวดที่ 1</option>
                        <option value="งวดที่2">งวดที่ 2</option>
                        <option value="งวดที่3">งวดที่ 3</option>
                        <option value="งวดที่4">งวดที่ 4</option>
                    </select>
                </div>
                <div class="space-y-1.5">
                    <label class="text-sm font-bold text-slate-600">กลุ่มลุ่มน้ำ</label>
                    <select id="myData0" class="w-full p-3.5 rounded-xl puffy-input">
                        <option value="">ทั้งหมด (ทุกลุ่มน้ำ)</option>
                    </select>
                </div>
            </div>
            <div class="mt-6 flex justify-end">
                <button onclick="fetchData()" id="searchBtn" class="btn-puffy-blue px-8 py-3.5 flex items-center justify-center gap-2 w-full md:w-auto text-lg">
                    <i class="ph-bold ph-cloud-arrow-down text-2xl"></i> ดึงข้อมูล
                </button>
            </div>
        </div>

        <!-- สถานะ Loading / แจ้งเตือน -->
        <div id="loadingIndicator" class="hidden flex flex-col items-center justify-center py-12 fade-in">
            <i class="ph-bold ph-spinner animate-spin text-5xl text-sky-500 mb-4"></i>
            <p class="text-slate-500 font-bold text-sm" id="loadingText">กำลังโหลดข้อมูลจากฐานข้อมูล...</p>
        </div>
        
        <div id="errorMessage" class="hidden bg-rose-50 border-2 border-rose-200 text-rose-700 p-5 rounded-2xl mb-6 flex gap-3 items-start fade-in">
            <i class="ph-fill ph-warning-circle text-3xl mt-0.5"></i>
            <div>
                <h3 class="font-extrabold text-lg">แจ้งเตือน</h3>
                <p class="text-sm mt-1 font-medium" id="errorText"></p>
            </div>
        </div>

        <!-- ช่องค้นหาภายในเครื่อง (Local Search) -->
        <div id="localSearchContainer" class="hidden puffy-container p-4 md:p-5 mb-6 border-t-8 border-t-emerald-400 fade-in flex items-center gap-3">
            <div class="w-12 h-12 bg-emerald-100 rounded-xl flex items-center justify-center shrink-0 border-2 border-emerald-200">
                <i class="ph-bold ph-magnifying-glass text-emerald-500 text-xl"></i>
            </div>
            <div class="flex-grow">
                <input type="text" id="localSearchInput" class="w-full p-3 rounded-xl puffy-input text-sm" placeholder="พิมพ์ชื่อหรือรหัสสถานีเพื่อกรองรายการด้านล่าง..." onkeyup="filterLocalData()">
            </div>
        </div>

        <!-- พื้นที่แสดงผลการ์ด -->
        <div id="resultsContainer" class="fade-in space-y-6">
            <div class="puffy-container py-16 text-center border-dashed border-slate-300" id="emptyState">
                <div class="w-20 h-20 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4 border-4 border-white shadow-sm">
                    <i class="ph-fill ph-folder-open text-4xl text-slate-300"></i>
                </div>
                <h3 class="text-xl font-extrabold text-slate-600">กรุณาเลือกเงื่อนไข</h3>
                <p class="text-slate-400 font-medium text-sm mt-1">แล้วกดปุ่ม "ดึงข้อมูล" เพื่อดูรายงาน</p>
            </div>
        </div>

    </main>

    <script>
        let globalFetchedData = [];
        const BASE_URL = 'https://ma-inspection-project.onrender.com';
        
        const fallbackBasins = [
            "โขงเหนือ", "โขงอีสาน", "ชี", "มูล", "ปิง", "วัง", "ยม", "น่าน", "เจ้าพระยา",
            "ป่าสัก", "สะแกกรัง", "ท่าจีน", "แม่กลอง", "บางปะกง", "ชายทะเลฝั่งตะวันออก",
            "เพชรบุรี-ประจวบคีรีขันธ์", "ภาคใต้ฝั่งตะวันตก", "ภาคใต้ฝั่งตะวันออกตอนบน",
            "ภาคใต้ฝั่งตะวันออกตอนล่าง", "ทะเลสาบสงขลา", "สาละวิน", "โตนเลสาป", "KRC"
        ];

        const safeEscapeHtml = (unsafe) => {
            if (typeof escapeHtml === 'function') return escapeHtml(unsafe);
            return (unsafe || '').toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        };

        function initBasins() {
            const basinSelect = document.getElementById("myData0");
            const basinsToUse = (typeof hardcodedBasins !== 'undefined') ? hardcodedBasins : fallbackBasins;
            basinsToUse.forEach(basin => { 
                let opt = document.createElement("option"); 
                opt.value = basin; 
                opt.textContent = basin; 
                basinSelect.appendChild(opt); 
            });
        }
        
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initBasins);
        } else {
            initBasins();
        }

        // 🔥 แก้ปัญหารูปภาพ Google Drive ไม่แสดง 100%
        function parseImageInfo(imagePath) {
            if (!imagePath || imagePath.trim() === '') return null;
            let path = imagePath.trim();
            let fileId = null;

            // 1. ดักจับ API รูปแบบเก่า (ถ้ามีหลงเหลือ)
            if (path.includes('/api/images/')) {
                const parts = path.split('/api/images/');
                fileId = parts[parts.length - 1].replace(/\//g, '');
            }
            // 2. ดักจับทุกลิงก์ของ Google Drive
            else if (path.includes('drive.google.com') || path.includes('drive.usercontent.google.com')) {
                const matchFileD = path.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
                if (matchFileD) {
                    fileId = matchFileD[1];
                } else {
                    const matchId = path.match(/[?&]id=([a-zA-Z0-9_-]+)/);
                    if (matchId) fileId = matchId[1];
                }
            }

            // ถ้าระบุ ID ไฟล์จาก Google Drive ได้
            if (fileId) {
                return {
                    href: `https://drive.google.com/file/d/${fileId}/view`, // สำหรับกดคลิกเข้าไปดูภาพใหญ่
                    src: `https://drive.google.com/thumbnail?id=${fileId}&sz=w800` // สำหรับแสดงพรีวิวในแท็ก <img> (ทะลุบล็อก Google)
                };
            }

            // 3. ถ้าเป็นลิงก์เว็บทั่วไป (http:// หรือ https://)
            if (/^https?:\/\//i.test(path)) {
                return { href: path, src: path };
            }
            
            // 4. กรณีไฟล์ในเครื่อง Server (uploads/ภาษาไทย)
            let normalizedPath = path.replace(/\\/g, '/');
            let cleanPath = normalizedPath.startsWith('/') ? normalizedPath.substring(1) : normalizedPath;
            // เข้ารหัสภาษาไทยให้ URL ใช้งานได้
            let encodedPath = cleanPath.split('/').map(part => encodeURIComponent(part)).join('/');
            const fullUrl = `${BASE_URL}/${encodedPath}`;
            
            return { href: fullUrl, src: fullUrl };
        }

        async function fetchData() {
            const emptyState = document.getElementById('emptyState');
            if (emptyState) emptyState.classList.add('hidden');
            
            document.getElementById('errorMessage').classList.add('hidden');
            document.getElementById('resultsContainer').innerHTML = '';
            document.getElementById('localSearchContainer').classList.add('hidden');
            document.getElementById('localSearchInput').value = ''; 
            document.getElementById('loadingIndicator').classList.remove('hidden');
            
            const btn = document.getElementById('searchBtn');
            const originalBtnHtml = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="ph-bold ph-spinner animate-spin text-2xl"></i> กำลังดึงข้อมูล...';

            const filterPeriod = document.getElementById('myDataPeriod').value;
            const filterBasin = document.getElementById('myData0').value;

            try {
                const response = await fetch(`${BASE_URL}/api/calibrations`);
                const result = await response.json();

                if (response.ok && result.success) {
                    const textKeys = ['myDataPeriod','myData0','myData1','myData2','myData3','myData4','myData5','myData6','myData7','myData8','myData9','myData10','myData11','myData12','myData13','myData14'];
                    
                    result.data.forEach(it => {
                        textKeys.forEach(k => { 
                            if (typeof it[k] === 'string') {
                                it[k] = safeEscapeHtml(it[k]); 
                            }
                        });
                    });
                    
                    let filteredData = result.data;
                    if (filterPeriod) filteredData = filteredData.filter(item => item.myDataPeriod === filterPeriod);
                    if (filterBasin) filteredData = filteredData.filter(item => item.myData0 === filterBasin);

                    globalFetchedData = filteredData;
                    
                    if (globalFetchedData.length > 0) {
                        document.getElementById('localSearchContainer').classList.remove('hidden');
                    }
                    
                    renderCards(globalFetchedData);
                } else {
                    throw new Error(result.message || 'ไม่สามารถดึงข้อมูลจากฐานข้อมูลได้');
                }
            } catch (error) {
                document.getElementById('errorText').innerText = error.message;
                document.getElementById('errorMessage').classList.remove('hidden');
            } finally {
                document.getElementById('loadingIndicator').classList.add('hidden');
                btn.disabled = false;
                btn.innerHTML = originalBtnHtml;
            }
        }

        function filterLocalData() {
            const searchTerm = document.getElementById('localSearchInput').value.toLowerCase().trim();
            if (searchTerm === "") {
                renderCards(globalFetchedData);
                return;
            }
            const filteredData = globalFetchedData.filter(item => 
                (item.myData1 || "").toLowerCase().includes(searchTerm) || 
                (item.myData2 || "").toLowerCase().includes(searchTerm)
            );
            renderCards(filteredData);
        }

        function renderCards(dataItems) {
            const container = document.getElementById('resultsContainer');
            if (dataItems.length === 0) {
                container.innerHTML = `
                <div class="puffy-container py-16 text-center border-dashed border-slate-300 fade-in">
                    <div class="w-20 h-20 bg-rose-50 rounded-full flex items-center justify-center mx-auto mb-4 border-4 border-white shadow-sm">
                        <i class="ph-fill ph-magnifying-glass text-4xl text-rose-300"></i>
                    </div>
                    <h3 class="text-xl font-extrabold text-slate-600">ไม่พบข้อมูลที่ค้นหา</h3>
                </div>`;
                return;
            }

            let html = '';
            const imageColsMap = [
                { field: 'myFileUrl', label: "เสาวัดระดับ 1" }, { field: 'myFileUrl2', label: "RTU 1" }, { field: 'myFileUrl3', label: "Website 1" },
                { field: 'myFileUrl4', label: "เสาวัดระดับ 2" }, { field: 'myFileUrl5', label: "RTU 2" }, { field: 'myFileUrl6', label: "Website 2" },
                { field: 'myFileUrl7', label: "น้ำฝน RTU" }, { field: 'myFileUrl8', label: "น้ำฝน Website" }
            ];

            const colors = ['border-t-sky-400', 'border-t-emerald-400', 'border-t-violet-400', 'border-t-amber-400', 'border-t-rose-400'];

            dataItems.forEach((item, index) => {
                const dateObj = new Date(item.createdAt || item.timestamp);
                const dateStr = !isNaN(dateObj.getTime()) ? dateObj.toLocaleString('th-TH', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '-';
                
                let imagesHtml = ''; let hasImage = false;
                
                imageColsMap.forEach(col => {
                    const imgInfo = parseImageInfo(item[col.field]);
                    if (imgInfo) {
                        hasImage = true;
                        imagesHtml += `
                        <div class="polaroid">
                            <a href="${imgInfo.href}" target="_blank" class="polaroid-img-wrapper block mb-2">
                                <img src="${imgInfo.src}" alt="${col.label}" loading="lazy" onerror="this.onerror=null; this.src='https://placehold.co/400x400/f1f5f9/64748b?text=Image+Error';">
                            </a>
                            <p class="text-center text-[10px] font-bold text-slate-600 mb-0 uppercase">${col.label}</p>
                        </div>`;
                    }
                });
                
                if (!hasImage) {
                    imagesHtml = `<div class="bg-slate-50 w-full p-4 rounded-xl text-center border-2 border-dashed border-slate-200 text-slate-400 font-bold text-sm"><i class="ph-fill ph-image-slash text-2xl block mb-1 text-slate-300"></i>ไม่มีรูปภาพแนบสำหรับรายงานนี้</div>`;
                }

                const cardColor = colors[index % colors.length];

                html += `
                    <div class="puffy-container result-card ${cardColor} p-5 md:p-6 fade-in" style="animation-delay: ${0.05 * (index % 5)}s;">
                        <div class="flex flex-col md:flex-row md:items-start md:justify-between gap-4 mb-5 border-b-2 border-slate-100 pb-4">
                            <div>
                                <div class="flex flex-wrap items-center gap-2 mb-2">
                                    <span class="bg-emerald-100 text-emerald-700 font-bold text-[10px] px-2.5 py-1 rounded-lg uppercase flex items-center gap-1"><i class="ph-bold ph-map-trifold"></i> ลุ่มน้ำ ${item.myData0 || '-'}</span>
                                    <span class="bg-slate-100 text-slate-600 font-bold text-[10px] px-2.5 py-1 rounded-lg uppercase border border-slate-200">งวด ${item.myDataPeriod || '-'}</span>
                                </div>
                                <h3 class="text-xl md:text-2xl font-extrabold text-slate-800">${item.myData2 || item.myData1 || 'ไม่ระบุชื่อสถานี'}</h3>
                                <p class="text-sky-500 font-bold text-sm mt-0.5"><i class="ph-bold ph-tag"></i> รหัส: ${item.myData1 || '-'}</p>
                            </div>
                            <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-200 text-right md:text-center w-full md:w-auto">
                                <p class="mb-0 text-slate-400 font-bold text-[10px] uppercase">วันที่บันทึก</p>
                                <p class="mb-0 font-bold text-slate-700 text-sm flex items-center justify-end md:justify-center gap-1"><i class="ph-bold ph-calendar-blank text-slate-400"></i> ${dateStr}</p>
                            </div>
                        </div>
                        
                        <div class="overflow-x-auto mb-5">
                            <table class="table-custom min-w-full">
                                <thead>
                                    <tr><th colspan="4" class="text-center bg-slate-100/50 text-slate-700 text-sm py-3"><i class="ph-bold ph-map-pin text-rose-500 mr-1"></i> ที่ตั้งอาคาร: <span class="font-extrabold text-rose-600 bg-rose-100 px-2 py-0.5 rounded-lg ml-1">${item.myData3 || '-'}</span></th></tr>
                                    <tr><th width="31%" class="text-left"><i class="ph-bold ph-list-bullets mr-1 text-slate-400"></i> หัวข้อ</th><th width="23%">เสาวัด/จำนวนเคาะ</th><th width="23%" class="text-sky-600 bg-sky-50/50">RTU</th><th width="23%" class="text-violet-600 bg-violet-50/50">Website</th></tr>
                                </thead>
                                <tbody>
