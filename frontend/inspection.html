<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรแกรมตรวจสอบอุปกรณ์ในสนามงาน MA</title>
    
    <!-- Google Fonts: Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SweetAlert2 (Dark Theme) -->
    <link href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-dark@4/dark.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Prompt', 'sans-serif'],
                    },
                    colors: {
                        neon: {
                            red: '#FF3333',     
                            darkred: '#8B0000',
                            blue: '#3388FF',
                            green: '#00FF66',
                            bg: '#0f1012',      
                            card: '#1a1c20',    
                            input: '#000000'    
                        }
                    },
                    boxShadow: {
                        'neon-red': '0 0 5px #FF3333, 0 0 10px rgba(255, 51, 51, 0.5)',
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #0f1012; color: #ffffff; font-family: 'Prompt', sans-serif; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f1012; }
        ::-webkit-scrollbar-thumb { background: #FF3333; border-radius: 4px; }

        .input-neon {
            background-color: #000000;
            border: 1px solid #444;
            color: #ffffff;
            transition: all 0.3s ease;
        }
        .input-neon:focus {
            outline: none;
            border-color: #FF3333;
            box-shadow: 0 0 8px rgba(255, 51, 51, 0.6);
        }
        .input-neon:disabled {
            background-color: #1a1c20;
            border-color: #333;
            color: #666;
        }

        .radio-neon-label { cursor: pointer; position: relative; }
        .radio-neon-content {
            background: #1a1c20;
            border: 1px solid #333;
            color: #888;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .radio-neon-label:hover .radio-neon-content { border-color: #666; color: #fff; }

        .radio-none:checked + .radio-neon-content {
            background: #2a2a2a; border-color: #666; color: #ccc;
        }
        .radio-normal:checked + .radio-neon-content {
            background: rgba(0, 255, 102, 0.1); border-color: #00FF66; color: #00FF66;
            font-weight: bold;
        }
        .radio-broken:checked + .radio-neon-content {
            background: rgba(255, 51, 51, 0.1); border-color: #FF3333; color: #FF3333;
            font-weight: bold;
        }

        .btn-neon-submit {
            background: linear-gradient(90deg, #8B0000, #FF3333);
            border: none; color: white; transition: all 0.3s ease;
        }
        .btn-neon-submit:hover { transform: scale(1.02); box-shadow: 0 0 15px #FF3333; }
        .btn-neon-submit:disabled {
            background: #333; color: #666; cursor: not-allowed; box-shadow: none; transform: none;
        }
        
        .glass-header {
            background: rgba(15, 16, 18, 0.95);
            border-bottom: 1px solid #333;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .card-container {
            background-color: #1a1c20;
            border: 1px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        @keyframes blink { 50% { opacity: 0.5; } }
        .animate-blink { animation: blink 1.5s infinite; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="glass-header sticky top-0 z-50 py-4">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <!-- ปุ่มกลับหน้าเมนูหลัก -->
                <a href="index.html" class="w-10 h-10 rounded-lg bg-gray-800 border border-gray-600 flex items-center justify-center hover:bg-gray-700 transition">
                    <i class="fas fa-arrow-left text-white"></i>
                </a>
                <div class="w-12 h-12 rounded-lg bg-black border border-neon-red flex items-center justify-center shadow-neon-red">
                    <i class="fas fa-shield-alt text-neon-red text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl font-bold tracking-wide text-white uppercase">
                        MA <span class="text-neon-red">Inspection</span>
                    </h1>
                </div>
            </div>
            
            <div class="flex flex-col items-end gap-1">
                <div id="gpsStatus" onclick="getLocation()" class="cursor-pointer flex items-center text-xs px-3 py-1 rounded-full border border-gray-600 bg-gray-900 text-yellow-500 animate-blink">
                    <i class="fas fa-satellite-dish mr-2 animate-pulse"></i>
                    <span>กำลังค้นหาพิกัด...</span>
                </div>
                <div class="text-[10px] text-gray-500 font-mono" id="gpsCoords">Lat: -, Lon: -</div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8 max-w-7xl flex-grow">
        <form id="mainform" onsubmit="handleFormSubmit(event, this)" class="space-y-8">
            
            <div class="card-container rounded-lg p-6 relative">
                <div class="flex items-center mb-6 pb-4 border-b border-gray-800">
                    <span class="w-2 h-8 bg-neon-red mr-3 shadow-neon-red"></span>
                    <h2 class="text-xl font-bold text-white uppercase tracking-wider">ข้อมูลการตรวจสอบ</h2>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                    <div class="space-y-2">
                        <label class="text-sm font-semibold text-gray-300">งวดที่ตรวจ</label>
                        <select name="saya" id="saya" required class="w-full p-3 rounded-md input-neon text-white">
                            <option selected disabled value="">-- เลือกงวดที่ตรวจ --</option>
                            <option>งวดที่1</option>
                            <option>งวดที่2</option>
                            <option>งวดที่3</option>
                            <option>งวดที่4</option>
                        </select>
                    </div>
                    <div class="space-y-2">
                        <label class="text-sm font-semibold text-gray-300">กลุ่มลุ่มน้ำ</label>
                        <select name="code" id="code" required class="w-full p-3 rounded-md input-neon text-white">
                            <option selected disabled value="">-- เลือกกลุ่มน้ำ --</option>
                            <option>โขงเหนือ</option>
                            <option>โขงอีสาน</option>
                            <option>ชี</option>
                            <option>มูล</option>
                            <option>ปิง</option>
                            <option>วัง</option>
                            <option>ยม</option>
                            <option>น่าน</option>
                            <option>เจ้าพระยา</option>
                            <option>ป่าสัก</option>
                            <option>สะแกกรัง</option>
                            <option>ท่าจีน</option>
                            <option>แม่กลอง</option>
                            <option>บางปะกง</option>
                            <option>ชายทะเลฝั่งตะวันออก</option>
                            <option>เพชรบุรี-ประจวบคีรีขันธ์</option>
                            <option>ภาคใต้ฝั่งตะวันตก</option>
                            <option>ภาคใต้ฝั่งตะวันออกตอนบน</option>
                            <option>ภาคใต้ฝั่งตะวันออกตอนล่าง</option>
                            <option>ทะเลสาบสงขลา</option>
                            <option>สาละวิน</option>
                            <option>โตนเลสาป</option>
                            <option>KRC</option>
                            <option value="">ไม่มี</option>
                            <option>ไม่ทราบ</option>
                        </select>
                    </div>
                    <div class="space-y-2">
                        <label class="text-sm font-semibold text-gray-300">รหัสสถานี</label>
                        <input list="stationList" type="text" name="id_name" id="id_name" required disabled 
                                placeholder="ค้นหารหัส..." class="w-full p-3 rounded-md input-neon text-white">
                        <datalist id="stationList"></datalist>
                    </div>

                    <div class="space-y-2">
                        <label class="text-sm font-semibold text-gray-300">สถานะจุดติดตั้งอาคาร</label>
                        <select name="install_status" id="install_status" required class="w-full p-3 rounded-md input-neon text-white">
                            <option selected disabled value="">-- เลือกสถานะ --</option>
                            <option value="เหนือน้ำ">เหนือน้ำ</option>
                            <option value="ท้ายน้ำ">ท้ายน้ำ</option>
                            <option value="ปกติ">ปกติ</option>
                        </select>
                    </div>

                    <div class="space-y-2 md:col-span-2 lg:col-span-4">
                        <label class="text-sm font-semibold text-gray-300">ชื่อสถานี</label>
                        <input type="text" name="name_id" id="name_id" readonly 
                            class="w-full p-3 rounded-md bg-black border border-neon-blue text-neon-blue font-bold text-center text-lg">
                    </div>
                </div>
            </div>

            <script>
                function createNeonRadioGroup(label, name, idPrefix, labelNormal = 'ปกติ', labelBroken = 'ชำรุด') {
                    return `
                    <div class="card-container p-5 rounded-lg border-t-2 border-t-gray-700 hover:border-t-neon-red transition-colors duration-300">
                        <span class="block text-sm font-semibold text-gray-300 mb-4">${label}</span>
                        <div class="flex flex-wrap gap-3">
                            <label class="radio-neon-label group">
                                <input type="radio" name="${name}" id="${idPrefix}1" value="" checked class="sr-only radio-none">
                                <div class="radio-neon-content px-5 py-2 min-w-[90px] rounded flex items-center justify-center text-sm font-medium">
                                    <span class="opacity-50 group-hover:opacity-100"><i class="fas fa-minus mr-2"></i> ไม่มี</span>
                                </div>
                            </label>
                            <label class="radio-neon-label group">
                                <input type="radio" name="${name}" id="${idPrefix}2" value="P" class="sr-only radio-normal">
                                <div class="radio-neon-content px-5 py-2 min-w-[90px] rounded flex items-center justify-center text-sm font-medium">
                                    <span class="opacity-80 group-hover:opacity-100"><i class="fas fa-check mr-2"></i> ${labelNormal}</span>
                                </div>
                            </label>
                            <label class="radio-neon-label group">
                                <input type="radio" name="${name}" id="${idPrefix}3" value="O" class="sr-only radio-broken">
                                <div class="radio-neon-content px-5 py-2 min-w-[90px] rounded flex items-center justify-center text-sm font-medium">
                                    <span class="opacity-80 group-hover:opacity-100"><i class="fas fa-times mr-2"></i> ${labelBroken}</span>
                                </div>
                            </label>
                        </div>
                    </div>`;
                }
            </script>

            <div>
                <h2 class="text-lg font-bold mb-4 text-neon-blue uppercase flex items-center"><i class="fas fa-server mr-2"></i> สถานะตรวจสอบทั่วไปและผลสอบเทียบ</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <script>
                        document.write(createNeonRadioGroup('ความสะอาดภายใน/ภายนอกสถานี', 'clean', 'clean', 'ผ่าน', 'ไม่ผ่าน'));
                        document.write(createNeonRadioGroup('สถานะภาพป้ายสถานี', 'pai', 'pai'));
                        document.write(createNeonRadioGroup('ระบบไฟฟ้าภายนอกภายใน', 'power', 'power'));
                        document.write(createNeonRadioGroup('หลอดไฟภายนอก/ภายใน', 'power1', 'power1'));
                        document.write(createNeonRadioGroup('สถานะเว็บไซต์ (Online)', 'online', 'online','ออนไลน์', 'ออฟไลน์' ));
                        document.write(createNeonRadioGroup('ค่าน้ำตรวจครั้งแรก (Water Level)', 'wl', 'wl', 'ถูกต้อง', 'ไม่ถูกต้อง'));
                        document.write(createNeonRadioGroup('ค่าน้ำหลังจากปรับแก้ (Water Level)', 'wl1', 'wl1', 'ถูกต้อง', 'ไม่ถูกต้อง'));
                        document.write(createNeonRadioGroup('ค่าน้ำฝน (Rain)', 'r', 'r', 'ถูกต้อง', 'ไม่ถูกต้อง'));
                    </script>
                </div>
            </div>

            <!-- ===== อุปกรณ์ RTU ===== -->
            <div>
                <h2 class="text-lg font-bold mb-4 text-neon-red uppercase flex items-center"><i class="fas fa-microchip mr-2"></i> อุปกรณ์ RTU</h2>
                <div class="mb-5">
                    <label class="text-sm font-semibold text-gray-300 block mb-2">ประเภท RTU</label>
                    <select id="rtuTypeSelect" onchange="onRtuTypeChange(this.value)" class="w-full md:w-72 p-3 rounded-md input-neon text-white">
                        <option value="">-- เลือกประเภท RTU --</option>
                        <option value="rtu">อุปกรณ์ RTU</option>
                        <option value="plc">อุปกรณ์ RTU PLC</option>
                    </select>
                </div>
                <div id="rtuGroup" class="hidden">
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="rtuFields"></div>
                </div>
                <div id="plcGroup" class="hidden">
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="plcFields"></div>
                </div>
                <div id="modemGroup" class="hidden mt-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="modemFields"></div>
                </div>
            </div>

            <!-- ===== อุปกรณ์ภาคสนาม ===== -->
            <div>
                <h2 class="text-lg font-bold mb-4 text-white uppercase flex items-center"><i class="fas fa-satellite-dish mr-2"></i> อุปกรณ์ภาคสนาม</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-4" id="fieldStaticEquip"></div>

                <div class="mb-5">
                    <label class="text-sm font-semibold text-gray-300 block mb-2">ประเภท Water Level</label>
                    <select id="wlTypeSelect" onchange="onWlTypeChange(this.value)" class="w-full md:w-80 p-3 rounded-md input-neon text-white">
                        <option value="">-- เลือกประเภท Water Level --</option>
                        <option value="bubble">Water Level (bubble)</option>
                        <option value="radar">Water Level (Radar)</option>
                        <option value="float">Water Level (float)</option>
                    </select>
                </div>
                <div id="wlDynamicFields" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
            </div>

            <script>
                // เรนเดอร์อุปกรณ์ภาคสนาม
                (function() {
                    const staticEquip = [
                        { label: 'Power Supply 1', name: 'sta_p1', id: 'p1_' },
                        { label: 'Power Supply 2', name: 'sta_p2', id: 'p2_' },
                        { label: 'CCTV1',          name: 'sta_cctv1', id: 'cctv1' },
                        { label: 'CCTV2',          name: 'sta_cctv2', id: 'cctv2' },
                        { label: 'Rain Gauge',     name: 'sta_r', id: 'rain' },
                        { label: 'Surge Protection', name: 'sta_s', id: 'surge' },
                    ];
                    const container = document.getElementById('fieldStaticEquip');
                    staticEquip.forEach(e => {
                        container.innerHTML += createNeonRadioGroup(e.label, e.name, e.id);
                    });
                })();

                function onRtuTypeChange(val) {
                    const rtuGroup   = document.getElementById('rtuGroup');
                    const plcGroup   = document.getElementById('plcGroup');
                    const modemGroup = document.getElementById('modemGroup');
                    const rtuFields  = document.getElementById('rtuFields');
                    const plcFields  = document.getElementById('plcFields');
                    const modemFields = document.getElementById('modemFields');

                    rtuGroup.classList.add('hidden');
                    plcGroup.classList.add('hidden');
                    modemGroup.classList.add('hidden');
                    document.querySelectorAll('.rtu-hidden-input').forEach(el => el.remove());

                    if (val === 'rtu') {
                        rtuFields.innerHTML = '';
                        ['CPU Status|sta_cpu|cpu','AI Status|sta_ai|ai','DI Status|sta_di|di','DO Status|sta_do|do','IO Status|sta_io|io']
                            .forEach(s => {
                                const [label, name, id] = s.split('|');
                                rtuFields.innerHTML += createNeonRadioGroup(label, name, id);
                            });
                        addHidden('plc', '');
                        rtuGroup.classList.remove('hidden');
                        modemFields.innerHTML = createNeonRadioGroup('Modem 1', 'sta_m1', 'm1_') + createNeonRadioGroup('Modem 2', 'sta_m2', 'm2_');
                        modemGroup.classList.remove('hidden');
                    } else if (val === 'plc') {
                        plcFields.innerHTML = createNeonRadioGroup('RTU PLC', 'plc', 'plc');
                        ['sta_cpu','sta_ai','sta_di','sta_do','sta_io'].forEach(n => addHidden(n, ''));
                        plcGroup.classList.remove('hidden');
                        modemFields.innerHTML = createNeonRadioGroup('Modem 1', 'sta_m1', 'm1_') + createNeonRadioGroup('Modem 2', 'sta_m2', 'm2_');
                        modemGroup.classList.remove('hidden');
                    } else {
                        ['sta_cpu','sta_ai','sta_di','sta_do','sta_io','plc'].forEach(n => addHidden(n, ''));
                    }
                }

                function addHidden(name, value) {
                    const inp = document.createElement('input');
                    inp.type = 'hidden'; inp.name = name; inp.value = value; inp.className = 'rtu-hidden-input';
                    document.getElementById('mainform').appendChild(inp);
                }

                function onWlTypeChange(val) {
                    const container = document.getElementById('wlDynamicFields');
                    container.innerHTML = '';
                    document.querySelectorAll('.wl-hidden-input').forEach(el => el.remove());

                    if (!val) {
                        ['sta_wl','sta_wl1','sta_wl2','sta_tro','sta_saling','sta_gass'].forEach(n => addHiddenWl(n,''));
                        return;
                    }

                    if (val === 'bubble') {
                        container.innerHTML += createNeonRadioGroup('Water Level (bubble)', 'sta_wl', 'wlevel');
                        container.innerHTML += createNeonRadioGroup('ท่อลม', 'sta_tro', 'tro');
                        container.innerHTML += createNeonRadioGroup('ถังแก๊ส', 'sta_gass', 'gass');
                        ['sta_wl1','sta_wl2','sta_saling'].forEach(n => addHiddenWl(n,''));
                    } else if (val === 'radar') {
                        container.innerHTML += createNeonRadioGroup('Water Level (Radar)', 'sta_wl1', 'wlevel1');
                        ['sta_wl','sta_wl2','sta_tro','sta_saling','sta_gass'].forEach(n => addHiddenWl(n,''));
                    } else if (val === 'float') {
                        container.innerHTML += createNeonRadioGroup('Water Level (float)', 'sta_wl2', 'wlevel2');
                        container.innerHTML += createNeonRadioGroup('สายสลิง', 'sta_saling', 'saling');
                        ['sta_wl','sta_wl1','sta_tro','sta_gass'].forEach(n => addHiddenWl(n,''));
                    }
                }

                function addHiddenWl(name, value) {
                    const inp = document.createElement('input');
                    inp.type = 'hidden'; inp.name = name; inp.value = value; inp.className = 'wl-hidden-input';
                    document.getElementById('mainform').appendChild(inp);
                }
            </script>

            <div class="card-container rounded-lg p-6">
                <div class="flex items-center mb-6 pb-4 border-b border-gray-800">
                    <span class="w-2 h-8 bg-neon-blue mr-3 shadow-neon-blue"></span>
                    <h2 class="text-xl font-bold text-white uppercase tracking-wider">บันทึกจำนวนและหมายเหตุ</h2>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-6">
                    <div class="space-y-2">
                        <label class="text-xs text-gray-400 uppercase font-bold">แบตเตอรี่ (ทั้งหมด)</label>
                        <input type="number" name="b1" class="w-full p-3 rounded input-neon text-center text-neon-blue font-bold text-lg" placeholder="0">
                    </div>
                    <div class="space-y-2">
                        <label class="text-xs text-neon-red uppercase font-bold">แบตเตอรี่ (ชำรุด)</label>
                        <input type="number" name="b2" class="w-full p-3 rounded input-neon text-center text-neon-red font-bold text-lg" placeholder="0">
                    </div>
                    <div class="space-y-2">
                        <label class="text-xs text-gray-400 uppercase font-bold">แผ่นวัดน้ำ แบบบวก (ชำรุด)</label>
                        <input type="number" name="sta1" class="w-full p-3 rounded input-neon text-center text-neon-blue font-bold text-lg" placeholder="0">
                    </div>
                    <div class="space-y-2">
                        <label class="text-xs text-neon-red uppercase font-bold">แผ่นวัดน้ำ แบบลบ (ชำรุด)</label>
                        <input type="number" name="sta2" class="w-full p-3 rounded input-neon text-center text-neon-red font-bold text-lg" placeholder="0">
                    </div>
                    <div class="space-y-2">
                        <label class="text-xs text-gray-400 uppercase font-bold">เสาวัดน้ำ (ทั้งหมดที่เห็น)</label>
                        <input type="number" name="pole1" class="w-full p-3 rounded input-neon text-center text-neon-blue font-bold text-lg" placeholder="0">
                    </div>
                    <div class="space-y-2">
                        <label class="text-xs text-neon-red uppercase font-bold">เสาวัดน้ำ (ชำรุด)</label>
                        <input type="number" name="pole2" class="w-full p-3 rounded input-neon text-center text-neon-red font-bold text-lg" placeholder="0">
                    </div>
                </div>

                <!-- เพิ่มช่องอัปโหลดรูปภาพสภาพสนาม -->
                <div class="space-y-2 mb-6 border-t border-gray-800 pt-6">
                    <label class="text-sm font-semibold text-neon-gold flex items-center">
                        <i class="fas fa-camera mr-2"></i> ถ่ายรูป/แนบรูปภาพสภาพสถานี (ทางเลือก)
                    </label>

        const basinSelect = document.getElementById("code");
        const stationInput = document.getElementById("id_name");
        const stationList = document.getElementById("stationList");
        const stationNameInput = document.getElementById("name_id");

        basinSelect.addEventListener("change", () => {
            const selectedBasin = basinSelect.value.trim();
            stationInput.value = "";
            stationNameInput.value = "";
            stationList.innerHTML = "";
            if (data[selectedBasin]) {
                stationInput.disabled = false;
                for (let code in data[selectedBasin]) {
                    const opt = document.createElement("option");
                    opt.value = code;
                    stationList.appendChild(opt);
                }
            } else {
                stationInput.disabled = true;
            }
        });

        stationInput.addEventListener("input", () => {
            const selectedBasin = basinSelect.value.trim();
            const code = stationInput.value.trim();
            if (data[selectedBasin] && data[selectedBasin][code]) {
                stationNameInput.value = data[selectedBasin][code];
            } else {
                stationNameInput.value = "";
            }
        });

        // ฟังก์ชันอัพเดท UI ของ GPS
        function updateGPSUI(status) {
            if (status === 'searching') {
                gpsStatus.className = "cursor-pointer flex items-center text-xs px-3 py-1 rounded-full border border-gray-600 bg-gray-900 text-yellow-500 animate-blink";
                gpsStatus.innerHTML = '<i class="fas fa-satellite-dish mr-2"></i><span>กำลังค้นหา...</span>';
                btnSubmit.disabled = true;
                btnText.innerText = "รอพิกัด GPS...";
                gpsCoords.innerText = "Lat: -, Lon: -";
            } else if (status === 'success') {
                gpsStatus.className = "cursor-pointer flex items-center text-xs px-3 py-1 rounded-full border border-green-600 bg-green-900/30 text-green-400";
                gpsStatus.innerHTML = '<i class="fas fa-check-circle mr-2"></i><span>จับพิกัดได้แล้ว</span>';
                gpsStatus.classList.remove('animate-blink');
                gpsCoords.innerText = `Lat: ${lat.toFixed(5)}, Lon: ${lon.toFixed(5)}`;
                
                btnSubmit.disabled = false;
                btnText.innerText = "ยืนยันข้อมูล";
            } else if (status === 'error') {
                gpsStatus.className = "cursor-pointer flex items-center text-xs px-3 py-1 rounded-full border border-red-600 bg-red-900/30 text-red-400";
                gpsStatus.innerHTML = '<i class="fas fa-exclamation-triangle mr-2"></i><span>ไม่พบพิกัด (กดใหม่)</span>';
                gpsStatus.classList.remove('animate-blink');
                btnSubmit.disabled = true;
                btnText.innerText = "กรุณาเปิด GPS";
            }
        }

        function getLocation() {
            updateGPSUI('searching');
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (p) => { 
                        lat = p.coords.latitude; 
                        lon = p.coords.longitude; 
                        updateGPSUI('success');
                        if (typeof Swal !== 'undefined') {
                            Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'จับสัญญาณ GPS สำเร็จ', showConfirmButton: false, timer: 3000, background: '#1a1c20', color: '#fff' });
                        }
                    },
                    (e) => { 
                        console.warn("Geo Error: " + e.message);
                        updateGPSUI('error');
                        if (typeof Swal !== 'undefined') {
                            Swal.fire({ icon: 'error', title: 'ไม่พบสัญญาณ GPS', text: 'กรุณาเปิด GPS และกดอนุญาต', background: '#1a1c20', color: '#fff' });
                        } else { alert('ไม่พบสัญญาณ GPS'); }
                    },
                    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
                );
            } else {
                updateGPSUI('error');
                alert('Browser ไม่รองรับ GPS');
            }
        }

        window.addEventListener('load', function() {
            getLocation();
        });

        // ปรับปรุงฟังก์ชันส่งฟอร์ม ให้รองรับการส่งไฟล์ภาพด้วย FormData
        async function handleFormSubmit(event, form) {
            event.preventDefault();
            
            if (lat === null || lon === null) {
                if (typeof Swal !== 'undefined') {
                    Swal.fire({ icon: 'warning', title: 'ไม่พบพิกัด GPS', text: 'กรุณารอ GPS สักครู่', background: '#1a1c20', color: '#fff' });
                } else { alert('รอ GPS'); }
                getLocation();
                return;
            }

            // ใช้ FormData ดึงข้อมูลทั้งหมดในฟอร์ม (รวมถึงไฟล์)
            const formData = new FormData(form);
            formData.append('lat', lat);
            formData.append('lon', lon);

            if (typeof Swal !== 'undefined') {
                Swal.fire({
                    title: 'กำลังส่งข้อมูล...', text: 'กำลังบันทึกข้อมูลและอัปโหลดรูปภาพ กรุณารอสักครู่', allowOutsideClick: false,
                    background: '#1a1c20', color: '#fff',
                    didOpen: () => Swal.showLoading()
                });
            }

            try {
                // *** หมายเหตุ: หากขึ้นระบบจริง ต้องเปลี่ยน URL นี้เป็นโดเมนหรือ IP ของ Backend ของคุณ ***
                const API_URL = '/api/inspections';
                
                const response = await fetch(API_URL, {
                    method: 'POST',
                    // ไม่ต้องตั้ง Content-Type ระบบ fetch จะจัดการ Boundary ของไฟล์ (multipart/form-data) ให้เอง
                    body: formData
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    document.getElementById("mainform").reset();
                    // รีเซ็ตการแสดงผลช่องที่ถูกซ่อนไป
                    document.getElementById('rtuGroup').classList.add('hidden');
                    document.getElementById('plcGroup').classList.add('hidden');
                    document.getElementById('modemGroup').classList.add('hidden');
                    document.getElementById('wlDynamicFields').innerHTML = '';
                    
                    if (typeof Swal !== 'undefined') {
                        Swal.fire({ position: 'center', icon: 'success', title: 'บันทึกข้อมูลสำเร็จ', showConfirmButton: false, timer: 2000, background: '#1a1c20', color: '#fff' });
                    } else { alert('สำเร็จ'); }
                } else {
                    throw new Error(result.message || 'การตอบกลับจากเซิร์ฟเวอร์ผิดพลาด');
                }
                
            } catch (error) {
                console.error('Submit Error:', error);
                if (typeof Swal !== 'undefined') {
                    Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: error.message, background: '#1a1c20', color: '#fff' });
                } else { alert('Error: ' + error.message); }
            }
        }
    </script>
