<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบสรุปอุปกรณ์ชำรุด</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- นำเข้า Constants -->
  <script src="constants.js"></script>

  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Prompt', 'sans-serif'] } } } }
  </script>
  <style>
    body { font-family: 'Prompt', sans-serif; -webkit-overflow-scrolling: touch; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(30, 41, 59, 0.5); border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(71, 85, 105, 0.8); border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen bg-slate-900 text-slate-100 font-sans selection:bg-emerald-500/30">

  <header class="sticky top-0 z-10 bg-slate-900/80 backdrop-blur-xl border-b border-slate-700/50 shadow-lg">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div class="flex items-center gap-4">
          <a href="index.html" class="w-10 h-10 rounded-lg bg-slate-800 border border-slate-600 flex items-center justify-center hover:bg-slate-700 transition shrink-0"><i class="fas fa-arrow-left text-white"></i></a>
          <div class="p-2.5 bg-rose-500/10 rounded-xl border border-rose-500/20"><i class="fas fa-triangle-exclamation text-rose-500 text-xl"></i></div>
          <div><h1 class="text-xl md:text-2xl font-bold text-white">ระบบสรุปอุปกรณ์ชำรุด</h1><p class="text-xs text-slate-400">วิเคราะห์ข้อมูลการตรวจงาน MA อัตโนมัติ</p></div>
        </div>
        <div class="flex flex-wrap items-center gap-3">
          <div class="relative group w-full md:w-auto"><div class="absolute inset-y-0 left-0 flex items-center pl-3"><i class="fas fa-calendar-alt text-slate-400"></i></div>
            <select id="period-filter" onchange="renderData()" disabled class="bg-slate-800 border border-slate-700 text-slate-200 text-sm rounded-lg pl-10 pr-8 py-2.5 w-full">
              <option value="All">ทุกงวดการตรวจ (ทั้งหมด)</option><option value="งวดที่1">งวดที่ 1</option><option value="งวดที่2">งวดที่ 2</option><option value="งวดที่3">งวดที่ 3</option><option value="งวดที่4">งวดที่ 4</option>
            </select>
          </div>
          <div class="relative group w-full md:w-auto"><div class="absolute inset-y-0 left-0 flex items-center pl-3"><i class="fas fa-water text-slate-400"></i></div>
            <select id="basin-filter" onchange="renderData()" disabled class="bg-slate-800 border border-slate-700 text-slate-200 text-sm rounded-lg pl-10 pr-8 py-2.5 w-full"><option value="All">กำลังเตรียมข้อมูล...</option></select>
          </div>
          <button id="refresh-btn" onclick="fetchDataFromServer()" disabled class="p-2.5 bg-slate-800 border border-slate-700 rounded-lg text-slate-300 w-full md:w-auto"><i id="refresh-icon" class="fas fa-sync-alt"></i></button>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8" id="content-area">
    <div class="flex flex-col items-center justify-center py-24 space-y-5">
      <div class="w-14 h-14 border-4 border-slate-700 border-t-emerald-500 rounded-full animate-spin"></div>
      <p class="text-emerald-400 font-medium animate-pulse">กำลังโหลดข้อมูลระบบ...</p>
    </div>
  </main>

  <script>
    let globalAppData = [];

    function showError(errorMessage) {
      document.getElementById('content-area').innerHTML = `<div class="bg-rose-500/10 border border-rose-500/30 rounded-2xl p-6 flex items-start gap-4 max-w-3xl mx-auto mt-8"><i class="fas fa-exclamation-circle text-rose-500 text-3xl mt-1"></i><div><h3 class="text-lg font-semibold text-rose-400 mb-2">เกิดข้อผิดพลาด</h3><p class="text-slate-300">${errorMessage}</p></div></div>`;
      toggleControls(true); document.getElementById('refresh-icon').classList.remove('fa-spin');
    }

    function toggleControls(enable) {
      document.getElementById('period-filter').disabled = !enable; document.getElementById('basin-filter').disabled = !enable; document.getElementById('refresh-btn').disabled = !enable;
    }

    function setupBasinDropdown() {
      const basinSelect = document.getElementById('basin-filter');
      basinSelect.innerHTML = '<option value="All">ทุกลุ่มน้ำ (ทั้งหมด)</option>';
      hardcodedBasins.forEach(basin => basinSelect.innerHTML += `<option value="${basin}">ลุ่มน้ำ ${basin}</option>`);
    }

    async function fetchDataFromServer() {
      toggleControls(false); document.getElementById('refresh-icon').classList.add('fa-spin');
      try {
        const response = await fetch('/api/inspections');
        const result = await response.json();
        if (response.ok && result.success) {
            globalAppData = result.data; setupBasinDropdown(); toggleControls(true); renderData();
        } else throw new Error(result.message);
      } catch (err) { showError(err.message); }
    }

    function renderData() {
      if (!globalAppData) return;
      document.getElementById('refresh-icon').classList.remove('fa-spin');
      const selectedBasin = document.getElementById('basin-filter').value;
      const selectedPeriod = document.getElementById('period-filter').value;

      let filteredRows = globalAppData.filter(row => {
        if (selectedBasin !== 'All' && row.code !== selectedBasin) return false;
        if (selectedPeriod !== 'All' && row.saya !== selectedPeriod) return false;
        return true;
      });

      const summaryMap = {};
      filteredRows.forEach(row => {
        const stationName = row.name_id || row.id_name || 'ไม่ทราบสถานี';
        Object.keys(equipmentMap).forEach(key => {
            const eqTitle = equipmentMap[key];
            let val = row[key]; let addCount = 0;
            if (typeof val === 'string' && val.trim().toUpperCase() === "O") addCount = 1;
            else if (['b2', 'sta2', 'pole2'].includes(key)) { let n = Number(val); if (!isNaN(n) && n > 0) addCount = n; }
            if (addCount > 0) {
                if (!summaryMap[eqTitle]) summaryMap[eqTitle] = { name: eqTitle, count: 0, stationsMap: new Map() };
                summaryMap[eqTitle].count += addCount;
                summaryMap[eqTitle].stationsMap.set(stationName, (summaryMap[eqTitle].stationsMap.get(stationName) || 0) + addCount);
            }
        });
      });

      const finalData = Object.values(summaryMap).map(item => {
          let stArr = []; item.stationsMap.forEach((c, n) => stArr.push({ name: n, count: c }));
          return { ...item, stations: stArr };
      }).sort((a, b) => b.count - a.count);

      const content = document.getElementById('content-area');
      if (finalData.length === 0) {
        content.innerHTML = `<div class="bg-emerald-500/10 border border-emerald-500/20 rounded-3xl p-12 text-center max-w-2xl mx-auto mt-10"><i class="fas fa-check-circle text-5xl text-emerald-400 mb-6"></i><h2 class="text-2xl font-bold text-white mb-3">สถานการณ์ปกติ</h2><p class="text-slate-400">ไม่พบรายงานอุปกรณ์ชำรุด</p></div>`; return;
      }

      let cardsHtml = '';
      finalData.forEach(item => {
        let stationBadges = '';
        item.stations.forEach(st => {
          // ✅ XSS Protection สำหรับชื่อสถานี
          const safeName = escapeHtml(st.name);
          if (st.count > 1) stationBadges += `<span class="px-2.5 py-1.5 text-xs font-medium bg-slate-900 border border-slate-700 text-slate-300 rounded-md inline-flex items-center gap-1">${safeName} <span class="text-rose-500 font-bold">(${st.count})</span></span>`;
          else stationBadges += `<span class="px-2.5 py-1.5 text-xs font-medium bg-slate-900 border border-slate-700 text-slate-300 rounded-md">${safeName}</span>`;
        });
        cardsHtml += `<div class="bg-slate-800/40 border border-slate-700/60 rounded-2xl p-6 shadow-lg"><div class="flex items-start justify-between mb-4"><h3 class="text-lg font-bold text-white pr-4">${item.name}</h3><div class="flex flex-col items-end"><span class="text-3xl font-black text-rose-500">${item.count}</span><span class="text-xs text-rose-500/80 mt-1">รายการ</span></div></div><div class="pt-4 border-t border-slate-700/50"><p class="text-xs text-slate-400 mb-3"><i class="fas fa-map-marker-alt"></i> สถานีที่มีปัญหา:</p><div class="flex flex-wrap gap-2 max-h-32 overflow-y-auto custom-scrollbar">${stationBadges}</div></div></div>`;
      });
      content.innerHTML = `<div class="space-y-6"><div class="flex items-center justify-between mb-2"><h2 class="text-xl font-semibold text-white">รายการอุปกรณ์ที่พบปัญหา</h2></div><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">${cardsHtml}</div></div>`;
    }
    window.addEventListener('load', fetchDataFromServer);
  </script>
</body>
</html>
