<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรแกรมตรวจรับงานตาม TOR</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- SweetAlert2 (Light Theme) -->
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>
    
    <!-- นำเข้าข้อมูลส่วนกลาง -->
    <script src="constants.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] }
                }
            }
        }
    </script>

    <style>
        body {
            /* พื้นหลังสีเหลืองพาสเทลอ่อนๆ มีจุดไข่ปลา */
            background-color: #fffbeb; 
            color: #334155;
            background-image: radial-gradient(#fde047 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }

        /* 3D Container Card */
        .puffy-container {
            background-color: #ffffff;
            border-radius: 24px;
            border: 4px solid #f8fafc;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.01);
        }

        /* 3D Input Fields */
        .puffy-input {
            background-color: #f8fafc;
            border: 2px solid #e2e8f0;
            color: #334155;
            transition: all 0.2s ease;
            font-weight: 500;
        }
        .puffy-input:focus {
            outline: none;
            border-color: #38bdf8;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.2);
        }
        .puffy-input:disabled {
            background-color: #f1f5f9;
            color: #94a3b8;
            cursor: not-allowed;
        }

        /* 3D Buttons */
        .btn-puffy-blue {
            background-color: #38bdf8;
            color: white;
            border-radius: 16px;
            box-shadow: 0 6px 0 #0284c7;
            transition: all 0.1s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-puffy-blue:active:not(:disabled) { transform: translateY(6px); box-shadow: 0 0px 0 #0284c7; }
        .btn-puffy-blue:disabled { background-color: #94a3b8; box-shadow: 0 6px 0 #64748b; cursor: not-allowed; opacity: 0.7; }

        .btn-puffy-pink {
            background-color: #f472b6;
            color: white;
            border-radius: 16px;
            box-shadow: 0 6px 0 #be185d;
            transition: all 0.1s ease;
        }
        .btn-puffy-pink:active:not(:disabled) { transform: translateY(6px); box-shadow: 0 0px 0 #be185d; }
        .btn-puffy-pink:disabled { background-color: #cbd5e1; box-shadow: 0 6px 0 #94a3b8; cursor: not-allowed; }

        /* 3D Radio Buttons (สำหรับ ผ่าน/ไม่ผ่าน/ยังไม่ทำ) */
        .btn-status-radio {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid transparent;
        }
        
        /* State: ผ่าน */
        .status-radio:checked + .btn-pass {
            background-color: #34d399 !important; /* Emerald 400 */
            color: white !important;
            border-color: #059669 !important;
            box-shadow: inset 0 -4px 0 rgba(0,0,0,0.15);
            transform: scale(1.05);
        }
        
        /* State: ไม่ผ่าน */
        .status-radio:checked + .btn-fail {
            background-color: #f87171 !important; /* Red 400 */
            color: white !important;
            border-color: #dc2626 !important;
            box-shadow: inset 0 -4px 0 rgba(0,0,0,0.15);
            transform: scale(1.05);
        }
        
        /* State: ยังไม่ทำ */
        .status-radio:checked + .btn-pending {
            background-color: #94a3b8 !important; /* Slate 400 */
            color: white !important;
            border-color: #475569 !important;
            box-shadow: inset 0 -4px 0 rgba(0,0,0,0.15);
            transform: scale(1.05);
        }

        /* Task Card ภายใน */
        .task-card {
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .task-card:hover { border-color: #cbd5e1; box-shadow: 0 8px 15px -3px rgba(0, 0, 0, 0.08); }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">
    
    <!-- Header -->
    <header class="bg-white/80 backdrop-blur-md border-b-4 border-slate-100 sticky top-0 z-50 py-3 shadow-sm">
        <div class="container mx-auto px-4 flex justify-between items-center max-w-5xl">
            <div class="flex items-center space-x-4">
                <!-- ปุ่ม Back 3D -->
                <a href="index.html" class="w-12 h-12 rounded-2xl bg-white border-2 border-slate-200 flex items-center justify-center text-slate-500 hover:text-pink-500 hover:border-pink-200 transition-all shadow-sm active:translate-y-1">
                    <i class="ph-bold ph-caret-left text-2xl"></i>
                </a>
                <div>
                    <h1 class="text-xl md:text-2xl font-extrabold text-slate-800 flex items-center gap-2">
                        <i class="ph-fill ph-seal-check text-pink-500 text-3xl"></i>
                        ตรวจรับงานตาม <span class="text-pink-500">TOR</span>
                    </h1>
                </div>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8 max-w-4xl flex-grow">
        <form id="torForm" onsubmit="submitTorData(event)" class="space-y-8">
            
            <!-- ส่วนค้นหาข้อมูลสถานี -->
            <div class="puffy-container p-6 md:p-8">
                <h2 class="text-xl font-bold text-slate-800 mb-5 flex items-center gap-2 border-b-2 border-slate-100 pb-3">
                    <i class="ph-fill ph-magnifying-glass text-sky-500"></i> ค้นหาข้อมูลสถานี 
                    <span class="text-sm font-semibold bg-sky-100 text-sky-600 px-3 py-1 rounded-full ml-2">เชื่อมโยง MAM</span>
                </h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-6">
                    <div>
                        <label class="text-sm font-bold text-slate-600 block mb-1">ปีงบประมาณ <span class="text-pink-500">*</span></label>
                        <select id="contractYearSelect" required class="w-full p-3 rounded-xl puffy-input">
                        </select>
                    </div>
                    <div>
                        <label class="text-sm font-bold text-slate-600 block mb-1">งวดที่ส่งมอบ <span class="text-pink-500">*</span></label>
                        <select id="periodSelect" required class="w-full p-3 rounded-xl puffy-input">
                            <option value="งวดที่1">งวดที่ 1</option>
                            <option value="งวดที่2">งวดที่ 2</option>
                            <option value="งวดที่3">งวดที่ 3</option>
                            <option value="งวดที่4">งวดที่ 4</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-sm font-bold text-slate-600 block mb-1">กลุ่มลุ่มน้ำ <span class="text-pink-500">*</span></label>
                        <select id="basinSelect" required class="w-full p-3 rounded-xl puffy-input">
                            <option value="" disabled selected>-- เลือกกลุ่มลุ่มน้ำ --</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-sm font-bold text-slate-600 block mb-1">รหัสสถานี <span class="text-pink-500">*</span></label>
                        <select id="stationSelect" required disabled class="w-full p-3 rounded-xl puffy-input">
                            <option value="" disabled selected>-- เลือกรหัสสถานี --</option>
                        </select>
                    </div>
                    <div class="md:col-span-2">
                        <label class="text-sm font-bold text-slate-600 block mb-1">ชื่อสถานี</label>
                        <input type="text" id="stationNameInput" readonly placeholder="จะแสดงอัตโนมัติเมื่อเลือกสถานี" 
                               class="w-full p-3 rounded-xl bg-slate-100 border-2 border-slate-200 text-sky-600 font-extrabold text-center focus:outline-none">
                    </div>
                </div>

                <button type="button" id="btnFetchMam" onclick="fetchStationWorkData()" disabled 
                        class="btn-puffy-blue w-full font-bold py-4 text-lg flex items-center justify-center gap-2 mb-2">
                    <i class="ph-bold ph-cloud-arrow-down text-2xl"></i> ดึงข้อมูลจากระบบ MAM
                </button>
            </div>

            <!-- ส่วนแสดงรายการตรวจรับ -->
            <div class="puffy-container p-6 md:p-8 min-h-[250px]">
                <h2 class="text-xl font-bold text-slate-800 mb-5 flex items-center gap-2 border-b-2 border-slate-100 pb-3">
                    <i class="ph-fill ph-list-checks text-emerald-500"></i> ประเมินผลการปฏิบัติงานตาม TOR
                </h2>
                
                <div id="tasksContainer">
                    <div class="py-16 flex flex-col items-center justify-center text-slate-400 bg-slate-50 rounded-2xl border-2 border-dashed border-slate-200">
                        <div class="w-20 h-20 bg-white rounded-full flex items-center justify-center shadow-sm mb-4">
                            <i class="ph-fill ph-clipboard-text text-5xl text-slate-300"></i>
                        </div>
                        <p class="font-bold text-slate-500">กรุณาเลือกรหัสสถานีและกดดึงข้อมูลก่อน</p>
                    </div>
                </div>
            </div>

            <!-- ปุ่มบันทึก -->
            <div class="pb-10 pt-2">
                <button type="submit" id="btnSubmit" disabled 
                        class="btn-puffy-pink w-full py-5 font-extrabold text-xl flex items-center justify-center gap-2">
                    <i class="ph-bold ph-floppy-disk text-2xl"></i> บันทึกผลการตรวจรับ
                </button>
            </div>

        </form>
    </main>

    <script>
        // --- อ้างอิง Element ---
        const basinSelect = document.getElementById("basinSelect");
        const stationSelect = document.getElementById("stationSelect");
        const stationNameInput = document.getElementById("stationNameInput");
        const contractYearSelect = document.getElementById("contractYearSelect");
        const periodSelect = document.getElementById("periodSelect");
        const btnFetchMam = document.getElementById("btnFetchMam");
        const btnSubmit = document.getElementById("btnSubmit");
        const tasksContainer = document.getElementById("tasksContainer");

        // --- ตั้งค่า Dropdown ปีงบประมาณ ---
        const startYear = 2568;
        const totalYears = 10;
        const currentDate = new Date();
        
        let currentThaiFiscalYear = currentDate.getFullYear() + 543;
        if (currentDate.getMonth() >= 9) { 
            currentThaiFiscalYear += 1;
        }

        for (let i = 0; i <= totalYears; i++) {
            const year = startYear + i;
            const opt = document.createElement("option");
            opt.value = year;
            opt.textContent = year;
            contractYearSelect.appendChild(opt);
        }

        if (currentThaiFiscalYear >= startYear && currentThaiFiscalYear <= startYear + totalYears) {
            contractYearSelect.value = currentThaiFiscalYear;
        } else {
            contractYearSelect.value = currentThaiFiscalYear > startYear + totalYears ? startYear + totalYears : startYear;
        }

        // --- ตั้งค่า Dropdown ลุ่มน้ำ ---
        if (typeof hardcodedBasins !== 'undefined') {
            hardcodedBasins.forEach(b => {
                const opt = document.createElement("option");
                opt.value = b;
                opt.textContent = b;
                basinSelect.appendChild(opt);
            });
        }

        basinSelect.addEventListener("change", () => {
            const selectedBasin = basinSelect.value;
            stationSelect.innerHTML = '<option value="" disabled selected>-- เลือกรหัสสถานี --</option>';
            stationNameInput.value = "";
            btnFetchMam.disabled = true;
            btnSubmit.disabled = true;
            resetTasksContainer();

            if (stationsData[selectedBasin]) {
                stationSelect.disabled = false;
                for (let code in stationsData[selectedBasin]) {
                    const opt = document.createElement("option");
                    opt.value = code;
                    opt.textContent = code;
                    stationSelect.appendChild(opt);
                }
            } else {
                stationSelect.disabled = true;
            }
        });

        stationSelect.addEventListener("change", () => {
            const selectedBasin = basinSelect.value;
            const code = stationSelect.value;
            if (stationsData[selectedBasin] && stationsData[selectedBasin][code]) {
                stationNameInput.value = stationsData[selectedBasin][code];
                btnFetchMam.disabled = false;
            } else {
                stationNameInput.value = "";
                btnFetchMam.disabled = true;
            }
        });

        function resetTasksContainer() {
            tasksContainer.innerHTML = `
                <div class="py-16 flex flex-col items-center justify-center text-slate-400 bg-slate-50 rounded-2xl border-2 border-dashed border-slate-200">
                    <div class="w-20 h-20 bg-white rounded-full flex items-center justify-center shadow-sm mb-4">
                        <i class="ph-fill ph-clipboard-text text-5xl text-slate-300"></i>
                    </div>
                    <p class="font-bold text-slate-500">กรุณาเลือกรหัสสถานีและกดดึงข้อมูลก่อน</p>
                </div>`;
        }

        // --- ลอจิกดึงข้อมูล MAM ---
        async function fetchStationWorkData() {
            const year = contractYearSelect.value;
            const period = periodSelect.value; 
            const basin = basinSelect.value;
            const stationId = stationSelect.value;

            if (!stationId) return;

            btnFetchMam.disabled = true;
            btnSubmit.disabled = true;

            btnFetchMam.innerHTML = '<i class="ph-bold ph-spinner animate-spin text-2xl"></i> กำลังตรวจสอบข้อมูล...';
            tasksContainer.innerHTML = `
                <div class="py-16 flex flex-col items-center justify-center text-sky-500 bg-sky-50 rounded-2xl border-2 border-sky-100">
                    <i class="ph-bold ph-spinner animate-spin text-5xl mb-4"></i>
                    <p class="font-bold">กำลังตรวจสอบผลงานของ ${stationId}...</p>
                </div>`;

            try {
                const response = await fetch(`https://ma-inspection-project.onrender.com/api/inspections?t=${new Date().getTime()}`);
                const result = await response.json();
                
                if(response.ok && result.success) {
                    const stationData = result.data.find(d => d.saya === period && d.id_name === stationId);

                    if (stationData) {
                        renderDynamicInspectionTasks(period, stationData);
                        btnFetchMam.innerHTML = '<i class="ph-bold ph-check-circle text-2xl"></i> ดึงข้อมูลสำเร็จ';
                        setTimeout(() => { 
                            btnFetchMam.innerHTML = '<i class="ph-bold ph-arrows-clockwise text-2xl"></i> ดึงข้อมูลล่าสุด'; 
                            btnFetchMam.disabled = false;
                        }, 2000);
                        btnSubmit.disabled = false; 
                    } else {
                        throw new Error(`ไม่พบข้อมูลการบันทึกของสถานี ${stationId} ใน ${period}`);
                    }
                } else {
                    throw new Error(result.message || "ไม่สามารถติดต่อฐานข้อมูลได้");
                }
            } catch (error) {
                console.error(error);
                tasksContainer.innerHTML = `
                    <div class="p-8 text-center bg-rose-50 rounded-2xl border-2 border-rose-200">
                        <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center shadow-sm mx-auto mb-3">
                            <i class="ph-fill ph-warning-circle text-4xl text-rose-500"></i>
                        </div>
                        <p class="font-bold text-rose-600 text-lg">${error.message}</p>
                        <p class="text-sm mt-2 text-rose-400 font-medium">ผู้รับจ้างอาจจะยังไม่ได้ส่งข้อมูลเข้าระบบ</p>
                    </div>`;
                btnFetchMam.innerHTML = '<i class="ph-bold ph-arrows-clockwise text-2xl"></i> ลองดึงข้อมูลใหม่';
                btnFetchMam.disabled = false;
            }
        }

        // --- Render UI ---
        function renderDynamicInspectionTasks(period, mamData) {
            let htmlContent = "";

            // หมวดหมู่ 1
            htmlContent += `
                <div class="flex items-center gap-2 mb-4 mt-2">
                    <div class="w-8 h-8 rounded-full bg-pink-100 flex items-center justify-center text-pink-500"><i class="ph-bold ph-wrench"></i></div>
                    <h3 class="text-slate-800 font-extrabold text-lg">งานบำรุงรักษาทั่วไป</h3>
                </div>`;
            htmlContent += createTaskCard("1", "การทำความสะอาด กำจัดวัชพืชและแมลง", { status: mamData.clean });
            htmlContent += createTaskCard("2", "การตรวจสอบป้ายสถานีสนาม", { status: mamData.pai });
            htmlContent += createTaskCard("3", "การตรวจสอบระบบไฟฟ้า", { status: mamData.power });

            // หมวดหมู่ 2
            if (mamData.extra_work_tor4 && mamData.extra_work_tor4.length > 0) {
                htmlContent += `
                    <div class="flex items-center gap-2 mb-4 mt-8">
                        <div class="w-8 h-8 rounded-full bg-sky-100 flex items-center justify-center text-sky-500"><i class="ph-bold ph-star"></i></div>
                        <h3 class="text-slate-800 font-extrabold text-lg">งานพิเศษ (ข้อมูลจาก MAM)</h3>
                    </div>`;
                
                mamData.extra_work_tor4.forEach((task, index) => {
                    const id = `4.${index+1}`;
                    const amountContext = {
                        amount: task.quantity,
                        unit: task.unit,
                        desc: task.description
                    };
                    htmlContent += createTaskCard(id, task.name, amountContext);
                });
            }

            // แจ้งเตือน
            if (mamData.note) {
                htmlContent = `
                <div class="mb-6 bg-sky-50 border-2 border-sky-200 rounded-2xl p-4 text-sky-800 flex items-start gap-3">
                    <i class="ph-fill ph-info text-sky-500 text-2xl shrink-0 mt-0.5"></i>
                    <div>
                        <strong class="block font-bold mb-1">หมายเหตุจากผู้รับจ้าง:</strong> 
                        <span class="text-sm font-medium">${mamData.note}</span>
                    </div>
                </div>
                ` + htmlContent;
            }

            tasksContainer.innerHTML = htmlContent;
        }

        function createTaskCard(id, name, mamContext) {
            let mamInfoHtml = "";
            if (mamContext) {
                let infoText = "";
                if (mamContext.status) {
                    const statusName = mamContext.status === "P" ? "ผ่านเกณฑ์/ปกติ" : (mamContext.status === "O" ? "ชำรุด/มีปัญหา" : mamContext.status);
                    const statusBg = mamContext.status === "P" ? "bg-emerald-100 text-emerald-700 border-emerald-200" : (mamContext.status === "O" ? "bg-rose-100 text-rose-700 border-rose-200" : "bg-slate-100 text-slate-700 border-slate-200");
                    const statusIcon = mamContext.status === "P" ? "ph-check-circle" : (mamContext.status === "O" ? "ph-x-circle" : "ph-minus-circle");
                    
                    infoText = `<div class="${statusBg} border-2 font-bold px-3 py-1 rounded-xl text-sm flex items-center gap-1.5 inline-flex"><i class="ph-fill ${statusIcon} text-lg"></i> ${statusName}</div>`;
                } else if (mamContext.amount !== undefined) {
                    infoText = `<div class="bg-sky-100 text-sky-700 border-2 border-sky-200 font-bold px-3 py-1 rounded-xl text-sm inline-flex">ปริมาณ: ${mamContext.amount} ${mamContext.unit}</div>`;
                    if(mamContext.desc) infoText += ` <span class="ml-2 text-slate-500 text-xs font-medium bg-slate-100 px-2 py-1 rounded-lg">(${mamContext.desc})</span>`;
                }

                mamInfoHtml = `
                <div class="mt-3 mb-4 bg-slate-50 rounded-xl p-3 text-sm border-2 border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <span class="text-slate-500 font-bold flex items-center gap-1.5"><i class="ph-fill ph-device-mobile text-lg"></i> ข้อมูลจากสนาม:</span>
                    <div>${infoText}</div>
                </div>`;
            }

            return `
            <div class="task-card p-5 mb-5 transition-all">
                <p class="text-base font-extrabold text-slate-700 mb-2 break-words flex items-start gap-2">
                    <span class="bg-slate-200 text-slate-600 px-2 py-0.5 rounded-lg text-sm">${id}</span> ${name}
                </p>
                ${mamInfoHtml}
                
                <input type="hidden" name="taskId[]" value="${id}">
                <input type="hidden" name="taskName[]" value="${name}">
                
                <!-- 3D Radio Buttons -->
                <div class="grid grid-cols-3 gap-3 mt-2">
                    <label class="cursor-pointer group">
                        <input type="radio" name="status_${id}" value="ผ่าน" class="sr-only status-radio">
                        <div class="btn-pass btn-status-radio bg-emerald-50 text-emerald-600 border-emerald-200 py-3 rounded-2xl text-center text-sm font-bold flex items-center justify-center gap-1.5 hover:bg-emerald-100">
                            <i class="ph-bold ph-check"></i> ผ่าน
                        </div>
                    </label>
                    <label class="cursor-pointer group">
                        <input type="radio" name="status_${id}" value="ไม่ผ่าน" class="sr-only status-radio">
                        <div class="btn-fail btn-status-radio bg-rose-50 text-rose-600 border-rose-200 py-3 rounded-2xl text-center text-sm font-bold flex items-center justify-center gap-1.5 hover:bg-rose-100">
                            <i class="ph-bold ph-x"></i> ไม่ผ่าน
                        </div>
                    </label>
                    <label class="cursor-pointer group">
                        <input type="radio" name="status_${id}" value="ยังไม่ทำ" checked class="sr-only status-radio">
                        <div class="btn-pending btn-status-radio bg-slate-100 text-slate-500 border-slate-200 py-3 rounded-2xl text-center text-sm font-bold flex items-center justify-center gap-1.5 hover:bg-slate-200">
                            <i class="ph-bold ph-minus"></i> ยังไม่ทำ
                        </div>
                    </label>
                </div>
                
                <div class="mt-4">
                    <input type="text" name="remark_${id}" placeholder="ระบุหมายเหตุ (ถ้ามี)..." 
                           class="w-full p-3 text-sm rounded-xl puffy-input">
                </div>
            </div>`;
        }

        async function submitTorData(event) {
            event.preventDefault();
            
            Swal.fire({
                title: 'ยืนยันผลการตรวจรับ?',
                text: 'คุณกำลังจะบันทึกผลการประเมินเข้าสู่ระบบ',
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#f472b6',
                cancelButtonColor: '#94a3b8',
                confirmButtonText: 'ยืนยันบันทึก',
                cancelButtonText: 'ยกเลิก',
                customClass: {
                    popup: 'rounded-3xl border-4 border-white shadow-2xl',
                    title: 'font-prompt font-extrabold text-slate-800',
                    htmlContainer: 'font-prompt font-medium text-slate-500',
                    confirmButton: 'font-prompt font-bold rounded-xl px-6',
                    cancelButton: 'font-prompt font-bold rounded-xl px-6'
                }
            }).then(async (result) => {
                if (result.isConfirmed) {
                    
                    Swal.fire({
                        icon: 'success',
                        title: 'บันทึกสำเร็จ! 🎉',
                        text: 'ผลการตรวจรับถูกบันทึกเรียบร้อยแล้ว',
                        showConfirmButton: false, 
                        timer: 2000,
                        customClass: {
                            popup: 'rounded-3xl border-4 border-white shadow-2xl',
                            title: 'font-prompt font-extrabold text-emerald-600',
                            htmlContainer: 'font-prompt font-medium text-slate-500'
                        }
                    });
                    
                    document.getElementById('torForm').reset();
                    stationSelect.innerHTML = '<option value="" disabled selected>-- เลือกรหัสสถานี --</option>';
                    stationSelect.disabled = true;
                    stationNameInput.value = "";
                    resetTasksContainer();
                    btnFetchMam.disabled = true;
                    btnSubmit.disabled = true;
                }
            });
        }
    </script>
