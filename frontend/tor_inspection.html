<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรแกรมตรวจรับงานตาม TOR</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-dark@4/dark.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>
    
    <!-- นำเข้าข้อมูลส่วนกลาง -->
    <script src="constants.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: {
                        neon: { gold: '#cca43b', blue: '#3388FF', bg: '#0f1012' }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0f1012; color: #ffffff; font-family: 'Prompt', sans-serif; }
        .input-neon { background-color: #000000; border: 1px solid #444; color: #ffffff; transition: all 0.3s ease; }
        .input-neon:focus { outline: none; border-color: #cca43b; box-shadow: 0 0 8px rgba(204, 164, 59, 0.6); }
        .input-neon:disabled { background-color: #1a1c20; border-color: #333; color: #666; }
        .btn-neon-submit { background: linear-gradient(135deg, #cca43b, #b89334); border: none; color: #000; transition: all 0.3s ease; }
        .btn-neon-submit:hover:not(:disabled) { transform: scale(1.02); box-shadow: 0 0 15px rgba(204, 164, 59, 0.6); }
        .btn-neon-submit:disabled { background: #333; color: #666; cursor: not-allowed; }
        
        /* Custom Styles for Radio Buttons */
        .status-radio:checked + .btn-pass { background-color: rgba(34, 197, 94, 0.2); border-color: #22c55e; color: #4ade80; font-weight: bold; }
        .status-radio:checked + .btn-fail { background-color: rgba(239, 68, 68, 0.2); border-color: #ef4444; color: #f87171; font-weight: bold; }
        .status-radio:checked + .btn-pending { background-color: rgba(156, 163, 175, 0.2); border-color: #9ca3af; color: #d1d5db; font-weight: bold; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">
    
    <header class="bg-gray-900 border-b border-gray-800 sticky top-0 z-50 py-4 shadow-lg">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <a href="index.html" class="w-10 h-10 rounded-lg bg-gray-800 border border-gray-700 flex items-center justify-center hover:bg-gray-700 transition"><i class="fas fa-arrow-left text-white"></i></a>
                <div><h1 class="text-xl md:text-2xl font-bold tracking-wide text-white">ตรวจรับงานตาม <span class="text-neon-gold">TOR</span></h1></div>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8 max-w-4xl flex-grow">
        <form id="torForm" onsubmit="submitTorData(event)" class="space-y-8">
            
            <!-- ส่วนค้นหาข้อมูลสถานี -->
            <div class="bg-gray-800 rounded-xl p-6 border border-gray-700 shadow-xl">
                <h2 class="text-lg font-bold text-white mb-4 border-b border-gray-700 pb-2"><i class="fas fa-search text-neon-gold mr-2"></i> ค้นหาข้อมูลสถานี (เชื่อมโยงแอป MAM)</h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="text-sm font-semibold text-gray-400 block mb-1">ปีงบประมาณ</label>
                        <!-- เปลี่ยนเป็น Select เปล่าๆ เพื่อให้ JavaScript เติมข้อมูลอัตโนมัติ -->
                        <select id="contractYearSelect" required class="w-full p-3 rounded-md input-neon">
                        </select>
                    </div>
                    <div>
                        <label class="text-sm font-semibold text-gray-400 block mb-1">งวดที่ส่งมอบ</label>
                        <select id="periodSelect" required class="w-full p-3 rounded-md input-neon">
                            <option value="งวดที่1">งวดที่ 1</option>
                            <option value="งวดที่2">งวดที่ 2</option>
                            <option value="งวดที่3">งวดที่ 3</option>
                            <option value="งวดที่4">งวดที่ 4</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-sm font-semibold text-gray-400 block mb-1">กลุ่มลุ่มน้ำ</label>
                        <select id="basinSelect" required class="w-full p-3 rounded-md input-neon">
                            <option value="" disabled selected>-- เลือกกลุ่มลุ่มน้ำ --</option>
                            <!-- จะถูกเติมด้วย JavaScript -->
                        </select>
                    </div>
                    <div>
                        <label class="text-sm font-semibold text-gray-400 block mb-1">รหัสสถานี</label>
                        <select id="stationSelect" required disabled class="w-full p-3 rounded-md input-neon">
                            <option value="" disabled selected>-- เลือกรหัสสถานี --</option>
                        </select>
                    </div>
                    <div class="md:col-span-2">
                        <label class="text-sm font-semibold text-gray-400 block mb-1">ชื่อสถานี</label>
                        <input type="text" id="stationNameInput" readonly placeholder="จะแสดงอัตโนมัติเมื่อเลือกสถานี" class="w-full p-3 rounded-md bg-black border border-gray-700 text-neon-gold font-bold text-center">
                    </div>
                </div>

                <button type="button" id="btnFetchMam" onclick="fetchStationWorkData()" disabled class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed mt-2">
                    <i class="fas fa-cloud-download-alt mr-2"></i> ดึงข้อมูลจากระบบ MAM
                </button>
            </div>

            <!-- ส่วนแสดงรายการตรวจรับ (จะถูกสร้างอัตโนมัติ) -->
            <div class="bg-gray-800 rounded-xl p-6 border border-gray-700 shadow-xl min-h-[200px]">
                <h2 class="text-lg font-bold text-white mb-4 border-b border-gray-700 pb-2"><i class="fas fa-tasks text-neon-gold mr-2"></i> ประเมินผลการปฏิบัติงานตาม TOR</h2>
                
                <div id="tasksContainer">
                    <div class="py-12 flex flex-col items-center justify-center text-gray-500">
                        <i class="fas fa-clipboard-list text-4xl mb-3"></i>
                        <p>กรุณาเลือกรหัสสถานีและกดดึงข้อมูลก่อนเพื่อประเมินผล</p>
                    </div>
                </div>
            </div>

            <!-- ปุ่มบันทึก -->
            <div class="py-4">
                <button type="submit" id="btnSubmit" disabled class="btn-neon-submit w-full rounded-lg py-4 font-bold text-lg shadow-lg flex items-center justify-center">
                    <i class="fas fa-save mr-2"></i> บันทึกผลการตรวจรับ
                </button>
            </div>

        </form>
    </main>

    <script>
        // --- อ้างอิง Element ---
        const basinSelect = document.getElementById("basinSelect");
        const stationSelect = document.getElementById("stationSelect");
        const stationNameInput = document.getElementById("stationNameInput");
        const contractYearSelect = document.getElementById("contractYearSelect");
        const periodSelect = document.getElementById("periodSelect");
        const btnFetchMam = document.getElementById("btnFetchMam");
        const btnSubmit = document.getElementById("btnSubmit");
        const tasksContainer = document.getElementById("tasksContainer");

        // --- ตั้งค่า Dropdown ปีงบประมาณ (เริ่ม 2568 ถึง +10 ปี) ---
        const startYear = 2568;
        const totalYears = 10;
        const currentDate = new Date();
        
        // คำนวณปีงบประมาณปัจจุบัน (ถ้าเดือน ตุลาคม-ธันวาคม ให้ปัดเป็นปีงบประมาณถัดไป)
        // getMonth() คืนค่า 0-11 (เดือน 9 คือ ตุลาคม)
        let currentThaiFiscalYear = currentDate.getFullYear() + 543;
        if (currentDate.getMonth() >= 9) { 
            currentThaiFiscalYear += 1;
        }

        // วนลูปสร้าง Option
        for (let i = 0; i <= totalYears; i++) {
            const year = startYear + i;
            const opt = document.createElement("option");
            opt.value = year;
            opt.textContent = year;
            contractYearSelect.appendChild(opt);
        }

        // ตั้งค่าเริ่มต้นเป็นปีปัจจุบัน (ถ้าอยู่ในช่วง 2568 - 2578)
        if (currentThaiFiscalYear >= startYear && currentThaiFiscalYear <= startYear + totalYears) {
            contractYearSelect.value = currentThaiFiscalYear;
        } else {
            // ถ้าหลุดช่วง ให้เลือกปีเริ่มต้นหรือปีล่าสุดตามความเหมาะสม
            contractYearSelect.value = currentThaiFiscalYear > startYear + totalYears ? startYear + totalYears : startYear;
        }

        // --- ตั้งค่า Dropdown จาก constants.js ---
        if (typeof hardcodedBasins !== 'undefined') {
            hardcodedBasins.forEach(b => {
                const opt = document.createElement("option");
                opt.value = b;
                opt.textContent = b;
                basinSelect.appendChild(opt);
            });
        }

        basinSelect.addEventListener("change", () => {
            const selectedBasin = basinSelect.value;
            stationSelect.innerHTML = '<option value="" disabled selected>-- เลือกรหัสสถานี --</option>';
            stationNameInput.value = "";
            btnFetchMam.disabled = true;
            btnSubmit.disabled = true;
            tasksContainer.innerHTML = `<div class="py-12 flex flex-col items-center justify-center text-gray-500"><i class="fas fa-clipboard-list text-4xl mb-3"></i><p>กรุณาเลือกรหัสสถานีและกดดึงข้อมูลก่อนเพื่อประเมินผล</p></div>`;

            if (stationsData[selectedBasin]) {
                stationSelect.disabled = false;
                for (let code in stationsData[selectedBasin]) {
                    const opt = document.createElement("option");
                    opt.value = code;
                    opt.textContent = code;
                    stationSelect.appendChild(opt);
                }
            } else {
                stationSelect.disabled = true;
            }
        });

        stationSelect.addEventListener("change", () => {
            const selectedBasin = basinSelect.value;
            const code = stationSelect.value;
            if (stationsData[selectedBasin] && stationsData[selectedBasin][code]) {
                stationNameInput.value = stationsData[selectedBasin][code];
                btnFetchMam.disabled = false;
            } else {
                stationNameInput.value = "";
                btnFetchMam.disabled = true;
            }
        });

        // --- ลอจิกการดึงข้อมูล MAM จาก Backend ของเรา ---
        async function fetchStationWorkData() {
            const year = contractYearSelect.value;
            
            // ปรับชื่อให้ตรงกับ format ที่เซิร์ฟเวอร์หลักบันทึกไว้ (เช่น "งวดที่1")
            const period = periodSelect.value; 
            const basin = basinSelect.value;
            const stationId = stationSelect.value;

            if (!stationId) return;

            btnFetchMam.disabled = true;
            btnSubmit.disabled = true;

            btnFetchMam.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-2"></i> กำลังตรวจสอบข้อมูล...';
            tasksContainer.innerHTML = `
                <div class="py-12 flex flex-col items-center justify-center text-blue-400">
                    <i class="fas fa-circle-notch fa-spin text-4xl mb-3"></i>
                    <p class="font-semibold">กำลังตรวจสอบผลงานของ ${stationId}...</p>
                </div>`;

            try {
                // อัปเดต URL ให้ตรงกับ Endpoint ที่เราเตรียมไว้ (ใช้ API ตัวเดียวกับหน้า tracking/report)
                const response = await fetch(`https://ma-inspection-project.onrender.com/api/inspections?t=${new Date().getTime()}`);
                const result = await response.json();
                
                if(response.ok && result.success) {
                    // กรองข้อมูลเฉพาะ งวด และ รหัสสถานี ที่ต้องการ
                    // หมายเหตุ: หาก Backend มีการแยกปีด้วย สามารถเพิ่มเงื่อนไข && d.year === year ได้
                    const stationData = result.data.find(d => d.saya === period && d.id_name === stationId);

                    if (stationData) {
                        renderDynamicInspectionTasks(period, stationData);
                        btnFetchMam.innerHTML = '<i class="fas fa-check mr-2"></i> ดึงข้อมูลสำเร็จ';
                        setTimeout(() => { 
                            btnFetchMam.innerHTML = '<i class="fas fa-sync-alt mr-2"></i> ดึงข้อมูลล่าสุด'; 
                            btnFetchMam.disabled = false;
                        }, 2000);
                        btnSubmit.disabled = false; 
                    } else {
                        throw new Error(`ไม่พบข้อมูลการบันทึกของสถานี ${stationId} ใน ${period}`);
                    }
                } else {
                    throw new Error(result.message || "ไม่สามารถติดต่อฐานข้อมูลได้");
                }
            } catch (error) {
                console.error(error);
                tasksContainer.innerHTML = `
                    <div class="text-red-500 p-6 text-center bg-red-900/20 rounded-lg border border-red-900/50">
                        <i class="fas fa-info-circle text-3xl mb-2"></i>
                        <p class="font-semibold">${error.message}</p>
                        <p class="text-sm mt-2 text-gray-400">ผู้รับจ้างอาจจะยังไม่ได้ส่งข้อมูลเข้าระบบ</p>
                    </div>`;
                btnFetchMam.innerHTML = '<i class="fas fa-sync-alt mr-2"></i> ลองดึงข้อมูลใหม่';
                btnFetchMam.disabled = false;
            }
        }

        // --- ฟังก์ชันวาดหน้าจอ (Dynamic Rendering) ---
        function renderDynamicInspectionTasks(period, mamData) {
            let htmlContent = "";

            // 1. งานทั่วไป (ข้อ 1-2)
            htmlContent += `<h3 class="text-white font-bold mb-3 mt-2 border-l-4 border-neon-gold pl-2">งานบำรุงรักษาทั่วไป</h3>`;
            htmlContent += createTaskCard("1", "การทำความสะอาด กำจัดวัชพืชและแมลง", { status: mamData.clean });
            htmlContent += createTaskCard("2", "การตรวจสอบป้ายสถานีสนาม", { status: mamData.pai });
            // เพิ่มเติมหากต้องการ
            htmlContent += createTaskCard("3", "การตรวจสอบระบบไฟฟ้า", { status: mamData.power });

            // 2. งานพิเศษข้อ 4 (อ้างอิงจากฟิลด์ extra_work_tor4 แบบไดนามิก)
            if (mamData.extra_work_tor4 && mamData.extra_work_tor4.length > 0) {
                htmlContent += `<h3 class="text-white font-bold mb-3 mt-6 border-l-4 border-blue-500 pl-2">งานพิเศษ (ข้อมูลจาก MAM)</h3>`;
                
                mamData.extra_work_tor4.forEach((task, index) => {
                    const id = `4.${index+1}`;
                    const amountContext = {
                        amount: task.quantity,
                        unit: task.unit,
                        desc: task.description
                    };
                    htmlContent += createTaskCard(id, task.name, amountContext);
                });
            }

            // 3. แจ้งเตือนหากมีคอมเมนต์เพิ่มเติมจากผู้รับจ้าง
            if (mamData.note) {
                htmlContent = `
                <div class="mb-6 bg-blue-900/40 border border-blue-500 rounded p-4 text-blue-200 text-sm">
                    <strong class="text-blue-400"><i class="fas fa-info-circle"></i> หมายเหตุจากผู้รับจ้าง:</strong> 
                    <br>${mamData.note}
                </div>
                ` + htmlContent;
            }

            tasksContainer.innerHTML = htmlContent;
        }

        function createTaskCard(id, name, mamContext) {
            let mamInfoHtml = "";
            if (mamContext) {
                // เช็คว่าเป็นข้อมูล Pass/Fail หรือ ข้อมูลปริมาณงาน
                let infoText = "";
                if (mamContext.status) {
                    const statusName = mamContext.status === "P" ? "ผ่านเกณฑ์/ปกติ" : (mamContext.status === "O" ? "ชำรุด/มีปัญหา" : mamContext.status);
                    const statusColor = mamContext.status === "P" ? "text-green-400" : (mamContext.status === "O" ? "text-red-400" : "text-gray-400");
                    infoText = `<span class="${statusColor} font-bold bg-black px-2 py-1 rounded border border-gray-700">ช่างบันทึก: ${statusName}</span>`;
                } else if (mamContext.amount !== undefined) {
                    infoText = `<span class="text-blue-400 font-bold bg-black px-2 py-1 rounded border border-blue-900">ปริมาณ: ${mamContext.amount} ${mamContext.unit}</span>`;
                    if(mamContext.desc) infoText += ` <span class="ml-2 text-gray-500 text-xs">(${mamContext.desc})</span>`;
                }

                mamInfoHtml = `
                <div class="mt-2 mb-3 bg-gray-900 rounded p-3 text-sm border border-gray-700 flex justify-between items-center">
                    <span class="text-gray-400"><i class="fas fa-clipboard-check mr-1"></i> ข้อมูลบันทึกจากสนาม:</span>
                    ${infoText}
                </div>`;
            }

            return `
            <div class="p-4 md:p-5 border border-gray-700 rounded-lg bg-black hover:border-gray-500 transition-colors mb-4 shadow-lg">
                <p class="text-sm font-semibold text-gray-200 mb-2 break-words">${id}. ${name}</p>
                ${mamInfoHtml}
                
                <input type="hidden" name="taskId[]" value="${id}">
                <input type="hidden" name="taskName[]" value="${name}">
                
                <div class="grid grid-cols-3 gap-2 mt-2">
                    <label class="cursor-pointer group">
                        <input type="radio" name="status_${id}" value="ผ่าน" class="sr-only status-radio">
                        <div class="btn-pass border border-gray-700 text-gray-400 py-2.5 rounded text-center text-sm transition-all group-hover:border-green-500 group-hover:text-green-400">
                            <i class="fas fa-check-circle mr-1"></i> ผ่าน
                        </div>
                    </label>
                    <label class="cursor-pointer group">
                        <input type="radio" name="status_${id}" value="ไม่ผ่าน" class="sr-only status-radio">
                        <div class="btn-fail border border-gray-700 text-gray-400 py-2.5 rounded text-center text-sm transition-all group-hover:border-red-500 group-hover:text-red-400">
                            <i class="fas fa-times-circle mr-1"></i> ไม่ผ่าน
                        </div>
                    </label>
                    <label class="cursor-pointer group">
                        <input type="radio" name="status_${id}" value="ยังไม่ทำ" checked class="sr-only status-radio">
                        <div class="btn-pending border border-gray-700 text-gray-400 py-2.5 rounded text-center text-sm transition-all group-hover:border-gray-400 group-hover:text-white">
                            <i class="fas fa-minus-circle mr-1"></i> ยังไม่ทำ
                        </div>
                    </label>
                </div>
                
                <div class="mt-3">
                    <input type="text" name="remark_${id}" placeholder="ระบุหมายเหตุ (ถ้ามี)..." class="w-full p-2.5 text-sm rounded bg-gray-900 border border-gray-700 text-white focus:border-neon-gold focus:outline-none transition-colors">
                </div>
            </div>`;
        }

        async function submitTorData(event) {
            event.preventDefault();
            
            Swal.fire({
                title: 'ยืนยันผลการตรวจรับ?',
                text: 'คุณกำลังจะบันทึกผลการประเมินเข้าสู่ระบบ',
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#cca43b',
                cancelButtonColor: '#333',
                confirmButtonText: 'ยืนยัน',
                cancelButtonText: 'ยกเลิก',
                background: '#1a1c20', color: '#fff'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    // โค้ดสำหรับส่งข้อมูลไปยัง Backend สามารถเขียนเพิ่มเติมได้ที่นี่
                    // เช่น รวบรวมข้อมูลจากฟอร์ม แล้ว fetch POST ไปที่ API
                    
                    Swal.fire({
                        icon: 'success',
                        title: 'บันทึกสำเร็จ',
                        text: 'ผลการตรวจรับถูกบันทึกเรียบร้อยแล้ว',
                        background: '#1a1c20', color: '#fff',
                        showConfirmButton: false, timer: 2000
                    });
                    
                    // เคลียร์หน้าจอ
                    document.getElementById('torForm').reset();
                    stationSelect.innerHTML = '<option value="" disabled selected>-- เลือกรหัสสถานี --</option>';
                    stationSelect.disabled = true;
                    stationNameInput.value = "";
                    tasksContainer.innerHTML = `<div class="py-12 flex flex-col items-center justify-center text-gray-500"><i class="fas fa-clipboard-list text-4xl mb-3"></i><p>กรุณาเลือกรหัสสถานีและกดดึงข้อมูลก่อนเพื่อประเมินผล</p></div>`;
                    btnFetchMam.disabled = true;
                    btnSubmit.disabled = true;
                }
            });
        }
    </script>
</body>
</html>
