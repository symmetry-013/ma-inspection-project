<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ติดตามสถานะความคืบหน้าการตรวจสถานี</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- นำเข้าข้อมูลส่วนกลาง (hardcodedBasins, stationsData) -->
    <script src="constants.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #fffbeb; 
            color: #334155;
            background-image: radial-gradient(#fde047 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }

        .puffy-container {
            background-color: #ffffff;
            border-radius: 28px;
            border: 4px solid #f8fafc;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.01);
        }

        .puffy-input {
            background-color: #f8fafc;
            border: 2px solid #e2e8f0;
            color: #334155;
            transition: all 0.2s ease;
            font-weight: 600;
        }
        .puffy-input:focus {
            outline: none;
            border-color: #ea580c;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(234, 88, 12, 0.15);
        }

        .btn-puffy-orange {
            background-color: #ea580c;
            color: white;
            border-radius: 16px;
            box-shadow: 0 6px 0 #c2410c;
            transition: all 0.1s ease;
        }
        .btn-puffy-orange:active:not(:disabled) { transform: translateY(6px); box-shadow: 0 0px 0 #c2410c; }

        .progress-card {
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 22px;
            transition: all 0.2s ease;
            overflow: hidden;
        }
        .progress-card:hover {
            border-color: #fed7aa;
            box-shadow: 0 10px 25px -5px rgba(234, 88, 12, 0.1);
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col pb-12">

    <!-- Header -->
    <header class="bg-white/95 backdrop-blur-md border-b-4 border-orange-100 sticky top-0 z-40 py-3.5 shadow-sm">
        <div class="container mx-auto px-4 flex justify-between items-center max-w-6xl">
            <div class="flex items-center space-x-3 md:space-x-4">
                <a href="index.html" class="w-11 h-11 md:w-12 md:h-12 rounded-2xl bg-white border-2 border-slate-200 flex items-center justify-center text-slate-500 hover:text-orange-500 hover:border-orange-200 transition-all shadow-sm active:translate-y-1 shrink-0">
                    <i class="ph-bold ph-caret-left text-2xl"></i>
                </a>
                <div class="hidden sm:flex w-12 h-12 rounded-2xl bg-orange-100 border-2 border-orange-300 items-center justify-center shadow-sm shrink-0">
                    <i class="ph-fill ph-compass text-orange-500 text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-lg md:text-2xl font-extrabold text-slate-800 tracking-tight">
                        ติดตามสถานะ <span class="text-orange-500">ความคืบหน้าการตรวจงาน</span>
                    </h1>
                    <p class="text-[11px] md:text-xs font-bold text-slate-400">
                        ตรวจสอบสถิติการปฏิบัติงานเทียบกับรายชื่อสถานีมาตรฐานจาก constants.js
                    </p>
                </div>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-6 max-w-6xl flex-grow space-y-6">

        <!-- ตัวกรองข้อมูล -->
        <div class="puffy-container p-5 md:p-7 border-t-8 border-t-orange-500">
            <h2 class="text-sm md:text-base font-extrabold text-slate-700 mb-4 flex items-center gap-2 border-b-2 border-slate-100 pb-2.5">
                <i class="ph-bold ph-funnel text-orange-500 text-lg"></i> ตัวกรองการติดตามสถานะ
            </h2>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5 mb-5">
                <div>
                    <label class="text-xs font-bold text-slate-500 block mb-1">ปีงบประมาณ</label>
                    <select id="filterYear" onchange="processTrackingData()" class="w-full p-3 text-sm rounded-xl puffy-input">
                        <option value="all">-- ทุกปีงบประมาณ --</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-500 block mb-1">งวดการตรวจสอบ</label>
                    <select id="filterPeriod" onchange="processTrackingData()" class="w-full p-3 text-sm rounded-xl puffy-input">
                        <option value="all">-- ทุกงวด --</option>
                        <option value="งวดที่1">งวดที่ 1</option>
                        <option value="งวดที่2">งวดที่ 2</option>
                        <option value="งวดที่3">งวดที่ 3</option>
                        <option value="งวดที่4">งวดที่ 4</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-500 block mb-1">กลุ่มลุ่มน้ำ</label>
                    <select id="filterBasin" onchange="processTrackingData()" class="w-full p-3 text-sm rounded-xl puffy-input">
                        <option value="all">-- ทุกกลุ่มลุ่มน้ำ --</option>
                    </select>
                </div>
            </div>

            <button type="button" onclick="loadTrackingData()" id="btnRefresh"
                    class="btn-puffy-orange w-full py-3.5 text-sm md:text-base font-extrabold flex items-center justify-center gap-2">
                <i class="ph-bold ph-arrows-clockwise text-xl"></i> โหลดข้อมูลและคำนวณความคืบหน้า
            </button>
        </div>

        <!-- แถบสรุปภาพรวม -->
        <div class="grid grid-cols-2 lg:grid-cols-3 gap-4">
            <div class="bg-white border-2 border-slate-200 rounded-2xl p-4 md:p-5 shadow-sm flex items-center gap-3.5">
                <div class="w-12 h-12 rounded-2xl bg-orange-50 text-orange-500 flex items-center justify-center text-2xl shrink-0">
                    <i class="ph-fill ph-map-pin"></i>
                </div>
                <div>
                    <span class="block text-[11px] font-bold text-slate-400 uppercase">สถานีในระบบทั้งหมด</span>
                    <span id="statTotalStations" class="block text-xl md:text-2xl font-black text-slate-800">0 สถานี</span>
                </div>
            </div>

            <div class="bg-white border-2 border-emerald-200 rounded-2xl p-4 md:p-5 shadow-sm flex items-center gap-3.5">
                <div class="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-500 flex items-center justify-center text-2xl shrink-0">
                    <i class="ph-fill ph-check-circle"></i>
                </div>
                <div>
                    <span class="block text-[11px] font-bold text-slate-400 uppercase">ตรวจแล้ว (สำเร็จ)</span>
                    <span id="statCheckedStations" class="block text-xl md:text-2xl font-black text-emerald-600">0 สถานี</span>
                </div>
            </div>

            <div class="col-span-2 lg:col-span-1 bg-white border-2 border-amber-200 rounded-2xl p-4 md:p-5 shadow-sm flex items-center gap-3.5">
                <div class="w-12 h-12 rounded-2xl bg-amber-50 text-amber-500 flex items-center justify-center text-2xl shrink-0">
                    <i class="ph-fill ph-clock"></i>
                </div>
                <div>
                    <span class="block text-[11px] font-bold text-slate-400 uppercase">ยังไม่ตรวจ (ค้างอยู่)</span>
                    <span id="statPendingStations" class="block text-xl md:text-2xl font-black text-amber-600">0 สถานี</span>
                </div>
            </div>
        </div>

        <!-- พื้นที่แสดงความคืบหน้าแยกตามลุ่มน้ำ -->
        <div id="basinProgressContainer" class="space-y-4">
            <div class="py-16 text-center bg-white rounded-3xl border-4 border-slate-100 text-orange-500">
                <i class="ph-bold ph-spinner animate-spin text-4xl mb-2"></i>
                <p class="font-extrabold text-sm">กำลังประมวลผลความคืบหน้า...</p>
            </div>
        </div>

    </main>

    <script>
        // =========================================================================
        // แก้ไขปัญหา APK: ชี้ไปที่เซิร์ฟเวอร์ Render เสมอเมื่อไม่ได้รันผ่านพอร์ตพัฒนาบน PC
        // =========================================================================
        const isLocalPcDev = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') 
                             && (window.location.port === '3000' || window.location.port === '5000');
        const API_BASE = isLocalPcDev ? '' : 'https://ma-inspection-project.onrender.com';

        let rawInspections = [];

        const safeEscape = (str) => {
            if (typeof escapeHtml === 'function') return escapeHtml(str);
            return String(str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        };

        function getFiscalYear(item) {
            if (item.contractYear && String(item.contractYear).trim() !== '') {
                return String(item.contractYear).trim();
            }
            const d = new Date(item.timestamp || item.createdAt);
            if (isNaN(d.getTime())) return '';
            let y = d.getFullYear() + 543;
            if (d.getMonth() >= 9) y += 1;
            return String(y);
        }

        window.onload = () => {
            const filterYear = document.getElementById('filterYear');
            const startYear = 2568;
            for (let i = 0; i <= 10; i++) {
                const y = startYear + i;
                filterYear.innerHTML += `<option value="${y}">${y}</option>`;
            }

            const filterBasin = document.getElementById('filterBasin');
            let basinsList = [];
            if (typeof hardcodedBasins !== 'undefined' && Array.isArray(hardcodedBasins)) {
                basinsList = hardcodedBasins;
            } else if (typeof stationsData !== 'undefined') {
                basinsList = Object.keys(stationsData);
            }

            basinsList.forEach(b => {
                filterBasin.innerHTML += `<option value="${safeEscape(b)}">${safeEscape(b)}</option>`;
            });

            loadTrackingData();
        };

        async function loadTrackingData() {
            const btn = document.getElementById('btnRefresh');
            btn.disabled = true;

            try {
                const response = await fetch(`${API_BASE}/api/inspections`, {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' }
                });

                const contentType = response.headers.get("content-type") || "";
                if (!contentType.includes("application/json")) {
                    throw new Error("เซิร์ฟเวอร์กำลังตื่นตัว กรุณารอ 10 วินาทีแล้วลองอีกครั้ง");
                }

                const result = await response.json();
                if (response.ok && result.success) {
                    rawInspections = Array.isArray(result.data) ? result.data : [];
                    processTrackingData();
                } else {
                    throw new Error(result.message || 'ไม่สามารถดึงข้อมูลได้');
                }
            } catch (error) {
                alert('❌ เกิดข้อผิดพลาด: ' + error.message);
            } finally {
                btn.disabled = false;
            }
        }

        function processTrackingData() {
            const year = document.getElementById('filterYear').value;
            const period = document.getElementById('filterPeriod').value;
            const selectedBasin = document.getElementById('filterBasin').value;

            // กรองข้อมูลการตรวจจริงตามฟิลเตอร์
            const filteredInspections = rawInspections.filter(item => {
                if (year !== 'all' && getFiscalYear(item) !== year) return false;
                if (period !== 'all') {
                    const pNum = period.replace(/\D/g, '');
                    const itemP = String(item.saya || item.period || '').replace(/\s+/g, '');
                    if (!itemP.includes(pNum) && itemP !== period) return false;
                }
                return true;
            });

            // สร้าง Set ของรหัสสถานีที่ตรวจแล้ว (แปลงเป็นตัวพิมพ์ใหญ่เพื่อความแม่นยำ)
            const checkedStationCodes = new Set();
            filteredInspections.forEach(item => {
                const code = String(item.id_name || '').trim().toUpperCase();
                if (code) checkedStationCodes.add(code);
            });

            let basinsToProcess = [];
            if (typeof stationsData !== 'undefined') {
                basinsToProcess = Object.keys(stationsData);
            } else if (typeof hardcodedBasins !== 'undefined') {
                basinsToProcess = hardcodedBasins;
            }

            if (selectedBasin !== 'all') {
                basinsToProcess = basinsToProcess.filter(b => b === selectedBasin);
            }

            let grandTotal = 0;
            let grandChecked = 0;
            let basinProgressArray = [];

            basinsToProcess.forEach(bName => {
                const stationMap = (typeof stationsData !== 'undefined' && stationsData[bName]) ? stationsData[bName] : {};
                const stCodes = Object.keys(stationMap);
                const totalInBasin = stCodes.length;

                let checkedInBasin = 0;
                const stationDetails = [];

                stCodes.forEach(code => {
                    const normCode = code.trim().toUpperCase();
                    const isChecked = checkedStationCodes.has(normCode);
                    if (isChecked) checkedInBasin++;
                    stationDetails.push({
                        code,
                        name: stationMap[code] || code,
                        isChecked
                    });
                });

                grandTotal += totalInBasin;
                grandChecked += checkedInBasin;

                basinProgressArray.push({
                    basinName,
                    total: totalInBasin,
                    checked: checkedInBasin,
                    percent: totalInBasin > 0 ? Math.round((checkedInBasin / totalInBasin) * 100) : 0,
                    stations: stationDetails
                });
            });

            const grandPending = grandTotal - grandChecked;

            document.getElementById('statTotalStations').textContent = `${grandTotal} สถานี`;
            document.getElementById('statCheckedStations').textContent = `${grandChecked} สถานี`;
            document.getElementById('statPendingStations').textContent = `${grandPending} สถานี`;

            renderBasinProgressCards(basinProgressArray);
        }

        function renderProgressCards(array) {
            renderBasinProgressCards(array);
        }

        function renderBasinProgressCards(array) {
            const container = document.getElementById('basinProgressContainer');
            if (!array || array.length === 0) {
                container.innerHTML = `<div class="p-8 text-center bg-white rounded-2xl text-slate-400 font-bold">ไม่พบข้อมูลลุ่มน้ำ</div>`;
                return;
            }

            let html = '';
            array.forEach(b => {
                const barColor = b.percent === 100 ? 'bg-emerald-500' : (b.percent > 50 ? 'bg-orange-500' : 'bg-amber-500');

                const stationTags = b.stations.map(st => `
                    <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-xs font-bold border ${st.isChecked ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-slate-50 text-slate-400 border-slate-200'}">
                        <i class="ph-bold ${st.isChecked ? 'ph-check-circle text-emerald-600' : 'ph-clock'}"></i>
                        <span>${safeEscape(st.code)} (${safeEscape(st.name)})</span>
                    </span>
                `).join('');

                html += `
                <div class="progress-card p-5 md:p-6">
                    <div class="flex flex-wrap justify-between items-center gap-3 mb-3">
                        <h3 class="text-base md:text-lg font-black text-slate-800 flex items-center gap-2">
                            <i class="ph-fill ph-waves text-orange-500"></i> กลุ่มลุ่มน้ำ${safeEscape(b.basinName)}
                        </h3>
                        <div class="flex items-center gap-3 text-xs font-extrabold">
                            <span class="bg-emerald-100 text-emerald-800 px-3 py-1 rounded-xl">ตรวจแล้ว: ${b.checked} สถานี</span>
                            <span class="bg-slate-100 text-slate-700 px-3 py-1 rounded-xl">ทั้งหมด: ${b.total} สถานี</span>
                            <span class="text-orange-600 font-black text-sm">${b.percent}%</span>
                        </div>
                    </div>

                    <!-- หลอดแสดงเปอร์เซ็นต์ความคืบหน้า -->
                    <div class="w-full h-3 bg-slate-100 rounded-full overflow-hidden mb-4">
                        <div class="h-full ${barColor} transition-all duration-500 rounded-full" style="width: ${b.percent}%"></div>
                    </div>

                    <!-- รายชื่อสถานีย่อย -->
                    <details class="group">
                        <summary class="cursor-pointer text-xs font-extrabold text-orange-600 hover:text-orange-700 select-none">
                            ดูรายชื่อสถานีทั้งหมดในลุ่มน้ำนี้ (${b.total} สถานี)
                        </summary>
                        <div class="flex flex-wrap gap-1.5 mt-3 pt-3 border-t border-slate-100 max-h-48 overflow-y-auto">
                            ${stationTags}
                        </div>
                    </details>
                </div>`;
            });

            container.innerHTML = html;
        }
    </script>
</body>
</html>
