<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบติดตามสถานะสถานี (Map) - MA Inspection</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- นำเข้า Constants -->
    <script src="constants.js"></script>
    <style>
        html, body { font-family: 'Prompt', sans-serif; margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #f8fafc; }
        #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; z-index: 1; background-color: #e5e5e5; }
        .leaflet-popup-content-wrapper { border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2); padding: 0; overflow: hidden; }
        .leaflet-popup-content { margin: 0; line-height: 1.5; width: 240px !important; }
        .simple-tooltip { background: rgba(255, 255, 255, 0.95); border: 1px solid #e5e7eb; border-radius: 8px; font-family: 'Prompt', sans-serif; font-size: 11px; font-weight: 600; padding: 4px 8px; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; } .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } } .spin { animation: spin 1s linear infinite; }
        .filter-btn { transition: all 0.2s ease; cursor: pointer; user-select: none; } .filter-btn.active { border-color: #3b82f6; background-color: #eff6ff; }
    </style>
</head>
<body class="relative">
    <div id="map"></div>
    <div id="loadingUI" class="absolute inset-0 z-[2000] bg-white/90 backdrop-blur-md flex flex-col items-center justify-center transition-opacity duration-300">
        <div class="animate-spin rounded-full h-12 w-12 border-b-4 border-blue-600 mb-4 shadow-lg"></div><p class="text-gray-800 font-bold text-sm tracking-wide">กำลังเตรียมข้อมูล...</p>
    </div>

    <div class="absolute top-0 left-0 w-full p-3 z-[1000] pointer-events-none flex justify-between items-start flex-col md:flex-row gap-3">
        <div class="bg-white/95 p-3.5 rounded-2xl shadow-lg border border-gray-100 pointer-events-auto w-full md:w-auto md:max-w-md backdrop-blur-sm transition-all duration-300">
            <div id="dashboardHeader" class="flex justify-between items-center mb-3 border-b border-gray-100 pb-3">
                <div class="flex items-center gap-2 mr-4">
                    <a href="index.html" class="text-slate-400 hover:text-blue-600 p-2"><i class="fas fa-arrow-left"></i></a>
                    <h1 class="text-sm font-bold text-slate-800">แผนที่สถานี</h1>
                </div>
                <div class="flex items-center gap-2">
                    <select id="basinFilter" onchange="renderMap()" class="text-xs border border-gray-200 rounded-lg px-2.5 py-1.5"><option value="ALL">ทุกลุ่มน้ำ</option></select>
                    <button onclick="toggleDashboard()" class="p-1.5 text-slate-400"><svg id="toggleIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path></svg></button>
                </div>
            </div>
            <div id="dashboardContent" class="overflow-hidden transition-all duration-300 opacity-100 max-h-[500px]">
                <div class="flex flex-wrap gap-2 text-[10px] md:text-xs">
                    <div onclick="setStatusFilter('ALL')" id="btnFilterALL" class="filter-btn active px-3 py-1.5 rounded-full border border-blue-500 bg-blue-50 text-blue-700 font-semibold flex items-center gap-1.5">ทั้งหมด <span id="countALL" class="bg-blue-200 px-1.5 py-0.5 rounded-md">0</span></div>
                    <div onclick="setStatusFilter('P')" id="btnFilterP" class="filter-btn px-3 py-1.5 rounded-full border border-slate-200 bg-white text-slate-600 font-semibold flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-emerald-500 border border-emerald-600"></span>สมบูรณ์ (P) <span id="countP" class="bg-slate-100 px-1.5 py-0.5 rounded-md">0</span></div>
                    <div onclick="setStatusFilter('O')" id="btnFilterO" class="filter-btn px-3 py-1.5 rounded-full border border-slate-200 bg-white text-slate-600 font-semibold flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-rose-500 border border-rose-600"></span>มีชำรุด (O) <span id="countO" class="bg-slate-100 px-1.5 py-0.5 rounded-md">0</span></div>
                </div>
            </div>
        </div>
        <button id="refreshBtn" onclick="loadData()" class="pointer-events-auto bg-white/95 text-slate-700 px-3.5 py-2.5 rounded-xl shadow-lg border border-gray-100 flex items-center gap-2"><svg id="refreshIcon" class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg><span class="font-semibold text-xs">โหลดใหม่</span></button>
    </div>

    <script>
        let map; let markersLayer; let allStationData = []; let currentStatusSelection = 'ALL'; let isDashboardOpen = true;
        const mockData = [{ code: 'MOCK-01', name: 'ไม่มีข้อมูลจำลองให้แสดงผล', location: '-', basin: '-', statusUsage: 'P', lat: 13.7563, lng: 100.5018, photos: [] }];

        function toggleDashboard() {
            isDashboardOpen = !isDashboardOpen;
            const content = document.getElementById('dashboardContent'); const icon = document.getElementById('toggleIcon');
            if (isDashboardOpen) { content.classList.replace('max-h-0', 'max-h-[500px]'); content.classList.replace('opacity-0', 'opacity-100'); icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path>'; } 
            else { content.classList.replace('max-h-[500px]', 'max-h-0'); content.classList.replace('opacity-100', 'opacity-0'); icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>'; }
        }

        async function loadData() {
            if (!map) return;
            document.getElementById('refreshIcon').classList.add('spin');
            try {
                const response = await fetch('/api/inspections');
                const result = await response.json();
                if (result.success) {
                    const transformedData = [];
                    result.data.forEach(row => {
                        if (!row.lat || !row.lon) return;
                        let isBroken = false; let defectsList = [];
                        Object.keys(equipmentMap).forEach(key => {
                            const val = row[key];
                            if (typeof val === 'string' && val.trim().toUpperCase() === "O") { isBroken = true; defectsList.push(equipmentMap[key]); } 
                            else if (['b2', 'sta2', 'pole2'].includes(key)) { let n = Number(val); if (!isNaN(n) && n > 0) { isBroken = true; defectsList.push(`${equipmentMap[key]} (${n})`); } }
                        });
                        transformedData.push({
                            code: row.id_name || '-', name: row.name_id || 'ไม่ระบุชื่อ', location: row.geoAddress || row.install_status || '-', basin: row.code || '-',
                            statusUsage: isBroken ? 'O' : 'P', statusClean: row.clean ? row.clean.trim().toUpperCase() : '-',
                            defects: defectsList.join(', '), remark: row.note || '-', comment: row.note2 || '-', lat: row.lat, lng: row.lon, photos: row.photos || []
                        });
                    });
                    allStationData = transformedData.length > 0 ? transformedData : mockData;
                }
            } catch (err) { allStationData = mockData; } 
            finally {
                document.getElementById('refreshIcon').classList.remove('spin');
                const loader = document.getElementById('loadingUI');
                if(loader) { loader.style.opacity = '0'; setTimeout(() => loader.style.display = 'none', 300); }
                updateBasinDropdown(); renderMap();
            }
        }

        function updateBasinDropdown() {
            const select = document.getElementById('basinFilter'); const currentVal = select.value;
            const basins = [...new Set(allStationData.map(d => d.basin).filter(b => b && b !== '-'))].sort();
            let optionsHtml = '<option value="ALL">ทุกลุ่มน้ำ</option>';
            basins.forEach(b => optionsHtml += `<option value="${b}">${b}</option>`);
            select.innerHTML = optionsHtml; if ([...select.options].some(o => o.value === currentVal)) select.value = currentVal;
        }

        function setStatusFilter(status) {
            currentStatusSelection = status;
            document.querySelectorAll('.filter-btn').forEach(btn => { btn.classList.remove('active', 'border-blue-500', 'bg-blue-50', 'text-blue-700'); btn.classList.add('border-slate-200', 'bg-white', 'text-slate-600'); });
            const activeBtn = document.getElementById('btnFilter' + status);
            if (activeBtn) { activeBtn.classList.remove('border-slate-200', 'bg-white', 'text-slate-600'); activeBtn.classList.add('active', 'border-blue-500', 'bg-blue-50', 'text-blue-700'); }
            renderMap();
        }

        function renderMap() {
            if (!markersLayer) return; markersLayer.clearLayers();
            const selectedBasin = document.getElementById('basinFilter').value;
            let finalData = selectedBasin !== 'ALL' ? allStationData.filter(d => d.basin === selectedBasin) : allStationData;
            document.getElementById('countALL').innerText = finalData.length;
            document.getElementById('countP').innerText = finalData.filter(d => d.statusUsage === 'P').length;
            document.getElementById('countO').innerText = finalData.filter(d => d.statusUsage === 'O').length;

            if (currentStatusSelection !== 'ALL') finalData = finalData.filter(d => d.statusUsage === currentStatusSelection);

            const groupedData = {};
            finalData.forEach(p => { const key = p.lat.toFixed(5)+','+p.lng.toFixed(5); if(!groupedData[key]) groupedData[key]=[]; groupedData[key].push(p); });
            const bounds = [];

            Object.values(groupedData).forEach(group => {
                const hasO = group.some(p => p.statusUsage === 'O'); const hasP = group.some(p => p.statusUsage === 'P');
                let fc = hasO ? '#f43f5e' : (hasP ? '#10b981' : '#ffffff'); let sc = hasO ? '#e11d48' : (hasP ? '#059669' : '#94a3b8');

                let stationsHtml = group.map((p, i) => {
                    // ✅ XSS Protection
                    const safeName = escapeHtml(p.name); const safeLoc = escapeHtml(p.location); const safeDefects = escapeHtml(p.defects); const safeRemark = escapeHtml(p.remark); const safeComment = escapeHtml(p.comment);
                    const usageText = p.statusUsage === 'P' ? '<span class="text-emerald-700 bg-emerald-100 px-1.5 py-0.5 rounded text-[10px] font-bold">สมบูรณ์</span>' : '<span class="text-rose-700 bg-rose-100 px-1.5 py-0.5 rounded text-[10px] font-bold">มีชำรุด</span>';
                    const cleanText = p.statusClean === 'P' ? '<span class="text-emerald-600 font-bold">ผ่าน</span>' : (p.statusClean === 'O' ? '<span class="text-rose-600 font-bold">ไม่ผ่าน</span>' : '-');
                    const defectsHtml = safeDefects ? `<div class="mt-2 p-2 bg-rose-50 border border-rose-100 rounded text-[10px]"><div class="font-bold text-rose-800 mb-0.5">ชำรุด:</div><div class="text-rose-600">${safeDefects}</div></div>` : '';
                    const extra = (safeRemark !== '-' ? `<div>หมายเหตุ: ${safeRemark}</div>` : '') + (safeComment !== '-' ? `<div>กรรมการ: ${safeComment}</div>` : '');
                    
                    let photoHtml = p.photos.length > 0 ? `<div class="mt-2 mb-1 relative border border-slate-200 rounded-lg overflow-hidden"><a href="${p.photos[0].webViewLink}" target="_blank"><img src="${p.photos[0].thumbnailUrl}" class="w-full h-24 object-cover"><div class="absolute bottom-0 w-full bg-slate-900/60 text-white text-center text-[9px] py-1">ดูภาพ (${p.photos.length})</div></a></div>` : '';
                    return `<div class="p-3 ${i>0?'border-t border-slate-200':''}"><h3 class="text-sm font-bold text-slate-800 pb-1">${safeName}</h3>${photoHtml}<div class="text-xs mt-2 space-y-1"><div class="flex justify-between"><span class="text-slate-500">รหัส:</span><b>${p.code}</b></div><div class="flex justify-between gap-2"><span class="text-slate-500">ที่ตั้ง:</span><span class="text-right truncate" title="${safeLoc}">${safeLoc}</span></div><div class="flex justify-between"><span class="text-slate-500">สถานะ:</span>${usageText}</div>${defectsHtml}<div class="text-[10px] text-slate-600 mt-1">${extra}</div></div></div>`;
                }).join('');

                const circle = L.circleMarker([group[0].lat, group[0].lng], { radius: group.length>1?9:7, fillColor: fc, color: sc, weight: 2.5, fillOpacity: 0.95 });
                circle.bindTooltip(group.length>1 ? `${group.length} สถานี` : group[0].code, { permanent: true, direction: 'bottom', className: 'simple-tooltip' });
                circle.bindPopup(`<div class="w-full max-h-[300px] overflow-y-auto custom-scrollbar bg-white">${stationsHtml}</div>`);
                circle.addTo(markersLayer); bounds.push([group[0].lat, group[0].lng]);
            });
            if (bounds.length > 0) map.fitBounds(bounds, { padding: [50, 50], maxZoom: 12 });
        }

        document.addEventListener('DOMContentLoaded', () => {
            map = L.map('map', { zoomControl: false }).setView([13.7563, 100.5018], 6);
            L.control.zoom({ position: 'bottomright' }).addTo(map);
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { attribution: '&copy; Esri', maxZoom: 19 }).addTo(map);
            markersLayer = L.layerGroup().addTo(map);
            setTimeout(loadData, 500);
        });
    </script>
</body>
</html>
